const CHAMPS=[
 ['qui','Qui ? Qui a lancé cette action ?','Cette action a été lancée par…'],
 ['comment','Quoi ? Comment ça marche ?','D\'abord… Ensuite…'],
 ['buts','Pourquoi ? Quel est son but ?','Son but est de…'],
 ['resultats','Ce que ça a changé (si tu le trouves)','Aujourd\'hui…']
];
const ROLES=[['r1','Présente le début'],['r2','Présente la suite'],['r3','Fait les images'],['r4','Répond en premier aux questions']];

const PX=i=>40+i*96,PY=i=>i%2?84:36;
function cheminPlan(){
  const nim=MC.nimbusSvg('content').replace(/^<svg[^>]*>/,'').replace('</svg>','');
  return MC.svg(`<svg class="m4-chemin" viewBox="0 0 560 122">
  <path d="M${PX(0)} ${PY(0)}${[1,2,3,4,5].map(i=>`L${PX(i)} ${PY(i)}`).join('')}" fill="none" stroke="${NUIT}" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round"/>
  ${PLAN.map((p,i)=>`<g class="m4-etape" data-i="${i}"><circle cx="${PX(i)}" cy="${PY(i)}" r="25"/><text x="${PX(i)}" y="${PY(i)+9}" text-anchor="middle" font-size="25" font-weight="700">${i+1}</text><path class="m4-coche" d="M${PX(i)-11} ${PY(i)+1}l8 9 15-18"/></g>`).join('')}
  <g class="m4-chnim"><g transform="scale(.46)">${nim}</g></g>
  </svg>`);
}

function chrono(){
  const MAX=360;let cumul=0,debut=0,marche=false,tic=0,phase=-1;
  const nim=MC.nimbusSvg('content').replace(/^<svg[^>]*>/,'').replace('</svg>','');
  const X=s=>40+490*Math.min(s,MAX)/MAX;
  const s=MC.svg(`<svg class="m4-piste" viewBox="0 0 560 156">
  <defs><pattern id="m4-hach" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#E2F4E6"/><rect width="4" height="10" fill="#A9DAB6"/></pattern></defs>
  <text x="${(X(180)+X(300))/2}" y="30" text-anchor="middle" font-size="22" font-weight="600" fill="#14562B">La bonne durée</text>
  <rect x="${X(180)}" y="42" width="${X(300)-X(180)}" height="72" rx="8" fill="url(#m4-hach)" stroke="#1F7A3D" stroke-width="3"/>
  <path d="M40 78H530" stroke="${NUIT}" stroke-width="6" stroke-linecap="round"/>
  <path d="M40 66v24M${X(180)} 42v72M${X(300)} 42v72" stroke="${NUIT}" stroke-width="3"/>
  <g font-size="22" fill="${NUIT}" text-anchor="middle"><text x="40" y="142">0</text><text x="${X(180)}" y="142">3 min</text><text x="${X(300)}" y="142">5 min</text></g>
  <g class="m4-chnim"><g transform="scale(.66)">${nim}</g></g></svg>`);
  const n=s.querySelector('.m4-chnim');
  const aff=h('div',{class:'m4-tps',role:'timer'},'0 min 00 s');
  const msg=h('p',{class:'lue','aria-live':'polite'});
  const go=h('button',{type:'button',class:'btn go',onclick:()=>marche?pause():lancer()});
  const dessinerGo=()=>go.replaceChildren(MC.icone(marche?'pause':'lecture'),h('span',null,marche?'Pause':(cumul?'Reprendre':'Lancer le chrono')));
  const rz=h('button',{type:'button',class:'btn',onclick:()=>{pause();cumul=0;phase=-1;maj();}},MC.icone('refaire'),'Remettre à zéro');
  const sec=()=>Math.floor((cumul+(marche?Date.now()-debut:0))/1000);
  function maj(){
    if(marche&&!s.isConnected){clearInterval(tic);marche=false;return;}
    const t=sec();
    aff.textContent=`${Math.floor(t/60)} min ${String(t%60).padStart(2,'0')} s`;
    n.style.transform=`translate(${X(t)-33}px,52px)`;
    const f=t<180?0:t<=300?1:2;
    if(f!==phase){if(phase>=0&&marche)MC.son.ok();phase=f;
      msg.textContent=['Tu t\'échauffes. Parle tranquillement.','C\'est la bonne durée. Tu peux finir quand tu veux.','Tu as beaucoup à dire ! La prochaine fois, garde seulement le plus important.'][f];}
  }
  function lancer(){debut=Date.now();marche=true;dessinerGo();clearInterval(tic);tic=setInterval(maj,250);maj();}
  function pause(){if(marche){cumul+=Date.now()-debut;marche=false;clearInterval(tic);}dessinerGo();maj();}
  const el=h('div',{class:'stack'},MC.fig(s,null,'Une piste de 6 minutes. Nimbus avance avec le temps. La zone entre 3 et 5 minutes est la bonne durée.'),aff,msg,h('div',{class:'row'},go,rz));
  dessinerGo();maj();
  return el;
}

function rendreExpose(el,api){
  const coches=note('m4-plan',[]).slice();
  const F=Object.assign({sujet:'',qui:'',buts:'',comment:'',resultats:'',r1:'',r2:'',r3:'',r4:''},note('m4-fiche',{}));
  if(!F.sujet&&note('m4-sujet',''))F.sujet=note('m4-sujet','');
  const pret=h('div',{'aria-live':'polite'});
  const TXT_PRET='Ta fiche est lancée ! Tu peux continuer. Tu reviendras la compléter quand tu veux.';
  const verifier=()=>{
    if(!F.sujet.trim()||!CHAMPS.some(c=>F[c[0]].trim()))return;
    if(!pret.firstChild)pret.append(h('div',{class:'fb ok'},MC.icone('ok'),h('div',null,TXT_PRET)));
    api.fait();
  };

  /* Le plan */
  const chemin=cheminPlan();
  const liste=h('div',{class:'m4-taches'});
  const majPlan=()=>{
    liste.replaceChildren(...PLAN.map((p,i)=>{const on=coches.includes(i);return h('button',{type:'button',class:'m4-tache','aria-pressed':on?'true':'false',onclick:()=>{const k=coches.indexOf(i);if(k<0){coches.push(i);MC.son.ok();}else coches.splice(k,1);MC.note('m4-plan',coches);majPlan();if(coches.length===6)api.fait();liste.children[i].focus({preventScroll:true});}},
      h('span',{class:'m4-case'},on?MC.icone('ok'):null),h('span',{class:'m4-tt'},h('b',null,`${i+1}. ${p[0]}`),h('span',null,p[1])));}));
    chemin.querySelectorAll('.m4-etape').forEach(g=>g.classList.toggle('on',coches.includes(+g.dataset.i)));
    const dern=coches.length?Math.max(...coches):-1;
    const i=Math.min(5,dern+1);
    chemin.querySelector('.m4-chnim').style.transform=`translate(${PX(i)-23}px,${i%2?20:66}px)`;
    chemin.querySelector('.m4-chnim').style.display=coches.length===6?'none':'';
  };
  majPlan();
  const figChemin=MC.fig(chemin,null,'Un chemin de 6 étapes numérotées. Les étapes faites sont cochées.');
  figChemin.classList.add('m4-chemfig');
  const pPlan=h('div',{class:'stack'},h('div',{class:'m4-planhaut'},MC.nimbus('L\'[[exposé]] se prépare sur plusieurs séances. Remplis ta fiche, puis continue. Tu reviendras ici quand tu veux.','content'),h('div',{class:'row'},h('button',{type:'button',class:'btn go',onclick:()=>montrer('fiche')},'Remplir ma fiche',MC.icone('droite')))),
    h('div',{class:'m4-planhaut'},h('div',{class:'stack'},MC.titre('À faire en groupe'),MC.p('Coche une carte quand l\'étape est faite.')),figChemin),
    liste,
    MC.retiens(['Ta recherche','Un exposé clair','Un sujet bien choisi','Tes réponses aux questions'],'Ce que ton professeur regarde'));

  /* La fiche */
  const feuille=h('div',{class:'m4-feuille'});
  const texte=()=>[`Exposé : ${F.sujet||'...'}`,'',...CHAMPS.flatMap(([k,q])=>[q,F[k]||'...','']),'Les rôles',...ROLES.map(([k,r])=>`${r} : ${F[k]||'...'}`)].join('\n');
  const majFeuille=()=>feuille.replaceChildren(h('h1',null,'Mon exposé sur le climat'),
    h('p',{class:'m4-fsujet'},h('b',null,'Sujet : '),F.sujet||'................................................'),
    ...CHAMPS.flatMap(([k,q])=>[h('h2',null,q),h('p',{class:F[k]?'':'m4-vide'},F[k]||'')]),
    h('h2',null,'Les rôles'),
    h('table',null,h('tbody',null,ROLES.map(([k,r])=>h('tr',null,h('th',{scope:'row'},r),h('td',null,F[k]||''))))),
    h('p',{class:'m4-fpied'},'Mission Climat, chapitre 3 de sciences, 6e'));
  const sauve=(k,v)=>{F[k]=v;MC.note('m4-fiche',F);if(k==='sujet')MC.note('m4-sujet',v);majFeuille();};
  const entree=(k,lib,ph,grand)=>h('div',{class:'m4-ch'},h('label',{for:'m4-f-'+k,class:'m4-lab'},lib),
    grand?h('textarea',{id:'m4-f-'+k,class:'m4-champ',rows:3,placeholder:ph,maxlength:600,oninput:e=>sauve(k,e.target.value),onchange:verifier},F[k]):h('input',{id:'m4-f-'+k,type:'text',class:'m4-champ',value:F[k],placeholder:ph,maxlength:80,autocomplete:'off',oninput:e=>sauve(k,e.target.value),onchange:verifier}));
  const msg=h('div',{'aria-live':'polite'});
  const copier=async()=>{
    try{
      if(!navigator.clipboard)throw new Error('non disponible');
      await navigator.clipboard.writeText(texte());
      msg.replaceChildren(h('div',{class:'fb ok'},MC.icone('ok'),h('div',null,'Texte copié. Tu peux le coller dans un document.')));
    }catch(e){
      const zone=h('textarea',{class:'m4-champ',rows:8,readonly:true,'aria-label':'Texte de la fiche à copier'},texte());
      msg.replaceChildren(h('div',{class:'fb ko'},MC.icone('ko'),h('div',null,'Cet appareil bloque la copie. Le texte est ci-dessous : sélectionne-le, puis copie-le.')),zone);
      zone.focus();zone.select();
    }
  };
  const imprimer=()=>{try{window.print();}catch(e){msg.replaceChildren(h('div',{class:'fb ko'},MC.icone('ko'),h('div',null,'L\'impression ne marche pas ici. Utilise le menu de ton navigateur.')));}};
  const pFiche=h('div',{class:'stack'},MC.nimbus('Écris ton sujet et au moins une réponse, avec tes mots.','content'),
    h('div',{class:'card stack'},entree('sujet','Ton sujet','Le nom de l\'action'),h('div',{class:'m4-fgrid'},CHAMPS.map(([k,q,ph])=>entree(k,q,ph,true)))),pret,
    h('div',{class:'card stack'},MC.titre('Les rôles : écris les prénoms'),h('div',{class:'m4-roles'},ROLES.map(([k,r])=>entree(k,r,'Prénom'))) ),
    h('div',{class:'row'},h('button',{type:'button',class:'btn go',onclick:imprimer},MC.icone('imprimer'),'Imprimer ma fiche'),h('button',{type:'button',class:'btn',onclick:copier},MC.icone('copier'),'Copier le texte')),msg);
  majFeuille();

  /* L'entraînement */
  const pChrono=h('div',{class:'stack'},MC.nimbus('Entraîne-toi à voix haute. Le chrono ne compte pas de points. Tu le lances quand tu veux.','content'),chrono());

  const demander=()=>{
    zoneRaz.replaceChildren(h('div',{class:'fb ko',role:'alert'},MC.icone('ko'),h('div',null,'Cette action efface le prénom, les étapes, les scores et les fiches enregistrés sur cet appareil. Elle est définitive.')),
      h('div',{class:'row'},h('button',{type:'button',class:'btn',onclick:raz},'Annuler'),h('button',{type:'button',class:'btn go',onclick:()=>MC.effacer()},'Confirmer l\'effacement')));
    zoneRaz.querySelector('button').focus();
  };
  raz();

  return h('div',{class:'stack m4 m4-prof'},
    h('h1',null,'Espace enseignant'),
    h('p',{class:'lead'},'Mission Climat adapte le chapitre 3 du livret de Jonathan André, « Les climats de la Terre et leurs influences sur la vie », pour des élèves de 6e SEGPA. La page fonctionne sans connexion et n\'envoie aucune donnée.'),
    sect('Objectifs et attendus',
      h('h3',null,'Objectifs du chapitre (livret, p. 2)'),
      MC.liste(['Comprendre les causes et les conséquences du réchauffement climatique.','Identifier les différents climats de la Terre et leurs caractéristiques.','Reconnaître l\'impact des activités humaines sur le climat.','Appréhender les risques et les ressources liés à l\'activité terrestre.']),
      h('h3',null,'Attendus de fin de cycle (Eduscol, livret p. 19)'),
      MC.liste(['Identifier l\'activité de la planète Terre et ses conséquences.','Décrire les conditions de la vie terrestre.','Différencier la météorologie du climat.','Construire une argumentation scientifique pour expliquer le réchauffement climatique actuel.']),
      h('h3',null,'Connaissances et compétences en fin de sixième'),
      MC.liste(['Décrire les conditions qui permettent la présence de la vie sur Terre.','Construire une argumentation relative au réchauffement récent, à partir de données, et le relier à la teneur en gaz à effet de serre.','Décrire quelques conséquences du réchauffement récent sur le peuplement des milieux.','Citer des stratégies d\'atténuation ou d\'adaptation.'])),
    sect('Carte du parcours',tableau(['Dans la page','Dans le livret'],parcours)),
    sect('Corrections apportées au livret',h('p',null,'Voici les huit corrections scientifiques principales. Les devoirs gardent leur numérotation et leurs bonnes réponses, pour rester raccord avec le papier.'),
      h('ol',{class:'m4-corr'},CORRECTIONS.map(([t,d])=>h('li',null,h('b',null,t+'. '),d))),
      h('h3',null,'Autres écarts avec le papier'),
      h('p',null,'Le texte est aussi simplifié partout. Les points suivants vont plus loin qu\'une simplification.'),
      h('ul',{class:'txt m4-corr'},ECARTS.map(([t,d])=>h('li',null,h('b',null,t+'. '),d)))),
    sect('Activités ajoutées au livret',
      h('p',null,'Le livret propose le cours, les articles et les QCM. Les éléments suivants sont des ajouts.'),
      MC.liste(['Missions 1 à 3 : schémas animés, simulations et jeux de tri ou d\'association, listés dans la carte du parcours.','La machine à ressenti et l\'activité « Une belle journée » (mission 4).','Les neuf dossiers d\'actions réelles, avec la carte et le quartier. Les faits ont été vérifiés en octobre 2026.','La fiche d\'exposé enregistrée, imprimable, et le chronomètre d\'entraînement. Il est lancé par l\'élève, sans note ni signal d\'échec.','Le mémory de révision, le quiz final de 8 questions et le diplôme.','Les mots du glossaire et les réglages de lecture.'])),
    sect('Usage conseillé',
      MC.liste(['Tableau interactif : à faire en collectif, notamment les simulations et les dossiers. Tout se pilote au toucher, sans glisser.','Tablette : en binôme, pour le tri, le mémory et la fiche d\'exposé.','Élève seul : le parcours se reprend là où il s\'est arrêté, sur le même appareil et le même navigateur. La progression n\'est pas transférée d\'un appareil à l\'autre.','Liens : seule la page « Pour aller plus loin » demande Internet. Trois liens du livret ne fonctionnent plus (climats en France, égalité des pays, perception du climat) : des ressources Lumni proches les remplacent. La vidéo Lumni sur le riz reprend l\'affirmation « deuxième source de méthane », écartée ici.'])),
    sect('Progression sur cet appareil',
      h('p',null,E.nom?`Prénom enregistré : ${E.nom}.`:'Aucun prénom enregistré.'),
      tableau(['Mission','Étapes faites','Devoir ou quiz (du premier coup)','Tampon'],MC.missions.map(m=>{const q=E.qcm[m.id];return[`Mission ${m.n} : ${m.titre}`,`${faites(m)} sur ${m.steps.length}`,q?`${q.score} sur ${q.total}`:'Non fait',MC.finie(m)?'Obtenu':'Non obtenu'];})),
      h('details',{class:'m4-det'},h('summary',null,'Voir le détail des étapes'),MC.missions.map(m=>h('div',null,h('b',null,`Mission ${m.n}`),h('ul',null,m.steps.map(s=>h('li',null,`${s.titre} : ${E.fait[m.id+'-'+s.id]?'faite':'à faire'}`)))))),
      zoneRaz),
    sect('Crédits',
      MC.liste(['Livret : Jonathan André, enseignant spécialisé, SEGPA.org, licence CC BY-NC-SA. Cette page hérite de la même licence.','Températures : HadCRUT5 (Met Office Hadley Centre, University of East Anglia), via Our World in Data.','Fonds de carte : Natural Earth, domaine public.','Graphique et carte d\'anomalies repris du livret : GIEC et NASA, via Wikipédia.','Polices : Lexend et Lilita One, licence SIL OFL.'])),
    h('div',{class:'row'},retourAccueil()));
});
})();

MC.start();
</script>
