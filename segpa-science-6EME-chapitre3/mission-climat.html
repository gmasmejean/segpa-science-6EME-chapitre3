/* Mission Climat : carte météo de poche. Fond ciel, encre de nuit, bande de réchauffement en signature.
   Une seule idée par écran, gros boutons, couleur toujours doublée d'un symbole. */
:root{
  --nuit:#0F2A47; --ciel:#E8F4F9; --papier:#FFFFFF; --ocean:#0A6E94; --braise:#C4340E; --soleil:#FFC933;
  --glace:#C3E5EE; --foret:#3B7A12; --brume:#4E6275; --trait:#C9DCE5; --lilas:#5B4BA8;
  --ok:#1F7A3D; --ok-bg:#E2F4E6; --ko:#B5480A; --ko-bg:#FDEBDD;
  --m:var(--ocean); --m-bg:#DDF0F6;
  --fd:'Lilita One','Trebuchet MS',Verdana,sans-serif; --fb:'Lexend',Verdana,'Trebuchet MS',Arial,sans-serif;
  --r:16px; --ombre:0 3px 0 rgba(15,42,71,.14); --gap:1rem; --lh:1.6; --ls:0;
  color-scheme:light;
}
.m1{--m:var(--ocean);--m-bg:#DDF0F6}
.m2{--m:var(--braise);--m-bg:#FCE7DF}
.m3{--m:var(--foret);--m-bg:#E6F2DA}
.m4{--m:var(--lilas);--m-bg:#EAE7F8}
*{box-sizing:border-box}
[hidden]{display:none!important}
/* scroll-padding : ce qui reçoit le focus ou défile reste entre la barre du haut et la barre du bas */
html{height:100%;font-size:112.5%;-webkit-text-size-adjust:100%;scroll-padding:4.5rem 0 6.5rem}
html[data-size="1"]{font-size:125%} html[data-size="2"]{font-size:143%}
html[data-air="1"]{--lh:1.95;--ls:.05em}
body{margin:0;min-height:100%;background:var(--ciel);color:var(--nuit);font-family:var(--fb);line-height:var(--lh);letter-spacing:var(--ls);font-weight:400;overflow-x:hidden}
h1,h2,h3{font-family:var(--fd);font-weight:400;line-height:1.15;letter-spacing:.005em;margin:0;text-wrap:balance}
h1{font-size:2.6rem} h2{font-size:1.9rem} h3{font-size:1.35rem}
p{margin:0} ul,ol{margin:0;padding-left:1.4rem} li+li{margin-top:.35rem}
img,svg{max-width:100%} svg{display:block;height:auto}
a{color:var(--ocean);font-weight:600}
sub{font-size:.7em;line-height:0}
button{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:4px solid var(--soleil);outline-offset:2px;box-shadow:0 0 0 7px var(--nuit)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* Barre du haut */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:.5rem;padding:.45rem max(16px,calc(50vw - 560px));background:var(--nuit);color:#fff}
.logo{font-family:var(--fd);font-size:1.2rem;color:#fff;text-decoration:none;padding:.3rem .55rem;border-radius:10px;display:flex;align-items:center;gap:.45rem;white-space:nowrap}
.logo svg{width:28px;height:28px}
.top .sp{flex:1}
.tool{min-height:48px;min-width:48px;padding:.3rem .7rem;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;background:transparent;color:#fff;border:2px solid rgba(255,255,255,.3);border-radius:12px;cursor:pointer;font-weight:600;font-size:.88rem}
.tool:hover{background:rgba(255,255,255,.12)}
.tool svg{width:22px;height:22px}
.jauge{display:flex;align-items:center;gap:.4rem;font-size:.82rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.jauge svg{width:20px;height:20px}

/* Conteneurs */
main{max-width:1120px;margin:0 auto;padding:1.25rem 16px 7rem}
main:focus{outline:none;box-shadow:none}
.alerte{margin-bottom:var(--gap)}
.stack{display:flex;flex-direction:column;gap:var(--gap)}
.row{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.25rem;align-items:start}
.split.wide-r{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr)}
.split.wide-l{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.8rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.8rem}
.card{background:var(--papier);border:2px solid var(--trait);border-radius:var(--r);padding:1rem 1.1rem;box-shadow:var(--ombre)}
.card>*+*{margin-top:.6rem}
.lead{font-size:1.12rem;max-width:62ch}
.muted{color:var(--brume);font-size:.88rem}
.txt{max-width:65ch}
.txt+.txt{margin-top:.5rem}

/* En-tête d'étape */
.head{background:var(--m);color:#fff;border-radius:var(--r);padding:.9rem 1.1rem;display:flex;gap:.9rem;align-items:center;flex-wrap:wrap}
.head .num{font-size:.85rem;font-weight:600;opacity:.92}
.head h2{color:#fff}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:transparent;padding:0;cursor:pointer;display:grid;place-items:center}
.dot.on{background:var(--soleil);border-color:var(--soleil)}
.dot.fait{background:#fff}
.dot.fait::after{content:'';width:9px;height:5px;border:solid var(--m);border-width:0 0 3px 3px;transform:rotate(-45deg) translate(1px,-1px)}

/* Boutons */
.btn{min-height:52px;padding:.55rem 1.1rem;border-radius:14px;border:2px solid var(--nuit);background:#fff;color:var(--nuit);font-weight:600;cursor:pointer;box-shadow:0 3px 0 var(--nuit);display:inline-flex;align-items:center;justify-content:center;gap:.5rem;text-decoration:none;transition:transform .08s}
.btn:hover{background:var(--ciel)}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn svg{width:22px;height:22px;flex:none}
.btn.go{background:var(--m);border-color:var(--nuit);color:#fff}
.btn.go:hover{filter:brightness(1.1)}
.btn[aria-pressed=true]{background:var(--soleil);color:var(--nuit)}
.btn[aria-pressed=true]::after{content:'✓';font-weight:800}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.mini{min-height:44px;padding:.25rem .7rem;font-size:.88rem;border-radius:11px}
.btn.icone{padding:.25rem;min-width:48px;min-height:48px}
.btn.pulse{animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 3px 0 var(--nuit),0 0 0 7px rgba(255,201,51,.75)}}

/* Mots */
.gloss{all:unset;cursor:pointer;font-weight:600;color:var(--ocean);border-bottom:3px dotted var(--ocean);padding:0 .05em}
.gloss:focus-visible{outline:3px solid var(--soleil)}
.colle{white-space:nowrap}
.colle .gloss{white-space:normal}
.pop{position:fixed;inset:0;z-index:60;background:rgba(15,42,71,.55);display:grid;place-items:center;padding:16px}
.pop>div{background:#fff;border-radius:18px;max-width:520px;width:100%;padding:1.2rem;max-height:90%;overflow:auto;border:3px solid var(--nuit)}
.pop>div>*+*{margin-top:.7rem}
.pop>.large{max-width:860px}
.grid2.mots{grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr))}
.pop .fermer{position:sticky;bottom:-1.2rem;margin-bottom:-1.2rem;padding:.6rem 0 1.2rem;background:#fff}
/* Bulle de Nimbus */
.nimbus{display:flex;gap:.7rem;align-items:flex-end}
.nimbus>svg{width:78px;height:62px;flex:none}
.bulle{position:relative;background:#fff;border:2px solid var(--nuit);border-radius:16px;padding:.65rem .85rem;display:flex;gap:.6rem;align-items:center;flex:1;min-width:0}
.bulle::before{content:'';position:absolute;left:-11px;bottom:14px;width:18px;height:18px;background:#fff;border-left:2px solid var(--nuit);border-bottom:2px solid var(--nuit);transform:rotate(45deg)}
.bulle>div{flex:1;min-width:0}

/* Encadrés */
.retiens{background:#FFF6D6;border:2px solid var(--nuit);border-left-width:10px;border-radius:12px;padding:.8rem 1rem}
.retiens h3{font-size:1.1rem}
.retiens .tete{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-bottom:.3rem}
.fb{border-radius:12px;padding:.6rem .85rem;font-weight:500;display:flex;gap:.55rem;align-items:flex-start}
.fb svg{width:24px;height:24px;flex:none;margin-top:.1rem}
.fb.ok{background:var(--ok-bg);color:#14562B;border:2px solid var(--ok)}
.fb.ko{background:var(--ko-bg);color:#7A3006;border:2px solid var(--ko)}
.fig{margin:0;background:#fff;border:2px solid var(--trait);border-radius:var(--r);padding:.7rem}
.fig figcaption{font-size:.88rem;color:var(--brume);margin-top:.45rem}
.fig svg text{font-family:var(--fb)}
.legende{display:flex;flex-wrap:wrap;gap:.45rem .9rem;font-size:.88rem}
.legende span{display:inline-flex;align-items:center;gap:.35rem}
.legende i{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--nuit);display:inline-block}

/* QCM et options */
.opts{display:flex;flex-direction:column;gap:.6rem}
.opt{display:flex;align-items:center;gap:.7rem;text-align:left;width:100%;min-height:56px;padding:.5rem .8rem;background:#fff;border:2px solid var(--nuit);border-radius:14px;cursor:pointer;box-shadow:0 3px 0 var(--nuit);font-weight:500}
.opt:hover:not([disabled]){background:var(--ciel)}
.opt .let{flex:none;width:34px;height:34px;border-radius:9px;background:var(--nuit);color:#fff;display:grid;place-items:center;font-family:var(--fd)}
.opt.bon{background:var(--ok-bg);border-color:var(--ok);box-shadow:0 3px 0 var(--ok)}
.opt.bon .let{background:var(--ok)}
.opt.faux{background:var(--ko-bg);border-color:var(--ko);box-shadow:none;opacity:.85}
.opt.faux .let{background:var(--ko)}
.opt[disabled]{cursor:default}
.opt svg.mark{width:26px;height:26px;margin-left:auto;flex:none}
.barre{height:14px;border-radius:7px;background:#fff;border:2px solid var(--nuit);overflow:hidden}
.barre i{display:block;height:100%;background:var(--m);transition:width .3s}

/* Tri et association */
.pioche{display:flex;flex-wrap:wrap;gap:.6rem;min-height:64px;padding:.6rem;background:rgba(255,255,255,.65);border:2px dashed var(--brume);border-radius:14px}
.jeton{min-height:50px;max-width:100%;padding:.4rem .8rem;background:#fff;border:2px solid var(--nuit);border-radius:12px;box-shadow:0 3px 0 var(--nuit);cursor:grab;font-weight:500;text-align:left;touch-action:none;user-select:none;-webkit-user-select:none}
.jeton.pris{background:var(--soleil)}
.jeton.bon{background:var(--ok-bg);border-color:var(--ok);box-shadow:none;cursor:default}
.jeton.fantome{position:fixed;z-index:70;pointer-events:none;transform:rotate(-2deg);box-shadow:0 8px 16px rgba(15,42,71,.35)}
.bacs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.7rem}
.bac{min-height:130px;width:100%;background:#fff;border:3px solid var(--bac,var(--nuit));border-radius:14px;padding:.5rem;display:flex;flex-direction:column;gap:.45rem;align-items:stretch;text-align:left;cursor:pointer}
.bac>b{font-family:var(--fd);font-weight:400;font-size:1.15rem;color:var(--bac,var(--nuit));display:flex;align-items:center;gap:.4rem}
.bac>b svg{width:26px;height:26px}
.bac.vise{background:#FFF6D6}
.bac .jeton{pointer-events:none;cursor:default;box-shadow:none;min-height:40px;font-size:.92rem}
.paires{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.6rem 1rem}
.paires>div{display:flex;flex-direction:column;gap:.6rem}
.paires .jeton{cursor:pointer;width:100%;touch-action:manipulation}
.ordre{display:flex;flex-direction:column;gap:.5rem;counter-reset:o}
.ligne{display:flex;align-items:center;gap:.5rem;background:#fff;border:2px solid var(--nuit);border-radius:12px;padding:.3rem .5rem}
.ligne .t{flex:1;font-weight:500}
.ligne.bon{background:var(--ok-bg);border-color:var(--ok)}
.ligne .fixe{flex:none;width:calc(96px + .5rem);min-height:48px;display:grid;place-items:center}
.ligne .fixe svg{width:30px;height:30px}

/* Curseurs */
.curseur{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.curseur label{font-weight:600;flex-basis:100%}
.curseur input[type=range]{flex:1;min-width:140px;height:44px;accent-color:var(--m);cursor:pointer}
.curseur output{font-family:var(--fd);font-size:1.3rem;min-width:4.5ch;text-align:right;font-variant-numeric:tabular-nums}

/* Cartes retournées */
.retour{min-height:150px;padding:.7rem;background:var(--m-bg);border:2px solid var(--nuit);border-radius:14px;cursor:pointer;box-shadow:0 3px 0 var(--nuit);display:flex;flex-direction:column;gap:.35rem;justify-content:center;align-items:center;text-align:center;font-weight:500;width:100%}
.retour b{font-family:var(--fd);font-weight:400;font-size:1.2rem}
.retour.vu{background:#fff}
.retour svg{width:56px;height:56px}
.memo-retour{position:sticky;bottom:5.5rem;z-index:5;align-self:center}

/* Accueil */
.hero{display:grid;gap:.9rem}
.hero h1{font-size:clamp(2.8rem,8vw,5rem);color:var(--nuit)}
.bande{position:relative;border-radius:var(--r);overflow:hidden;border:3px solid var(--nuit);background:var(--nuit)}
.bande svg{width:100%;height:clamp(110px,22vw,190px);display:block}
.bande .ann{position:absolute;bottom:6px;padding:0 .45rem;font-size:.8rem;font-weight:600;background:rgba(15,42,71,.85);color:#fff;border-radius:7px}
.bande .ann.g{left:7px}.bande .ann.d{right:7px}
.lue{font-variant-numeric:tabular-nums;font-weight:600}
.front{height:26px;background-repeat:repeat-x;background-size:92px 26px}
.missions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.9rem}
.mis{position:relative;font-weight:400;display:flex;flex-direction:column;gap:.5rem;text-align:left;text-decoration:none;color:var(--nuit);background:#fff;border:3px solid var(--nuit);border-top:14px solid var(--m);border-radius:var(--r);padding:.8rem;box-shadow:0 4px 0 var(--nuit);transition:transform .1s}
.mis:hover{transform:translateY(-3px)}
.mis h3{font-size:1.25rem;color:var(--m)}
.mis .pt{font-size:.85rem;color:var(--brume);font-weight:500}
.mis .barre{margin-top:auto}
.tampons{display:flex;flex-wrap:wrap;gap:1rem;align-items:center}
.tampon{width:118px;height:118px;flex:none;color:var(--m)}
.tampon.vide{color:var(--brume)}
.tampon.frappe{animation:frappe .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes frappe{from{transform:scale(2.6) rotate(-14deg);opacity:0}to{transform:scale(1) rotate(-6deg);opacity:1}}

/* Barre basse */
.bas{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:3px solid var(--nuit);padding:.5rem max(16px,calc(50vw - 544px));display:flex;gap:.6rem;align-items:center}
.bas .sp{flex:1}

@media (max-width:860px){
  .split,.split.wide-r,.split.wide-l{grid-template-columns:minmax(0,1fr)}
  .missions{grid-template-columns:repeat(2,minmax(0,1fr))}
  h1{font-size:2.1rem} h2{font-size:1.55rem}
}
@media (max-width:520px){
  .missions,.paires{grid-template-columns:minmax(0,1fr)}
  .logo span,.tool .lib{display:none}
  .tampon{width:92px;height:92px}
  .dots{margin-left:0}
  .bas .btn .lib{display:none}
}
@media (max-width:420px){
  .bas{gap:.4rem;padding-left:10px;padding-right:10px}
  .bas .btn{padding:.4rem .6rem}
  .bas .sp{flex:1 1 0;min-width:0}
}
/* Grand écran de classe : tout grandit, pour être lu du fond de la salle */
@media (min-width:1600px) and (min-height:900px){
  html{font-size:150%}
  html[data-size="1"]{font-size:168%} html[data-size="2"]{font-size:190%}
  main{max-width:1560px}
  .top{padding-inline:max(16px,calc(50vw - 780px))}
  .bas{padding-inline:max(16px,calc(50vw - 764px))}
  main .m2 .serre{max-width:min(720px,66vh)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media print{
  .top,.bas,.noprint{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
}

/* Mission 1 */
.m1 [hidden]{display:none!important}
.m1 .stack{scroll-margin-top:76px}
.m1 .m1-dock{display:flex;flex-direction:column;gap:var(--gap)}
.m1 .m1-cc>*+*{margin-top:.5rem}
.m1 .m1-zc{display:flex;flex-direction:column;gap:.5rem}
.m1 .m1-pic{width:44px;height:44px;flex:none}
.m1 .m1-fh{display:flex;align-items:center;gap:.6rem}
.m1 .m1-fh h3{flex:1;min-width:0}
.m1 .m1-fiche{margin:0}
.m1 .m1-q>*+*{margin-top:.7rem}

/* Sondage de départ */
.m1 .m1-chips{display:flex;flex-wrap:wrap;gap:.55rem}
.m1 .m1-chip{min-height:54px;padding:.3rem .8rem;display:inline-flex;align-items:center;gap:.45rem;background:#fff;color:var(--nuit);border:2px solid var(--nuit);border-radius:14px;box-shadow:0 3px 0 var(--nuit);font-weight:500;cursor:pointer;text-align:left}
.m1 .m1-chip:hover{background:var(--ciel)}
.m1 .m1-chip .m1-pic{width:34px;height:34px}
.m1 .m1-chip[aria-pressed=true]{background:var(--soleil);font-weight:700}
.m1 .m1-chip[aria-pressed=true]::after{content:'✓';font-weight:800;margin-left:.1rem}
.m1 .m1-prog{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.7rem;counter-reset:p}
.m1 .m1-prog li{margin:0;display:flex;align-items:center;gap:.6rem;background:#fff;border:2px solid var(--trait);border-radius:14px;padding:.6rem .7rem}
.m1 .m1-prog svg{width:38px;height:38px;flex:none}
.m1 .m1-prog b{display:block;font-family:var(--fd);font-weight:400;font-size:1.08rem}
.m1 .m1-prog span span{font-size:.9rem}

/* Carnet d'indices */
.m1 .m1-carnet{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .7rem;background:#fff;border:2px solid var(--nuit);border-radius:14px;padding:.4rem .7rem}
.m1 .m1-carnet>b{font-family:var(--fd);font-weight:400}
/* Indice pas encore trouvé : un simple texte avec un point gris, rien qui ressemble à un bouton */
.m1 .m1-ind{display:inline-flex;align-items:center;gap:.35rem;min-height:40px;padding:.1rem .1rem;font-size:.88rem;color:var(--brume)}
.m1 .m1-ind.ok{padding:.1rem .55rem;border:2px solid var(--ok);border-radius:10px;background:var(--ok-bg);color:#14562B;font-weight:600}
.m1 .m1-ind .m1-pic{width:28px;height:28px}
.m1 .m1-q0{width:12px;height:12px;border-radius:50%;background:var(--trait);flex:none}

/* Schémas */
.m1 .fig svg{width:100%}
.m1>.stack>.fig{max-width:760px;width:100%;margin-inline:auto}
.m1 .m1-pill text{font-family:var(--fb)}
.m1 .m1-terre{fill:#0F2A47;fill-opacity:.32;stroke:#0F2A47;stroke-width:.6;pointer-events:none}
.m1 .m1-l{stroke:#0F2A47;stroke-width:2;stroke-dasharray:8 6;pointer-events:none}
.m1 .m1-eq{stroke:#C4340E;stroke-width:3;pointer-events:none}
.m1 .m1-hit{fill:transparent;stroke:transparent;stroke-width:5;cursor:pointer}
.m1 .m1-hit:hover{fill:rgba(255,201,51,.16)}
.m1 .m1-hit.sel{fill:rgba(255,201,51,.3);stroke:var(--soleil)}
.m1 .m1-hit:focus-visible{outline:none;stroke:var(--nuit);fill:rgba(255,201,51,.3)}
.m1 .m1-palette{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}
.m1 .m1-coulb{min-height:64px;padding:.35rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;background:#fff;color:var(--nuit);border:2px solid var(--nuit);border-radius:14px;box-shadow:0 3px 0 var(--nuit);font-weight:600;font-size:.92rem;cursor:pointer}
.m1 .m1-coulb svg{width:40px;height:40px}
.m1 .m1-coulb[aria-pressed=true]{outline:4px solid var(--soleil);outline-offset:1px;background:#FFF6D6}

/* Météo : les 30 ans */
.m1 .m1-an{opacity:0;transition:opacity .25s}
.m1 .on .m1-an{opacity:1}
.m1 .m1-moy{opacity:0;transition:opacity .4s 2.2s}
.m1 .on .m1-moy{opacity:1}

/* Carte des climats */
.m1 .m1-figc{padding:.3rem}
.m1 .m1-carte{position:relative;line-height:0;border-radius:10px;overflow:hidden}
.m1 .m1-carte canvas{display:block;width:100%;height:auto;cursor:crosshair;touch-action:manipulation}
.m1 .fig .m1-rep{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.m1 .m1-halo{paint-order:stroke;stroke:#fff;stroke-width:3.5px;stroke-linejoin:round}
.m1 .m1-repere{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 3px var(--nuit),inset 0 0 0 3px var(--nuit);pointer-events:none}
.m1 .m1-legt{font-weight:600;margin-bottom:.35rem}
.m1 .m1-legs{display:flex;flex-wrap:wrap;gap:.45rem}
.m1 .m1-leg{min-height:48px;padding:.25rem .6rem;display:inline-flex;align-items:center;gap:.4rem;background:#fff;color:var(--nuit);border:2px solid var(--nuit);border-radius:12px;font-weight:600;font-size:.92rem;cursor:pointer}
.m1 .m1-leg i{width:24px;height:24px;border-radius:6px;border:1.5px solid var(--nuit);flex:none}
.m1 .m1-leg svg{width:28px;height:28px;flex:none}
.m1 .m1-leg:hover{background:var(--ciel)}
.m1 .m1-defi{border-color:var(--nuit);background:#FFF6D6}
.m1 .m1-pts{display:flex;gap:.4rem}
.m1 .m1-pts i{width:18px;height:18px;border-radius:50%;border:2px solid var(--nuit);background:#fff}
.m1 .m1-pts i.on{background:var(--soleil)}
.m1 .m1-pts i.ok{background:var(--ok)}

/* Curseurs : même allure que ceux de la mission 2, assez gros pour le doigt et le tableau */
.m1 .curseur input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:48px;margin:0}
.m1 .curseur input[type=range]::-webkit-slider-runnable-track{height:14px;border-radius:7px;background:var(--m-bg);border:2px solid var(--nuit)}
.m1 .curseur input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:36px;height:36px;margin-top:-13px;border-radius:50%;background:var(--soleil);border:3px solid var(--nuit);box-shadow:0 2px 0 var(--nuit)}
.m1 .curseur input[type=range]::-moz-range-track{height:10px;border-radius:7px;background:var(--m-bg);border:2px solid var(--nuit)}
.m1 .curseur input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--soleil);border:3px solid var(--nuit)}

/* Soleil */
.m1 .m1-espace,.m1 .m1-sol{border-radius:10px}
.m1 .m1-note{font-size:.88rem;color:var(--brume)}
/* largeur fixe : le curseur ne doit pas changer de taille sous le doigt quand le nom du lieu change */
.m1 .m1-so .curseur output{width:6.6em;min-width:6.6em}
.m1 .m1-so .btn.mini{min-height:48px}

/* Altitude */
.m1 .m1-fl{animation:m1-tombe 1.6s linear infinite}
@keyframes m1-tombe{from{transform:translateY(-6px);opacity:.3}50%{opacity:1}to{transform:translateY(12px);opacity:.3}}
.m1 .m1-tl{display:flex;align-items:center;gap:.5rem;font-weight:600}
.m1 .m1-tl svg{width:34px;height:34px}
.m1 .m1-grosT{margin-left:auto;font-family:var(--fd);font-weight:400;font-size:2rem;font-variant-numeric:tabular-nums}

/* Océan */
.m1 .m1-atl.avec .m1-eur{fill:url(#m1-ga)}
.m1 .m1-atl.sans .m1-eur{fill:url(#m1-gb)}
.m1 .m1-gh{fill:none;stroke:#5A6F82;stroke-width:3;stroke-dasharray:5 9;display:none}
.m1 .m1-atl.sans .m1-gh{display:inline}
.m1 .m1-atl.sans .m1-gs,.m1 .m1-atl.sans .m1-lab-avec,.m1 .m1-atl.avec .m1-lab-sans{display:none}
.m1 .m1-c0{fill:none;stroke:#C4340E;stroke-width:15;stroke-linecap:butt}
.m1 .m1-c1{fill:none;stroke:#FFD9A8;stroke-width:5;stroke-linecap:round;stroke-dasharray:12 26;animation:m1-flux 1.3s linear infinite}
@keyframes m1-flux{to{stroke-dashoffset:-38}}
.m1 .m1-vent{fill:none;stroke-width:4;stroke-linecap:round}
.m1 .m1-atl.avec .m1-vent{stroke:#E8761C}
.m1 .m1-atl.sans .m1-vent{stroke:#0A6E94}
.m1 .m1-atl.avec .m1-ventp{fill:#E8761C}
.m1 .m1-atl.sans .m1-ventp{fill:#0A6E94}

/* Tri : toucher une phrase déjà rangée revient à toucher sa case */
.m1 .bac .jeton{pointer-events:none}
/* Tri avec dessins */
.m1 .jeton.m1-jp{display:inline-flex;align-items:center;gap:.45rem}
.m1 .jeton.m1-jp .m1-pic{width:42px;height:42px}
.m1 .bac .jeton.m1-jp .m1-pic{width:34px;height:34px}

/* France */
.m1 .m1-z{cursor:pointer;transition:opacity .2s}
.m1 .m1-z.fade{opacity:.42}
.m1 .m1-oms{display:flex;flex-direction:column;gap:.45rem}
.m1 .m1-omb{min-height:54px;padding:.3rem .7rem;display:flex;align-items:center;gap:.55rem;background:#fff;color:var(--nuit);border:2px solid var(--nuit);border-radius:12px;box-shadow:0 3px 0 var(--nuit);font-weight:600;cursor:pointer;text-align:left}
.m1 .m1-omb svg{width:30px;height:30px;flex:none}
.m1 .m1-omb:hover{background:var(--ciel)}
.m1 .m1-omb[aria-pressed=true]{background:#FFF6D6;outline:3px solid var(--soleil)}

@media (max-width:400px){
  .m1.bas{gap:.35rem;padding-left:8px;padding-right:8px}
  .m1.bas .btn{padding-left:.6rem;padding-right:.6rem}
}
@media (prefers-reduced-motion:reduce){
  .m1 .m1-an,.m1 .m1-moy{transition-delay:0s!important}
}
@media (max-width:860px){
  .m1 .fig{padding:.35rem}
  /* Météo et océan : le bouton passe avant le schéma, il reste à l'écran sans défiler */
  .m1 .m1-mt,.m1 .m1-oc{display:flex;flex-direction:column;align-items:stretch;gap:var(--gap)}
  .m1 .m1-mt>.stack,.m1 .m1-oc>.stack{display:contents}
  .m1 .m1-mt>.fig{order:3}
  .m1 .m1-mt .nimbus{order:1}
  .m1 .m1-mt .row{order:2}
  .m1 .m1-oc .m1-bascule{order:-1}
  /* Soleil : le globe reste collé en haut pendant qu'on bouge le curseur */
  .m1 .m1-so{display:flex;flex-direction:column;align-items:stretch;gap:var(--gap)}
  .m1 .m1-so>.stack{display:contents}
  .m1 .m1-glob{position:sticky;top:66px;z-index:5;align-self:center;width:100%;max-width:48vh;padding:.25rem;box-shadow:0 6px 12px rgba(15,42,71,.25)}
  .m1 .m1-so .m1-note{order:1}
  .m1 .m1-mm{display:flex;flex-direction:column;gap:var(--gap)}
  .m1 .m1-mm>.stack{display:contents}
  .m1 .m1-zd{order:1}
  .m1 .m1-figc{order:2}
  .m1 .m1-pn{order:3}
  .m1 .m1-legw{order:4}
}
@media (max-width:520px){
  .m1 .nimbus{gap:.45rem}
  .m1 .nimbus>svg{width:50px;height:40px}
  .m1 .bulle{padding:.5rem .6rem;gap:.4rem}
  .m1 .bulle::before{left:-9px;width:14px;height:14px}
  .m1 .m1-bascule{flex-wrap:nowrap}
  .m1 .m1-bascule .btn{flex:1;padding:.4rem .4rem;font-size:.92rem}
  .m1 .bacs{grid-template-columns:repeat(2,minmax(0,1fr));gap:.4rem}
  .m1 .bac>b{font-size:.98rem;gap:.25rem}
  .m1 .bac>b svg{width:22px;height:22px}
  .m1 .m1-dock{position:sticky;bottom:72px;z-index:6;flex-direction:column-reverse;gap:.4rem;background:var(--ciel);padding:.4rem 0}
  .m1 .pioche~.m1-dock .bac{position:relative;min-height:54px;counter-reset:n;flex-direction:row;align-items:center;justify-content:space-between;padding:.25rem .4rem}
  .m1 .pioche~.m1-dock .bac .jeton{position:absolute;width:1px;height:1px;min-height:0;padding:0;border:0;overflow:hidden;clip-path:inset(50%);counter-increment:n}
  .m1 .pioche~.m1-dock .bac::after{content:counter(n);flex:none;min-width:1.7em;text-align:center;font-family:var(--fd);background:var(--bac,var(--nuit));color:#fff;border-radius:999px;font-size:.92rem}
  .m1 .pioche .jeton{touch-action:pan-y}
  .m1 .paires{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:.5rem}
  .m1 .paires .jeton{font-size:.9rem;padding:.35rem .5rem}
}
/* Mission 2 : schémas et simulations */
.m2 .fig svg{width:100%}
.m2 .fig{min-width:0}

/* .btn impose display:inline-flex et annulerait hidden : le bouton « Question suivante » du devoir apparaîtrait avant la réponse */
.m2 [hidden]{display:none!important}

/* Un jeton déjà posé ne doit pas avaler le toucher destiné au bac */
.m2 .bac .jeton{pointer-events:none}

/* Curseurs plus épais, pour le doigt et le tableau */
.m2 .card.stack>*+*{margin-top:0}
.m2 .curseur input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:48px;margin:0}
.m2 .curseur input[type=range]::-webkit-slider-runnable-track{height:14px;border-radius:7px;background:var(--m-bg);border:2px solid var(--nuit)}

/* Carte du livret recadrée */

/* Flèches des schémas */

.m2 .f-c{fill:none;stroke-width:7.5;stroke-linecap:round;stroke-linejoin:round}
.m2 .f-p{stroke:var(--nuit);stroke-width:2.5;stroke-linejoin:round}
.m2 .jaune .f-c,.m2 .jaune .f-p{stroke:var(--nuit)}
.m2 .jaune .f-c{stroke:#FFC933}
.m2 .jaune .f-p{fill:#FFC933}
.m2 .rouge .f-c{stroke:#FF5A2C}
.m2 .rouge .f-p{fill:#FF5A2C}
.m2 .flux{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-dasharray:1 17;opacity:.9;animation:m2-flux 1.1s linear infinite}

/* Effet de serre */
.m2 .serre .mol{opacity:0;transition:opacity .5s}

.m2 .serre .arbres{transition:opacity .5s}
.m2 .serre[data-cran="0"] .arbres{opacity:0}
.m2 .serre .feuille{fill:#2F7D32;stroke:var(--nuit);stroke-width:2;transition:fill .5s}

.m2 .serre[data-cran="3"] .feuille{fill:#B5852B}

.m2 .crans{display:flex;flex-direction:column;gap:.5rem}

.m2 .tuile{background:#fff;border:2px solid var(--trait);border-radius:12px;padding:.4rem .6rem;display:flex;gap:.5rem;align-items:center;font-size:.88rem;line-height:1.25}

/* Bulles de CO2 qui montent */
.m2 .monte{animation:m2-monte 3s linear infinite backwards}

/* Côte */

/* Verres */

.m2 .cartes5 .grid3{grid-template-columns:repeat(5,minmax(0,1fr))}

/* Balance */

/* Carte du monde */
/* La marge basse garde la place du rond du Pacifique et de son nom */
.m2 .pins{position:relative;margin-bottom:2.1rem}

/* Mission 3 : schémas et simulations */
.m3 .fig svg{width:100%}

/* Jauge horizontale */
.m3 .jh{display:flex;flex-direction:column;gap:.3rem;background:#fff;border:2px solid var(--trait);border-radius:12px;padding:.5rem .8rem}

.m3 .jh-b{position:relative;height:20px;margin:.25rem 0;border:2px solid var(--nuit);border-radius:10px;background:linear-gradient(90deg,#8CCB6B,#FFC933 50%,#E8743B)}
.m3 .jh-b i{position:absolute;top:-8px;left:2%;width:12px;height:32px;margin-left:-6px;background:var(--nuit);border:2px solid #fff;border-radius:6px;transition:left .6s}

/* Graphique guidé */
.m3 .graphe .voile{opacity:0;transition:opacity .35s}
.m3 .graphe[data-voir] .voile{opacity:.9}
.m3 .graphe[data-voir] .voile.plein{opacity:1}

.m3 .graphe[data-voir=noir] .t-vert,.m3 .graphe[data-voir=noir] .t-noir,.m3 .graphe[data-voir=noir] .l-noir,.m3 .graphe[data-voir=noir] .l-vert,
.m3 .graphe[data-voir=rouge] .t-noir,.m3 .graphe[data-voir=rouge] .t-rouge,.m3 .graphe[data-voir=rouge] .l-rouge{display:inline}

.m3 .ville .obj{cursor:pointer;outline:none}

.m3 .ville .obj:hover .zone{fill:rgba(255,255,255,.3)}

.m3 .mission-m li.ok::after{content:'';position:absolute;left:6px;top:.62rem;width:13px;height:7px;border:solid #fff;border-width:0 0 3.5px 3.5px;transform:rotate(-45deg)}

@keyframes m3-apparait{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.m4 .m4-bascules{display:grid;grid-template-columns:minmax(0,1fr);gap:.6rem}

/* Une belle journée */
.m4 .m4-jours{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.6rem}
.m4 .m4-jour{flex-direction:column;gap:.2rem;padding:.5rem}
.m4 .m4-jour svg{width:44px;height:44px}
.m4 .m4-jour[aria-pressed="true"]{background:var(--soleil)}
.m4 .m4-comps{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.7rem}
.m4 .m4-comp{background:#fff;border:2px solid var(--trait);border-radius:14px;padding:.7rem;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.25rem}
.m4 .m4-comp:last-child{border-color:var(--m);background:var(--m-bg)}
.m4 .m4-comp svg{width:52px;height:52px}

/* Dossiers d'actions */
.m4 .m4-carte .m4-pin{cursor:pointer}
.m4 .m4-carte .m4-pin circle{fill:var(--nuit);stroke:#fff;stroke-width:3}
.m4 .m4-carte .m4-pin text{fill:#fff;pointer-events:none}
.m4 .m4-carte .m4-pin.vu circle{fill:var(--ok)}
.m4 .m4-velo{animation:m4roule 3s ease-in-out infinite alternate}
@keyframes m4roule{from{transform:translateX(-10px)}to{transform:translateX(30px)}}
.m4 .m4-doss{display:flex;flex-direction:column;gap:.5rem}
.m4 .m4-dos{display:flex;align-items:center;gap:.6rem;width:100%;min-height:64px;padding:.35rem .6rem;background:#fff;border:2px solid var(--nuit);border-radius:14px;box-shadow:0 3px 0 var(--nuit);cursor:pointer;text-align:left}
.m4 .m4-dos:hover{background:var(--m-bg)}
.m4 .m4-dos>svg:not(.m4-lu){width:62px;height:47px;flex:none}
.m4 .m4-dos .m4-lu{width:26px;height:26px;flex:none;margin-left:auto;visibility:hidden}
.m4 .m4-dos.vu .m4-lu{visibility:visible}
.m4 .m4-dos.vu{border-color:var(--ok);box-shadow:0 3px 0 var(--ok)}
.m4 .m4-num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--nuit);color:#fff;display:grid;place-items:center;font-family:var(--fd)}
.m4 .m4-dos.vu .m4-num{background:var(--ok)}
.m4 .m4-dt{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.m4 .m4-dt .muted{font-size:.82rem}
.m4.m4-dossier>*+*{margin-top:.65rem}
.m4 .m4-dtete{display:flex;gap:.7rem;align-items:center}
.m4 .m4-dtete>svg:first-child{width:96px;height:72px;flex:none}
.m4 .m4-dtete>div{flex:1;min-width:0}
.m4 .m4-qqp{display:grid;grid-template-columns:5.6rem minmax(0,1fr);gap:.2rem .5rem;align-items:baseline}
.m4 .m4-qqp b{font-family:var(--fd);font-weight:400;color:var(--m)}
.m4 .m4-chaine{display:flex;align-items:stretch;gap:.3rem;background:var(--m-bg);border-radius:12px;padding:.5rem}
.m4 .m4-maillon{flex:1 1 0;min-width:0;display:grid;place-items:center;text-align:center;background:#fff;border:2px solid var(--nuit);border-radius:10px;padding:.3rem .35rem;font-size:.84rem;font-weight:600;line-height:1.25;hyphens:auto}
.m4 .m4-fl{width:22px;height:22px;flex:none;align-self:center;color:var(--nuit)}
.m4 .m4-plus{font-weight:500}

/* Exposé */
.m4 .m4-onglets{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,6.1rem),1fr));gap:.5rem}
.m4 .m4-onglets .btn{padding:.4rem .4rem;font-size:.92rem;line-height:1.2}
.m4 .m4-planhaut{display:grid;grid-template-columns:minmax(0,1fr);gap:.7rem;align-items:center}
@media (min-width:861px){.m4 .m4-planhaut{grid-template-columns:minmax(0,1fr) auto}.m4 .m4-chemfig{width:340px}}
.m4 .m4-chemin .m4-etape circle{fill:#fff;stroke:var(--nuit);stroke-width:3}
.m4 .m4-chemin .m4-etape text{fill:var(--nuit)}
.m4 .m4-chemin .m4-etape.on circle{fill:var(--ok)}
.m4 .m4-chemin .m4-etape.on text{fill:#fff}
.m4 .m4-chemin .m4-coche{display:none;fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.m4 .m4-chemin .m4-etape.on .m4-coche{display:inline}
.m4 .m4-chemin .m4-etape.on text{display:none}
.m4 .m4-chnim{transition:transform .35s}
.m4 .m4-taches{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:.5rem}
.m4 .m4-tache{display:flex;align-items:center;gap:.7rem;width:100%;min-height:64px;padding:.45rem .7rem;background:#fff;border:2px solid var(--nuit);border-radius:14px;box-shadow:0 3px 0 var(--nuit);text-align:left;cursor:pointer}
.m4 .m4-tache[aria-pressed="true"]{background:var(--ok-bg);border-color:var(--ok);box-shadow:0 3px 0 var(--ok)}
.m4 .m4-case{flex:none;width:32px;height:32px;border:3px solid var(--nuit);border-radius:8px;display:grid;place-items:center;background:#fff}
.m4 .m4-case svg{width:26px;height:26px}
.m4 .m4-tt{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.m4 .m4-fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:.8rem}
.m4 .m4-roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.7rem}
.m4 .m4-tps{font-family:var(--fd);font-size:clamp(2.2rem,8vw,3.2rem);line-height:1.1;font-variant-numeric:tabular-nums}
.m4 .m4-feuille{display:none}

/* Mémory : 3 rangées de 4, ou 2 colonnes sur mobile */
.m4 .m4-mem .grid3{grid-template-columns:repeat(4,minmax(0,1fr))}
.m4 .m4-mem .retour{font-size:.95rem;line-height:1.3}
@media (max-width:640px){.m4 .m4-mem .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Bilan */
.m4 .m4-blocs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.8rem}
.m4 .m4-bloc svg{width:100%}

/* Pour aller plus loin */
.m4.m4-ploin h2{font-size:1.45rem;color:var(--m)}
.m4 .m4-lien{display:flex;flex-direction:column;gap:.2rem;min-height:120px;padding:.75rem .9rem;background:#fff;border:2px solid var(--nuit);border-radius:14px;box-shadow:0 3px 0 var(--nuit);color:var(--nuit);text-decoration:none;font-weight:400}
.m4 .m4-lien:hover{background:var(--m-bg)}
.m4 .m4-lien b{line-height:1.3}
.m4 .m4-ouvre{margin-top:auto;display:inline-flex;align-items:center;gap:.3rem;color:var(--m);font-weight:600}
.m4 .m4-ouvre svg{width:20px;height:20px}

/* Espace enseignant : registre sobre */
.m4.m4-prof{font-size:.95rem}
.m4.m4-prof h1{font-size:2rem}
.m4.m4-prof h2{font-family:var(--fb);font-weight:600;font-size:1.25rem;letter-spacing:0}
.m4.m4-prof h3{font-family:var(--fb);font-weight:600;font-size:1rem;letter-spacing:0;margin-top:.8rem}
.m4 .m4-psec>*+*{margin-top:.6rem}
.m4.m4-prof .txt{max-width:none}
.m4 .m4-tab{border-collapse:collapse;width:100%}
.m4 .m4-tab th{text-align:left;font-weight:600;border-bottom:2px solid var(--nuit);padding:.35rem .5rem}
.m4 .m4-tab td{padding:.4rem .5rem;border-bottom:1px solid var(--trait);vertical-align:top}
.m4 .m4-corr li+li{margin-top:.5rem}
.m4 .m4-det summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
.m4 .m4-det>div+div{margin-top:.5rem}
@media (max-width:640px){
  .m4 .m4-tab thead{display:none}
  .m4 .m4-tab,.m4 .m4-tab tbody,.m4 .m4-tab tr,.m4 .m4-tab td{display:block;width:100%}
  .m4 .m4-tab tr{padding:.45rem 0;border-bottom:2px solid var(--trait)}
  .m4 .m4-tab td{border:0;padding:.1rem 0}
  .m4 .m4-tab td::before{content:attr(data-t)' : ';font-weight:600}
}

/* Diplôme */
.m4 .m4-dip{background:#fff;border:3px solid var(--nuit);border-radius:6px;overflow:hidden;max-width:680px;width:100%;margin:0 auto;display:flex;flex-direction:column;box-shadow:var(--ombre)}
.m4 .m4-dband{display:block;width:100%;height:24px;flex:none}
.m4 .m4-dcorps{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.65rem;padding:1.2rem 1rem}
.m4 .m4-dpt{font-weight:600;color:var(--brume)}
.m4 .m4-dtitre{font-family:var(--fd);font-size:clamp(2rem,7vw,3rem);line-height:1.1;color:var(--m)}
.m4 .m4-dnom{font-family:var(--fd);font-size:clamp(1.7rem,6vw,2.5rem);line-height:1.15;border-bottom:3px solid var(--nuit);padding:0 1rem .15rem;max-width:100%;overflow-wrap:anywhere}
.m4 .m4-dliste{list-style:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:.25rem}
.m4 .m4-dliste li{display:flex;align-items:center;gap:.45rem;margin:0}
.m4 .m4-dliste svg{width:22px;height:22px;flex:none}
.m4 .m4-dtamps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.4rem;width:100%}
.m4 .m4-dtamp{display:flex;flex-direction:column;align-items:center}
.m4 .m4-dtamp>span:first-child{display:block;transform:rotate(-6deg)}
.m4 .m4-dtamp .tampon{width:100%;max-width:112px;height:auto}
.m4 .m4-dpied{display:grid;grid-template-columns:minmax(0,1fr) 72px minmax(0,1fr);gap:.6rem;align-items:end;width:100%;margin-top:auto;text-align:center}
.m4 .m4-dpied>div{display:flex;flex-direction:column;gap:.15rem;font-size:.85rem}
.m4 .m4-dnim{width:72px;height:56px}
.m4 .m4-dsign{display:block;height:40px;border-bottom:2px solid var(--nuit)}
.m4 .m4-dbrouillon{border-style:dashed}
.m4 .m1 .tampon:not(.vide){color:var(--ocean)}
.m4 .m2 .tampon:not(.vide){color:var(--braise)}
.m4 .m3 .tampon:not(.vide){color:var(--foret)}
.m4 .m4 .tampon:not(.vide){color:var(--lilas)}
.m4 .m4-dreg .m4-champ{width:auto;flex:0 1 280px}
@media (max-width:520px){
  .m4 .m4-dtamps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .m4 .m4-onglets{display:flex;flex-wrap:wrap}
  .m4 .m4-onglets .btn{flex:1 1 auto}
  .m4 .m4-chaine{flex-direction:column}
  .m4 .m4-qqp{grid-template-columns:minmax(0,1fr)}
  .m4 .m4-maillon{flex:none;font-size:.9rem}
  .m4 .m4-fl{transform:rotate(90deg)}
  .m4 .m4-dpied{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .m4 .m4-dnim{display:none}
}

/* Impression : fiche d'exposé ou diplôme seuls */
@media print{
  @page{size:A4 portrait;margin:10mm}
  html:has(.m4-dip),html:has(.m4-feuille){font-size:12pt!important}
  .m4 .m4-sansprint,.stack.m4>.head{display:none!important}
  .m4,.m4 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .m4 .m4-feuille{display:block!important;font-size:12pt;line-height:1.4}
  .m4 .m4-feuille h1{font-size:20pt;margin-bottom:3mm}
  .m4 .m4-feuille h2{font-family:var(--fb);font-weight:600;font-size:12.5pt;margin:4mm 0 1mm;break-after:avoid}
  .m4 .m4-feuille p{margin:0;white-space:pre-wrap}
  .m4 .m4-feuille .m4-vide{height:24mm;border-bottom:1px solid #999}
  .m4 .m4-fsujet{font-size:14pt}
  .m4 .m4-feuille table{width:100%;border-collapse:collapse;margin-top:1mm;break-inside:avoid}
  .m4 .m4-feuille th,.m4 .m4-feuille td{border:1px solid #666;padding:2mm;text-align:left;font-weight:400;height:10mm}
  .m4 .m4-feuille th{width:45%;font-weight:600}
  .m4 .m4-fpied{margin-top:5mm!important;font-size:9pt;color:#555}

  .m4.m4-pdip{gap:0!important}
  .m4 .m4-dip{width:190mm;height:276mm;max-width:none;margin:0;border:1mm solid var(--nuit);border-radius:0;box-shadow:none;break-inside:avoid;break-after:avoid}
  .m4 .m4-dband{height:9mm}
  .m4 .m4-dcorps{gap:4mm;padding:9mm 12mm 7mm;justify-content:space-between}
  .m4 .m4-dpt{font-size:13pt}
  .m4 .m4-dtitre{font-size:40pt}
  .m4 .m4-dnom{font-size:32pt;min-width:110mm}
  .m4 .m4-dtxt{font-size:13pt}
  .m4 .m4-dliste{font-size:12pt;gap:1.5mm}
  .m4 .m4-dtamps{grid-template-columns:repeat(4,minmax(0,1fr));gap:3mm}
  .m4 .m4-dtamp .tampon{max-width:36mm}
  .m4 .m4-dpied{grid-template-columns:minmax(0,1fr) 24mm minmax(0,1fr)!important;font-size:11pt;margin-top:0}
  .m4 .m4-dpied>div{font-size:11pt}
  .m4 .m4-dnim{display:block!important;width:24mm;height:19mm}
  .m4 .m4-dsign{height:14mm}
}

</style>
</head>

/* Moteur de Mission Climat : état, navigation, widgets communs. Aucun appel réseau. */
(function(){
'use strict';
const MC=window.MC={missions:[],pages:{},gloss:{},data:window.MC_DATA};
const KEY='mission-climat-6e-v1';
const vide=()=>({nom:'',fait:{},qcm:{},notes:{},prefs:{size:0,air:0,son:1}});
let S=vide();
function charger(){try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j)S=Object.assign(vide(),j,{prefs:Object.assign(vide().prefs,j.prefs||{})});}catch(e){}}
let stockeOk=true;
function sauver(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){stockeOk=false;}}
function testerStockage(){try{const k=KEY+'-test';localStorage.setItem(k,'1');localStorage.removeItem(k);stockeOk=true;}catch(e){stockeOk=false;}}
MC.etat=()=>S;
MC.sauver=sauver;
MC.note=(k,v)=>{if(v===undefined)return S.notes[k];S.notes[k]=v;sauver();};
MC.effacer=()=>{S=vide();try{localStorage.removeItem(KEY);}catch(e){}appliquerPrefs();MC.go('accueil');};

/* DOM ------------------------------------------------------------------ */
function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v===null||v===undefined||v===false)continue;
    if(k.startsWith('on')&&typeof v==='function')el.addEventListener(k.slice(2),v);
    else if(k==='html')el.innerHTML=v;
    else if(k==='class')el.className=v;
    else el.setAttribute(k,v===true?'':v);
  }
  kids.flat().forEach(c=>{if(c===null||c===undefined||c===false)return;el.append(c.nodeType?c:document.createTextNode(tag==='textarea'?c:typo(c)));});
  return el;
}
MC.h=h;
/* Coupures de ligne : ponctuation, guillemets, unités et pronoms inversés restent collés au mot (U+2060 : pas de coupure après le trait d'union) */
const typo=s=>String(s).replace(/ ([:;?!»%]|°C)/g,'\u00a0$1').replace(/(\d) (mètres|km|ans|min)\b/g,'$1\u00a0$2').replace(/« /g,'«\u00a0').replace(/(\p{L})-(t-)?(il|ils|elle|elles|on|je|tu|ce)(?![\p{L}-])/gu,(m,l,t,p)=>`${l}-\u2060${t?'t-\u2060':''}${p}`);
const svg=s=>{const t=document.createElement('template');t.innerHTML=s.trim();return t.content.firstChild;};
MC.svg=svg;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
/* Texte enrichi : **gras**, [[terme]] ou [[terme|forme affichée]] (mot expliqué), CO2 CH4 N2O O2 en indice */
MC.rich=function(t){
  return esc(typo(t))
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,a,b)=>`<button type="button" class="gloss" data-t="${a}">${b||a}</button>`)
    .replace(/\b(CO|CH|N|O)([24])(O?)\b/g,(m,a,n,o)=>`${a}<sub>${n}</sub>${o}`)
    /* un mot expliqué reste avec son article élidé et sa ponctuation */
    .replace(/(\b(?:[cdjlmnst]|qu|jusqu|lorsqu|puisqu)['’])?(<button type="button" class="gloss".*?<\/button>)(\u00a0?[.,:;?!»)]+)?/gi,(m,a,b,c)=>a||c?`<span class="colle">${a||''}${b}${c||''}</span>`:m);
};
/* Texte brut pour les aria-label, à partir du texte enrichi */
MC.parlable=function(t){
  return String(t).replace(/\*\*/g,'').replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,a,b)=>b||a)
    .replace(/\bCO2\b/g,'dioxyde de carbone').replace(/\bCH4\b/g,'méthane').replace(/\bN2O\b/g,'protoxyde d\'azote').replace(/\bO2\b/g,'dioxygène')
    .replace(/\+\s?(\d)/g,'plus $1').replace(/−\s?(\d)/g,'moins $1').replace(/°C/g,' degrés').replace(/\s\/\s/g,' sur ');
};
MC.p=(t,cls)=>h('p',{class:'txt '+(cls||''),html:MC.rich(t)});
MC.titre=(t,n)=>h('h'+(n||3),{html:MC.rich(t)});
MC.liste=(items,ord)=>h(ord?'ol':'ul',{class:'txt'},items.map(t=>h('li',{html:MC.rich(t)})));
MC.retiens=(t,titre)=>{
  const nom=titre||'Je retiens';
  return h('div',{class:'retiens'},h('div',{class:'tete'},h('h3',{},nom)),Array.isArray(t)?MC.liste(t):MC.p(t));
};
MC.fig=function(svgOuEl,legende,aria){
  const f=h('figure',{class:'fig'});
  const n=typeof svgOuEl==='string'?svg(svgOuEl):svgOuEl;
  if(aria&&n.setAttribute){n.setAttribute('role','img');n.setAttribute('aria-label',aria);}
  f.append(n);

/* Sons ---------------------------------------------------------------- */
let ac=null;
function son(notes){
  if(!S.prefs.son)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
    notes.forEach(([f,t,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.16,ac.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+t+d);
      o.connect(g).connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+d+.02);});
  }catch(e){}
}

});
const ouverts=[];
MC.popup=function(contenu){
  const prev=document.activeElement;
  const clore=rendre=>{ouverts.splice(ouverts.indexOf(clore),1);p.remove();document.removeEventListener('keydown',clavier);if(rendre&&prev&&prev.focus)prev.focus();};
  const fermer=()=>clore(true);
  const clavier=e=>{
    if(ouverts[ouverts.length-1]!==clore)return;
    if(e.key==='Escape'){fermer();return;}
    if(e.key!=='Tab')return;
    const l=[...p.querySelectorAll('button,a[href],input,select,textarea,[tabindex="0"]')].filter(x=>!x.disabled&&x.offsetParent!==null);
    if(!l.length)return;
    const a=document.activeElement,prem=l[0],dern=l[l.length-1];
    if(!p.contains(a)||(e.shiftKey&&a===prem)){e.preventDefault();(e.shiftKey?dern:prem).focus();}
    else if(!e.shiftKey&&a===dern){e.preventDefault();prem.focus();}
  };
  const f=h('button',{type:'button',class:'btn go mini',onclick:fermer},'Fermer');
  const tete=contenu.querySelector&&contenu.querySelector('h1,h2,h3');
  const p=h('div',{class:'pop',role:'dialog','aria-modal':'true','aria-label':tete?tete.textContent:'Fenêtre',onclick:e=>{if(e.target===p)fermer();}},h('div',null,contenu,h('div',{class:'row fermer'},f)));
  ouverts.push(clore);document.addEventListener('keydown',clavier);document.body.append(p);f.focus({preventScroll:true});return fermer;
};

/* Widget : QCM. questions=[{q,options:[],bon:index,aide,expli}] */
MC.qcm=function(root,o){
  const id=o.id;let file=o.questions.map((q,i)=>i),pos=0,rates=[],premier=0,premiereManche=true,debut=true;
  const zone=h('div',{class:'stack'});root.append(zone);
  /* Après un changement de contenu, on repart du haut de la zone si la page était descendue */
  const hautZone=()=>{if(debut){debut=false;return;}const t=document.querySelector('.top'),m=t?t.getBoundingClientRect().bottom:0;if(zone.getBoundingClientRect().top<m)voir(zone,{block:'start',behavior:'auto'});};
  function question(){
    const q=o.questions[file[pos]];let essais=0;
    const pr=h('div',{class:'barre',role:'progressbar','aria-valuemin':0,'aria-valuemax':file.length,'aria-valuenow':pos,'aria-label':'Progression des questions'},h('i',{style:`width:${pos/file.length*100}%`}));
    const fb=h('div',{'aria-live':'polite'});
    const suite=h('button',{type:'button',class:'btn go',hidden:true,onclick:()=>{pos++;pos<file.length?question():bilan();}},pos+1<file.length?'Question suivante':'Voir mon résultat',MC.icone('droite'));
    const opts=h('div',{class:'opts'},q.options.map((t,i)=>{
      const b=h('button',{type:'button',class:'opt',onclick:()=>{
        if(i===q.bon){
          b.classList.add('bon');b.append(MC.icone('ok','mark'));
          opts.querySelectorAll('button').forEach(x=>x.disabled=true);
          if(essais===0&&premiereManche)premier++;
          MC.son.ok();
          fb.replaceChildren(h('div',{class:'fb ok'},MC.icone('ok'),h('div',{html:'<b>Bravo !</b> '+MC.rich(q.expli||'')})));
          suite.hidden=false;suite.focus({preventScroll:true});setTimeout(()=>voir(suite));
        }else{
          essais++;b.classList.add('faux');b.disabled=true;b.append(MC.icone('ko','mark'));MC.son.ko();
          if(!rates.includes(file[pos]))rates.push(file[pos]);
          fb.replaceChildren(h('div',{class:'fb ko'},MC.icone('ko'),h('div',{html:'<b>Pas encore.</b> '+MC.rich(q.aide||'Essaie une autre réponse.')})));
          /* le bouton touché se désactive : le clavier passe à la réponse encore possible suivante */
          const l=[...opts.querySelectorAll('button')],apres=l.slice(i+1).concat(l.slice(0,i)).find(x=>!x.disabled);
          if(apres)apres.focus({preventScroll:true});
        }
      }},h('span',{class:'let'},'ABCD'[i]),h('span',{html:MC.rich(t)}));
      return b;
    }));
    const total=file.length;
    const titre=h('h3',{style:'flex:1',tabindex:-1,html:MC.rich(q.q)});
    const nouvelle=!debut;
    zone.replaceChildren(h('div',{class:'row'},h('b',null,`Question ${pos+1} sur ${total}`)),pr,
      h('div',{class:'card'},h('div',{class:'row',style:'flex-wrap:nowrap;align-items:flex-start'},titre)),
      opts,fb,h('div',{class:'row'},suite));
    hautZone();
    if(nouvelle)titre.focus({preventScroll:true});
  }
  function bilan(){
    const total=o.questions.length,score=premiereManche?premier:(S.qcm[id]?S.qcm[id].score:0);
    if(premiereManche){const a=S.qcm[id];if(!a||score>=a.score)S.qcm[id]={score,total};sauver();}
    /* Chaque question se termine par la bonne réponse. Reste à revoir celles où il y a eu une erreur dans cette manche. */
    const trouvees=total-rates.length,toutCorrige=!premiereManche&&!rates.length;
    const nb=Math.max(1,Math.round(trouvees/total*3));
    const etoiles=h('div',{class:'row',role:'img','aria-label':`${nb} ${nb>1?'étoiles':'étoile'} sur 3`},[0,1,2].map(i=>{const e=MC.icone('etoile');e.style.width='56px';e.style.height='56px';if(i>=nb)e.style.opacity='.18';return e;}));
    MC.son.fin();
    const relance=rates.slice();
    const rep=n=>n>1?'bonnes réponses':'bonne réponse';
    const titre=premiereManche?`${trouvees} ${rep(trouvees)} du premier coup sur ${total}`:toutCorrige?'Tu as trouvé toutes les réponses. Bravo !':`${trouvees} ${rep(trouvees)} sur ${total}`;
    const reste=relance.length,mot=reste>1?`Il te reste ${reste} questions à revoir.`:'Il te reste 1 question à revoir.';
    const msg=toutCorrige?'Tu as corrigé tes erreurs. Bien joué !':!premiereManche?`Tu y es presque. ${mot}`:!reste?'Parfait ! Tu n\'as fait aucune erreur.':trouvees/total>=.6?'Bien joué ! Tu peux refaire les questions difficiles.':'Tu progresses. Refais les questions difficiles : c\'est comme ça qu\'on apprend.';
    zone.replaceChildren(h('div',{class:'card stack'},h('h3',{tabindex:-1},titre),etoiles,
      MC.nimbus(msg,toutCorrige||trouvees/total>=.6?'content':'pense'),
      h('div',{class:'row'},reste?h('button',{type:'button',class:'btn',onclick:()=>{file=relance;rates=[];pos=0;premiereManche=false;question();}},MC.icone('refaire'),'Refaire ces questions'):null,
        h('button',{type:'button',class:'btn',onclick:()=>{file=o.questions.map((q,i)=>i);rates=[];pos=0;premier=0;premiereManche=true;question();}},'Tout recommencer'))));
    hautZone();
    zone.querySelector('h3').focus({preventScroll:true});
    if(o.fini)o.fini(score,total);
  }
  question();
};

/* Étape de devoir : à utiliser dans le rendu d'une étape {quiz:true}. L'id est celui de la mission. */

/* Glisser ou toucher : on prend un jeton puis on le pose. */
function prenable(j,poser,cibles,prendre){
  let dep=null,fant=null,vise=null;
  const sous=(x,y)=>{const e=document.elementFromPoint(x,y);return e&&e.closest(cibles);};
  /* au doigt, un glisser ne produit pas de click : l'indicateur de glisser précédent est effacé ici */
  j.addEventListener('pointerdown',e=>{if(j.disabled)return;delete j.dataset.glisse;dep={x:e.clientX,y:e.clientY};j.setPointerCapture&&j.setPointerCapture(e.pointerId);});
  j.addEventListener('pointermove',e=>{
    if(!dep)return;
    if(!fant&&Math.hypot(e.clientX-dep.x,e.clientY-dep.y)>10){fant=j.cloneNode(true);fant.classList.add('fantome');fant.style.width=j.offsetWidth+'px';document.body.append(fant);prendre(j);}
    if(fant){fant.style.left=e.clientX-30+'px';fant.style.top=e.clientY-24+'px';const b=sous(e.clientX,e.clientY);if(vise&&vise!==b)vise.classList.remove('vise');if(b){b.classList.add('vise');vise=b;}}
  });
  const fin=e=>{if(!dep)return;dep=null;if(vise)vise.classList.remove('vise');
    if(fant){fant.remove();fant=null;j.dataset.glisse='1';const b=sous(e.clientX,e.clientY);if(b)poser(b);vise=null;}};
  j.addEventListener('pointerup',fin);j.addEventListener('pointercancel',()=>{dep=null;if(fant){fant.remove();fant=null;}});
}

/* Widget : tri dans des bacs. bacs=[{id,nom,couleur,icone}], items=[{t,bac,pourquoi}] */
MC.tri=function(root,o){
  let pris=null,restants=o.items.length,erreurs=0;
  const fb=h('div',{'aria-live':'polite'});
  const pioche=h('div',{class:'pioche'});
  const choisir=j=>{if(pris){pris.classList.remove('pris');pris.setAttribute('aria-pressed','false');}pris=j;if(j){j.classList.add('pris');j.setAttribute('aria-pressed','true');}};
  const poser=b=>{
    if(!pris){fb.replaceChildren(h('div',{class:'fb ko'},MC.icone('ko'),h('div',null,'Touche d\'abord une carte à trier.')));return;}
    const it=pris._item,bac=b._bac;
    if(it.bac===bac.id){
      pris.classList.remove('pris');pris.setAttribute('aria-pressed','false');pris.classList.add('bon');pris.disabled=true;b.append(pris);restants--;MC.son.ok();
      fb.replaceChildren(h('div',{class:'fb ok'},MC.icone('ok'),h('div',{html:'<b>Oui !</b> '+MC.rich(it.pourquoi||'')})));
      pris=null;
      if(!restants){MC.son.fin();pioche.remove();fb.append(h('div',{class:'fb ok',style:'margin-top:.5rem'},MC.icone('ok'),h('div',{html:erreurs?'<b>Tout est trié !</b>':'<b>Tout est trié, sans erreur !</b>'})));if(o.fini)o.fini(erreurs);}
    }else{
      erreurs++;MC.son.ko();
      fb.replaceChildren(h('div',{class:'fb ko'},MC.icone('ko'),h('div',{html:'<b>Pas ici.</b> '+MC.rich(it.aide||'Essaie une autre case.')})));
      choisir(null);
    }
  };
  const bacs=h('div',{class:'bacs'},o.bacs.map(b=>{
    const n=h('div',{class:'bac',style:`--bac:${b.couleur||'var(--nuit)'}`,role:'button',tabindex:0,'aria-label':'Poser dans '+b.nom,
      onclick:e=>{if(!e.target.closest('.jeton'))poser(n);},onkeydown:e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();poser(n);}}},
      h('b',null,b.icone?MC.icone(b.icone):null,b.nom));
    n._bac=b;return n;
  }));
  melange(o.items).forEach(it=>{
    const j=h('button',{type:'button',class:'jeton',html:MC.rich(it.t),onclick:()=>{if(j.disabled)return;if(j.dataset.glisse){delete j.dataset.glisse;return;}choisir(pris===j?null:j);}});
    j._item=it;prenable(j,poser,'.bac',choisir);pioche.append(j);
  });
  root.append(h('div',{class:'stack'},o.consigne?MC.nimbus(o.consigne,'pense'):null,pioche,bacs,fb));
};

/* Widget : relier deux par deux. paires=[{a,b,pourquoi}] */
MC.relier=function(root,o){
  let choixA=null,reste=o.paires.length;const fb=h('div',{'aria-live':'polite'});
  const G=h('div'),D=h('div');
  const faire=(p,cote)=>h('button',{type:'button',class:'jeton',html:MC.rich(p[cote])});
  melange(o.paires).forEach(p=>{const j=faire(p,'a');j._p=p;j.addEventListener('click',()=>{if(j.disabled)return;if(choixA)choixA.classList.remove('pris');choixA=j;j.classList.add('pris');});G.append(j);});
  melange(o.paires).forEach(p=>{const j=faire(p,'b');j._p=p;j.addEventListener('click',()=>{
    if(j.disabled)return;
    if(!choixA){fb.replaceChildren(h('div',{class:'fb ko'},MC.icone('ko'),h('div',null,'Touche d\'abord une carte à gauche.')));return;}
    if(choixA._p===p){[j,choixA].forEach(x=>{x.classList.remove('pris');x.classList.add('bon');x.disabled=true;});choixA=null;reste--;MC.son.ok();
      fb.replaceChildren(h('div',{class:'fb ok'},MC.icone('ok'),h('div',{html:'<b>Oui !</b> '+MC.rich(p.pourquoi||'')})));
      if(!reste){MC.son.fin();if(o.fini)o.fini();}

  });D.append(j);});

};

/* Widget : remettre dans l'ordre. items dans le bon ordre.
   Après chaque essai, les lignes bien placées sont cochées et figées. À partir du 3e essai, le jeu place une ligne de plus.
   aide (facultatif) : indice donné tant que la première ligne n'est pas trouvée. */
MC.ordre=function(root,o){
  let liste=melange(o.items.map((t,i)=>({t,i}))),essais=0;
  if(liste.every((x,i)=>x.i===i))liste.reverse();
  const zone=h('div',{class:'ordre'}),fb=h('div',{'aria-live':'polite'}),figees=new Set();
  const voisine=(i,s)=>{for(let j=i+s;j>=0&&j<liste.length;j+=s)if(!figees.has(liste[j].i))return j;return -1;};
  const bouger=(i,s)=>{const j=voisine(i,s),x=liste[i];[liste[i],liste[j]]=[liste[j],liste[i]];dessiner(x.i,s);};
  const fleche=(x,i,s)=>h('button',{type:'button',class:'btn icone mini','aria-label':(s<0?'Monter : ':'Descendre : ')+MC.parlable(x.t),'data-s':s,disabled:voisine(i,s)<0,onclick:()=>bouger(i,s)},svgFleche(s));
  function dessiner(suivie,s){
    zone.replaceChildren(...liste.map((x,i)=>{const f=figees.has(x.i);return h('div',{class:'ligne'+(f?' bon':''),'data-i':x.i},
      f?h('span',{class:'fixe',role:'img','aria-label':'Bien placée'},MC.icone('ok')):[fleche(x,i,-1),fleche(x,i,1)],
      h('span',{class:'t',html:MC.rich(x.t)}));}));
    /* le clavier reste sur la ligne déplacée */
    if(suivie===undefined)return;
    const bs=[...zone.querySelectorAll(`[data-i="${suivie}"] button:not([disabled])`)],b=bs.find(e=>+e.dataset.s===s)||bs[0];
    if(b)b.focus();
  }
  const figer=()=>liste.forEach((x,i)=>{if(x.i===i)figees.add(x.i);});
  const aide=()=>{
    const k=liste.findIndex((x,i)=>x.i!==i);
    if(k<0)return 'Touche Vérifier.';
    if(k===0)return o.aide||'Commence par ce qui se passe en premier.';
    return `Cherche ce qui vient juste après : « ${o.items[k-1].replace(/[.!]\s*$/,'')} ».`;
  };
  const verifier=()=>{
    if(liste.every((x,i)=>x.i===i)){MC.son.fin();figer();dessiner();verif.disabled=true;fb.replaceChildren(h('div',{class:'fb ok'},MC.icone('ok'),h('div',{html:'<b>C\'est le bon ordre !</b> '+MC.rich(o.bravo||'')})));if(o.fini)o.fini();return;}
    MC.son.ko();essais++;figer();
    let msg;
    if(essais>=3){
      const k=liste.findIndex((x,i)=>x.i!==i),j=liste.findIndex(x=>x.i===k);
      [liste[k],liste[j]]=[liste[j],liste[k]];figer();msg='Je t\'aide : j\'ai placé une ligne pour toi.';
    }else{
      const n=figees.size;
      msg=!n?'Aucune ligne n\'est encore à sa place.':`${n} ${n>1?'lignes':'ligne'} sur ${liste.length} ${n>1?'sont à leur place : je les ai cochées.':'est à sa place : je l\'ai cochée.'}`;
    }
    dessiner();
    const t=msg+' '+aide();
    fb.replaceChildren(h('div',{class:'fb ko'},MC.icone('ko'),h('div',{html:'<b>Pas encore.</b> '+MC.rich(t)})));
  };
  const verif=h('button',{type:'button',class:'btn go',onclick:verifier},'Vérifier');
  dessiner();
  root.append(h('div',{class:'stack'},o.consigne?MC.nimbus(o.consigne,'pense'):null,zone,h('div',{class:'row'},verif),fb));
};

/* Mémory. paires=[{a,b}]. Deux cartes différentes restent ouvertes jusqu'à ce que l'élève choisisse de les retourner. */
MC.memory=function(root,o){
  const paquet=melange(o.paires.flatMap((p,i)=>[{t:p.a,i},{t:p.b,i}]));
  let ouv=[],trouve=0,coups=0,attente=null;
  const cacher=v=>{v.b.classList.remove('vu');v.b.setAttribute('aria-label','Carte cachée');v.b.replaceChildren(MC.icone('terre'));};
  const retourner=h('button',{type:'button',class:'btn go memo-retour',hidden:true,onclick:()=>{attente.forEach(cacher);const prem=attente[0].b;attente=null;retourner.hidden=true;retourner.classList.remove('pulse');prem.focus();}},MC.icone('refaire'),'Retourner les cartes');
  const g=h('div',{class:'grid3'},paquet.map(c=>{
    const b=h('button',{type:'button',class:'retour',style:'min-height:110px','aria-label':'Carte cachée',onclick:()=>{
      if(attente){retourner.classList.add('pulse');return;}
      if(b.classList.contains('vu'))return;
      b.classList.add('vu');b.setAttribute('aria-label',c.t);b.replaceChildren(h('span',{html:MC.rich(c.t.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,a,x)=>x||a))}));
      /* la 2e carte se lit à la suite de la 1re, sans la couper */
      ouv.push({b,c});
      if(ouv.length===2){coups++;const [x,y]=ouv;ouv=[];
        if(x.c.i===y.c.i){trouve++;MC.son.ok();[x,y].forEach(v=>{v.b.style.borderColor='var(--ok)';v.b.style.background='var(--ok-bg)';});if(trouve===o.paires.length){MC.son.fin();if(o.fini)o.fini(coups);}}
        else{attente=[x,y];retourner.hidden=false;retourner.focus({preventScroll:true});MC.annonce('Ces deux cartes ne vont pas ensemble.');}}
    }},MC.icone('terre'));
    return b;
  }));
  root.append(h('div',{class:'stack'},o.consigne?MC.nimbus(o.consigne,'pense'):null,g,retourner));
};

function melange(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* Bande de réchauffement : une barre par année. */
const RAMP=['#08306b','#08519c','#2171b5','#4292c6','#6baed6','#9ecae1','#c6dbef','#deebf7','#fee0d2','#fcbba1','#fc9272','#fb6a4a','#ef3b2c','#cb181d','#a50f15','#67000d'];
MC.couleurTemp=v=>RAMP[Math.max(0,Math.min(15,Math.round((v+.5)/2.05*15)))];
MC.bande=function(o){
  const T=MC.data.temp,n=T.length,deb=MC.data.tempStart;o=o||{};

  const s=svg(`<svg viewBox="0 0 ${n} 20" preserveAspectRatio="none" role="img" aria-label="Bande de 176 barres, une par année de 1850 à 2025. Les barres passent du bleu au rouge foncé.">${rects}</svg>`);
  const box=h('div',{class:'bande'},s,h('span',{class:'ann g'},'1850'),h('span',{class:'ann d'},'2025'));
  const lire=e=>{const r=box.getBoundingClientRect(),i=Math.max(0,Math.min(n-1,Math.floor((e.clientX-r.left)/r.width*n))),v=T[i];
    lue.textContent=`En ${deb+i} : ${v>=0?'+':'−'}${Math.abs(v).toFixed(1).replace('.',',')} °C par rapport à avant les grandes usines (moyenne 1850-1900).`;};
  box.addEventListener('pointermove',lire);box.addEventListener('pointerdown',lire);
  return h('div',{class:'stack',style:'gap:.4rem'},box,lue);
};

function etape(m,i){
  const s=m.steps[i],k=cle(m,s);document.title='Mission Climat';
  const contenu=h('div',{class:'stack'});
  const suiv=h('button',{type:'button',class:'btn go',hidden:!!s.quiz&&!S.fait[k],onclick:()=>{if(i+1<m.steps.length)MC.go(cle(m,m.steps[i+1]));else MC.go(m.id+'-fin');}},h('span',null,i+1<m.steps.length?'Suivant':'Terminer'),MC.icone('droite'));
  let rendue=false,salue=false,connus=new Set();
  /* Tout retour .fb qui apparaît après une action, même dans un composant de module, est amené à l'écran. */
  new MutationObserver(l=>{
    if(!rendue)return;
    const f=[];l.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1)f.push(...(n.matches('.fb')?[n]:n.querySelectorAll('.fb')));}));
    if(f.length)voir(f[f.length-1]);
  }).observe(contenu,{childList:true,subtree:true});
  const retiensVisibles=()=>[...contenu.querySelectorAll('.retiens')].filter(e=>e.offsetParent!==null);
  const marquer=()=>{if(!S.fait[k]){S.fait[k]=1;sauver();}suiv.hidden=false;majJauge();const d=document.querySelector('.dot.on');if(d)d.classList.add('fait');};
  /* À la réussite : d'abord le « Je retiens » s'il vient d'apparaître, ensuite seulement l'appel à passer à la suite */
  const api={el:contenu,mission:m,fait:()=>{
    marquer();
    if(!rendue||salue){suiv.classList.add('pulse');return;}
    salue=true;
    setTimeout(()=>{
      if(!contenu.isConnected)return;
      const r=retiensVisibles().filter(e=>!connus.has(e)).pop();
      if(!r){suiv.classList.add('pulse');return;}
      const x=r.getBoundingClientRect(),t=document.querySelector('.top'),b=document.querySelector('.bas');
      const cache=x.top<(t?t.getBoundingClientRect().bottom:0)||x.bottom>(b?b.getBoundingClientRect().top:innerHeight);
      if(cache)voir(r);
      setTimeout(()=>suiv.classList.add('pulse'),cache?1400:0);
    });
  }};
  const dots=h('nav',{class:'dots','aria-label':'Étapes de la mission'},m.steps.map((x,j)=>h('a',{class:'dot'+(j===i?' on':'')+(S.fait[cle(m,x)]?' fait':''),href:'#'+cle(m,x),title:x.titre,'aria-label':`Étape ${j+1} : ${x.titre}`,'aria-current':j===i?'step':null})));
  const bas=h('div',{class:'bas noprint'},
    h('button',{type:'button',class:'btn','aria-label':'Étape précédente',onclick:()=>MC.go(i?cle(m,m.steps[i-1]):'accueil')},MC.icone('gauche'),h('span',{class:'lib'},i?'Retour':'Accueil')),
    h('span',{class:'sp'}),suiv);
  ecran([h('div',{class:'stack '+m.id},
    h('div',{class:'head'},h('div',null,h('div',{class:'num'},`Mission ${m.n} · Étape ${i+1} sur ${m.steps.length}`),h('h2',{},s.titre)),dots),
    contenu)],bas);
  bas.classList.add(m.id);
  s.rendu(contenu,api);
  if(s.auto)marquer();
  connus=new Set(retiensVisibles());rendue=true;
  if(s.auto)suiv.classList.add('pulse');
}

function corpsMots(){

/* Le monde en projection de Miller : les 5 bandes restent assez hautes pour être touchées au doigt ---- */
const LMAP=560,KM=LMAP/(2*Math.PI);
const mil=lat=>1.25*Math.log(Math.tan(Math.PI/4+.4*rad(Math.max(-89.9,Math.min(89.9,lat)))));
const HMAP=Math.round(2*KM*mil(90));
const mx=lon=>(lon+180)*LMAP/360;
const my=lat=>HMAP/2-KM*mil(lat);
let BASE=null;
/* Anneaux des terres : on recolle ce qui traverse la ligne de changement de date.
   Sinon de longues bandes parasites traversent la carte (Sibérie, Fidji, Antarctique). */
function anneaux(){
  if(BASE)return BASE;
  BASE=MC.data.world.split('M').filter(Boolean).map(s=>{
    const o=[];let dec=0,prev=null;
    s.replace('Z','').split('L').forEach(p=>{const [x,y]=p.split(' ').map(Number);
      if(prev!==null&&Math.abs(x-prev)>500)dec+=x>prev?-1000:1000;prev=x;o.push([x+dec,y]);});
    const net=o[o.length-1][0]-o[0][0];
    if(Math.abs(net)>500){const f=net>0?1000:-1000;o.push([o[0][0]+f,o[0][1]],[o[0][0]+f,500],[o[0][0],500]);}
    return o;
  });
  return BASE;
}
let DM=null;
function terresMiller(){
  if(DM)return DM;
  const d=[];
  anneaux().forEach(r=>{
    const xs=r.map(p=>p[0]),a=Math.min(...xs),b=Math.max(...xs),decal=[0];
    if(a<0)decal.push(1000);if(b>1000)decal.push(-1000);
    decal.forEach(dx=>d.push('M'+r.map(([x,y])=>fx(mx((x+dx)*.36-180))+' '+fx(my(90-y*.36))).join('L')+'Z'));
  });
  return DM=d.join('');
}
/* Vue de la Terre de côté (orthographique). Les points cachés sont ramenés sur le bord du disque. */
function terresGlobe(cx,cy,R,lon0){
  const d=[];
  anneaux().forEach(r=>{
    let vis=false;
    const q=r.map(([x,y])=>{
      const l=rad(x*.36-180-lon0),p=rad(90-y*.36),X=Math.cos(p)*Math.sin(l),Y=Math.sin(p),Z=Math.cos(p)*Math.cos(l);
      if(Z>0){vis=true;return fx(cx+R*X)+' '+fx(cy-R*Y);}
      const n=Math.hypot(X,Y)||1;return fx(cx+R*X/n)+' '+fx(cy-R*Y/n);
    });
    if(vis)d.push('M'+q.join('L')+'Z');
  });
  return d.join('');
}

    const sel=new Set(MC.note(cle)||[]);
    const box=h('div',{class:'m1-chips'},liste.map(([t,p])=>{
      const b=h('button',{type:'button',class:'m1-chip','aria-pressed':sel.has(t)?'true':'false',onclick:()=>{
        if(sel.has(t))sel.delete(t);else{sel.add(t);MC.son.ok();}
        b.setAttribute('aria-pressed',sel.has(t)?'true':'false');MC.note(cle,[...sel]);quand();}},p?pic(p):null,t);
      return b;}));
    box.nb=()=>sel.size;return box;
  }
  const suite=h('div',{class:'stack',hidden:true});
  let a,b,ouvert=false;

    ouvert=true;suite.hidden=false;
    suite.append(
      MC.nimbus("Merci, c'est noté. Notre enquête commence : pourquoi fait-il chaud ici et froid là-bas ?",'content'),
      h('ol',{class:'m1-prog'},[

        ['La carte du monde','Les grandes zones et les climats.','terre'],
        ['Trois indices','Le Soleil, l\'altitude, l\'océan.','soleil'],
        ['La vie et la France','Qui vit où, et quels climats chez nous.','thermo']
      ].map(([t,d,i])=>h('li',{},MC.icone(i),h('span',null,h('b',null,t),h('span',null,d))))),
      MC.nimbus("Et le réchauffement ? On enquête dessus à la mission 2. Avant, il faut comprendre les climats.",'pense'));
    api.fait();
    montrer(suite);
  };
  a=chips([['Chaud','chaleur'],['Froid','flocon'],['Désert','dune'],['Montagne','montagne'],['Tropical','palmier'],['Polaire','ours'],['Tempéré','feuille'],['Je ne sais pas encore']],'m1-sondage-a',maj);
  b=chips([['Il fait de plus en plus chaud'],['Les glaces fondent'],['Il y a plus de canicules'],['On en parle aux infos'],['Je ne sais pas encore']],'m1-sondage-b',maj);
  el.append(MC.nimbus("Salut ! On ouvre l'enquête. Ici, pas de note : dis-moi juste ce que tu sais.",'content'),
    h('div',{class:'card stack'},MC.titre('Quels climats connais-tu ?'),MC.p('Touche tout ce que tu connais.'),a),
    h('div',{class:'card stack'},MC.titre('Pourquoi parle-t-on autant du réchauffement ?'),MC.p('Touche ce que tu as déjà entendu.'),b),
    suite);
  maj();
}
