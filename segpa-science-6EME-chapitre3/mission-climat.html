      vues.size<3?MC.p(`Zones découvertes : ${vues.size} sur 3. Touche une autre bande.`,'muted'):
      h('button',{type:'button',class:'btn go',onclick:lancer},'Je colorie la carte',MC.icone('droite')));
    montrer(pano);
  };
  function lancer(){
    mode='colorie';selectionner(-1);palette.hidden=false;
    pano.replaceChildren(MC.nimbus("À toi ! Choisis une couleur, puis touche la bonne bande. Il y a 5 bandes.",'pense'),palette,msg);
    montrer(palette);
  }
  const peindre=i=>{
    if(fait.has(i))return;
    if(!choisi){MC.son.ko();msg.replaceChildren(h('div',{class:'fb ko'},MC.icone('ko'),h('div',null,'Choisis d\'abord une couleur.')));return;}
    const b=BANDES[i],z=ZONES[b.z];
    if(b.z!==choisi){MC.son.ko();msg.replaceChildren(h('div',{class:'fb ko'},MC.icone('ko'),h('div',{html:'<b>Pas celle-ci.</b> '+MC.rich(b.aide)})));return;}
    fait.add(i);peint++;MC.son.ok();
    const r=rects[i];
    coul.insertAdjacentHTML('beforeend',`<rect x="0" y="${fx(r.y)}" width="560" height="${fx(r.hh)}" fill="${z.coul}"/><rect x="0" y="${fx(r.y)}" width="560" height="${fx(r.hh)}" fill="url(#${z.pat})"/>`);
    mots.insertAdjacentHTML('beforeend',pill(552,r.y+r.hh/2,z.mot,{a:'end',fs:20,gras:1}));
    hits[i].setAttribute('aria-label',b.lib+' : '+z.nom);
    if(peint<5){msg.replaceChildren(h('div',{class:'fb ok'},MC.icone('ok'),h('div',{html:`<b>Oui !</b> ${peint} bande${peint>1?'s':''} sur 5.`})));return;}
    MC.son.fin();
    pano.replaceChildren(h('div',{class:'fb ok'},MC.icone('ok'),h('div',{html:'<b>Carte terminée !</b>'})),
      MC.retiens(["Il y a 3 grandes [[zone climatique|zones climatiques]] : froide, tempérée, chaude.","La zone chaude est autour de l'équateur. La France est dans la zone tempérée."]));
    api.fait();
  };
  const toucher=i=>mode==='voir'?voir(i):peindre(i);
  hits.forEach((r,i)=>{r.addEventListener('click',()=>toucher(i));r.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toucher(i);}});});
  pano.append(MC.p('Touche une bande de la carte.','lead'));
  el.append(MC.nimbus("On découpe la Terre en 5 bandes. Il y a 3 sortes de zones. Trouve-les.",'content'),
    h('div',{class:'split wide-l'},MC.fig(s,'Le point rouge montre la France.'),pano));
}

/* 4. La carte des climats (image du livret, lue pixel par pixel) --------------- */
/* rgb : couleur de l'image du livret, sert à reconnaître chaque pixel.
   vu : couleur peinte à l'écran, le même code que la carte des 3 zones (bleu = froid, vert = tempéré, orange = chaud).
   motif : comme sur la carte des 3 zones, pour que la couleur ne soit jamais seule. */
const RAYURES=(x,y)=>(x+y)%15<3,POINTS=(x,y)=>{const a=x%15-7,b=y%15-7;return a*a+b*b<8;};
const PAL=[
 {id:'froid',nom:'Climat froid',mot:'froid',rgb:[195,229,238],vu:[191,227,242],pic:'flocon',txt:["Il fait froid presque toute l'année. Il y a de la glace et de la neige.","Sur cette carte, les très hautes montagnes ont aussi cette couleur."]},
 {id:'tempere',nom:'Climat tempéré',mot:'tempéré',rgb:[241,156,4],vu:[191,221,140],motif:RAYURES,pic:'feuille',txt:["Ni très chaud, ni très froid. Il pleut assez.","Au bord de la Méditerranée, les étés sont secs.","Paysage : des prairies et des forêts."]},
 {id:'continental',nom:'Climat continental',mot:'continental',rgb:[146,170,11],vu:[116,168,74],pic:'chene',txt:["Loin de la mer. Hivers très froids, étés chauds.","Paysage : de grandes plaines et de grandes forêts."]},
 {id:'tropical',nom:'Climat tropical',mot:'tropical',rgb:[224,62,19],vu:[247,166,90],motif:POINTS,pic:'palmier',txt:["Il fait chaud toute l'année. Il pleut beaucoup.","Paysage : la forêt tropicale ou la savane."]},
 {id:'desert',nom:'Climat désertique',mot:'désertique',rgb:[255,212,2],vu:[255,221,87],pic:'dune',txt:["Il fait très chaud le jour. Il ne pleut presque jamais.","Paysage : du sable et des rochers."]},
 {id:'mer',nom:'La mer',mot:'mer',rgb:[19,180,209],vu:[82,170,207],pic:'vague',txt:["Ici, c'est la mer. Touche un continent pour lire son climat."]}
];
/* Échantillon de légende : mêmes couleur et motif que la carte */
const ECHANT={tempere:'repeating-linear-gradient(135deg,rgba(15,42,71,.3) 0 2px,transparent 2px 7px),',tropical:'radial-gradient(circle,rgba(15,42,71,.45) 0 1.6px,transparent 2px) 0 0/7px 7px,'};
const MER=5;
let CARTE=null;
function classer(d,w,he){
  const n=w*he,c=new Uint8Array(n).fill(255);
  for(let i=0;i<n;i++){
    const r=d[i*4],g=d[i*4+1],b=d[i*4+2];let m=1e9,k=255;
    for(let p=0;p<6;p++){const q=PAL[p].rgb,e=(r-q[0])**2+(g-q[1])**2+(b-q[2])**2;if(e<m){m=e;k=p;}}
    if(m<=900)c[i]=k;   /* trop loin de la palette : lettres et bords, décidés plus bas */
  }
  /* coin de l'ancienne légende, coupée au recadrage */
  for(let y=474;y<he;y++)for(let x=0;x<100;x++)c[y*w+x]=255;
  /* petites taches = morceaux de lettres : elles ne comptent pas */
  const vu=new Uint8Array(n),pile=new Int32Array(n);
  for(let i=0;i<n;i++){
    if(vu[i]||c[i]===255)continue;
    let t=0,f=0;pile[t++]=i;vu[i]=1;const k=c[i];
    while(f<t){const a=pile[f++],x=a%w;
      for(const b of [x>0?a-1:-1,x<w-1?a+1:-1,a-w,a+w])if(b>=0&&b<n&&!vu[b]&&c[b]===k){vu[b]=1;pile[t++]=b;}}
    if(t<28)for(let j=0;j<t;j++)c[pile[j]]=255;
  }
  /* chaque pixel douteux prend la classe de son voisin le plus proche */
  let t=0,f=0;for(let i=0;i<n;i++)if(c[i]!==255)pile[t++]=i;
  while(f<t){const a=pile[f++],x=a%w;
    for(const b of [x>0?a-1:-1,x<w-1?a+1:-1,a-w,a+w])if(b>=0&&b<n&&c[b]===255){c[b]=c[a];pile[t++]=b;}}
  return c;
}
function preparerCarte(cb,err){
  if(CARTE)return cb(CARTE);
  const img=new Image();
  img.onerror=err;
  img.onload=()=>{
    const w=853,he=498,cv=document.createElement('canvas');cv.width=w;cv.height=he;
    const c=cv.getContext('2d',{willReadFrequently:true});c.drawImage(img,0,0);
    c.fillStyle='rgb(19,180,209)';c.fillRect(0,474,100,24);
    const id=c.getImageData(0,0,w,he);
    const cl=classer(id.data,w,he),cote=new Uint8Array(w*he);
    /* le trait de côte : là où la mer touche une terre */
    for(let i=0;i<w*he;i++){const a=cl[i],b=(i+1)%w?cl[i+1]:a,e=i+w<w*he?cl[i+w]:a;if(a!==b&&(a===MER||b===MER)||a!==e&&(a===MER||e===MER))cote[i]=1;}
    CARTE={w,he,cl,cote};cb(CARTE);
  };
  img.src=MC.data.mapImg;
}
/* Repères posés sur la carte (image 853 × 498 ramenée à 560 de large). Le toucher passe au travers. */
const LEG_CARTE='Carte simplifiée : on regroupe ici beaucoup de climats.';
function REPERES_CARTE(){
  const X=v=>fx(v*560/853),Y=v=>fx(v*560/853);
  const nom=(x,y,l)=>`<text x="${X(x)}" y="${Y(y)}" text-anchor="middle" font-size="18" font-weight="600" fill="${NUIT}" class="m1-halo">${l.map((t,i)=>`<tspan x="${X(x)}" dy="${i?20:0}">${t}</tspan>`).join('')}</text>`;
  return `<svg class="m1-rep" viewBox="0 0 560 327" aria-hidden="true">
   <path d="M0 ${Y(285)}H560" stroke="#C4340E" stroke-width="2.5"/>
   ${pill(6,Y(285)-14,'Équateur',{a:'start',fs:18,fond:'#FFC933',gras:1})}
   ${nom(170,112,['Amérique','du Nord'])}${nom(142,322,['Amérique','du Sud'])}${nom(492,118,['Europe'])}${nom(432,270,['Afrique'])}${nom(655,165,['Asie'])}${nom(712,352,['Océanie'])}${nom(492,490,['Antarctique'])}
   ${nom(352,396,['Océan','Atlantique'])}${nom(84,432,['Océan','Pacifique'])}${nom(590,322,['Océan','Indien'])}
   <circle cx="${X(394)}" cy="${Y(146)}" r="6" fill="#C4340E" stroke="#fff" stroke-width="2.5"/>
   ${pill(X(394)-11,Y(146),'France',{a:'end',fs:18,fond:'#C4340E',coul:'#fff',trait:'#fff',gras:1})}
  </svg>`;
}
function monde(el,api){
  const cv=h('canvas',{width:853,height:498,tabindex:0,role:'application','aria-label':'Carte des climats du monde. Touche un endroit. Au clavier : les flèches déplacent le repère, Entrée lit le climat.'});
  const repere=h('span',{class:'m1-repere',hidden:true});
  const cadre=h('div',{class:'m1-carte'},cv,MC.svg(REPERES_CARTE()),repere);
  const pano=h('div',{class:'stack m1-pn','aria-live':'polite'},MC.p('Touche la carte pour lire le climat.','lead'));
  const zoneDefi=h('div',{class:'stack m1-zd'});
  let C=null,ctx=null,active=null,kx=426,ky=240,defi=-1,essais=0;
  const DEFIS=[4,3,0];
  const dessiner=k=>{
    if(!C)return;active=k;
    const out=ctx.createImageData(C.w,C.he),o=out.data,c=C.cl,w=C.w;
    for(let i=0,n=w*C.he;i<n;i++){
      const j=i*4,cl=c[i],P=PAL[cl],x=i%w,y=(i-x)/w;
      let q=k===null||cl===k?P.vu:cl===MER?[238,242,245]:[205,213,220],f=1;
      if(C.cote[i]){q=[15,42,71];}
      else if(P.motif&&q===P.vu&&P.motif(x,y))f=.8;
      o[j]=q[0]*f;o[j+1]=q[1]*f;o[j+2]=q[2]*f;o[j+3]=255;
    }
    ctx.putImageData(out,0,0);
    leg.forEach((b,i)=>b.setAttribute('aria-pressed',i===k?'true':'false'));
    tout.hidden=k===null;
  };
  const leg=PAL.slice(0,5).map((p,i)=>h('button',{type:'button',class:'m1-leg','aria-pressed':'false',onclick:()=>dessiner(active===i?null:i)},
    h('i',{style:`background:${ECHANT[p.id]||''}rgb(${p.vu.join(',')})`}),p.mot.charAt(0).toUpperCase()+p.mot.slice(1)));
  const tout=h('button',{type:'button',class:'m1-leg m1-tout',hidden:true,onclick:()=>dessiner(null)},'Tout voir');
  const placer=(x,y)=>{repere.hidden=false;repere.style.left=x/8.53+'%';repere.style.top=y/4.98+'%';};
  const proche=(x,y,k)=>{for(let dy=-6;dy<=6;dy++)for(let dx=-6;dx<=6;dx++){const a=x+dx,b=y+dy;if(dx*dx+dy*dy<=36&&a>=0&&b>=0&&a<C.w&&b<C.he&&C.cl[b*C.w+a]===k)return true;}return false;};
  function question(){
    const p=PAL[DEFIS[defi]];
    zoneDefi.replaceChildren(h('div',{class:'card m1-defi'},h('div',{class:'m1-pts'},DEFIS.map((_,i)=>h('i',{class:i<defi?'ok':i===defi?'on':''}))),
      MC.titre(`Défi ${defi+1} sur 3 : touche un endroit au climat ${p.mot}.`)));
    essais=0;
  }
  function lire(x,y){
    if(!C)return;
    placer(x,y);
    const k=C.cl[y*C.w+x],p=PAL[k];
    if(defi>=0){
      const cible=DEFIS[defi],q=PAL[cible];
      if(k===cible||proche(x,y,cible)){
        MC.son.ok();if(active!==null)dessiner(null);
        pano.replaceChildren(h('div',{class:'fb ok'},MC.icone('ok'),h('div',{html:`<b>Oui !</b> ${q.nom}. ${MC.rich(q.txt[0])}`})));
        defi++;
        if(defi<DEFIS.length)question();
        else{
          defi=-1;MC.son.fin();
          zoneDefi.replaceChildren(h('div',{class:'fb ok'},MC.icone('ok'),h('div',{html:'<b>Les 3 défis sont réussis !</b> Tu sais lire une carte des climats.'})),
            MC.retiens("Sur Terre, il y a beaucoup de climats. On peut les lire sur une carte."));
          api.fait();
        }
      }else{
        essais++;MC.son.ko();
        const aide=k===MER?"C'est la mer. Touche un continent.":`Ici, c'est le ${p.nom.toLowerCase()}.`;
        const plus=essais>=2?` Je t'aide : je montre seulement le climat ${q.mot}.`:` Regarde la légende : cherche « ${q.mot.charAt(0).toUpperCase()+q.mot.slice(1)} ».`;
        pano.replaceChildren(h('div',{class:'fb ko'},MC.icone('ko'),h('div',{html:'<b>Pas encore.</b> '+MC.rich(aide+plus)})));
        if(essais>=2&&active!==cible)dessiner(cible);
      }
      return;
    }
    MC.son.ok();MC.annonce(p.nom);
    pano.replaceChildren(fiche(p.nom,p.txt,pic(p.pic)));
    montrer(pano);
  }
  cv.addEventListener('click',e=>{
    const r=cv.getBoundingClientRect();
    lire(Math.max(0,Math.min(852,Math.round((e.clientX-r.left)/r.width*853))),Math.max(0,Math.min(497,Math.round((e.clientY-r.top)/r.height*498))));
  });
  cv.addEventListener('keydown',e=>{
    const d={ArrowLeft:[-14,0],ArrowRight:[14,0],ArrowUp:[0,-14],ArrowDown:[0,14]}[e.key];
    if(d){e.preventDefault();kx=Math.max(0,Math.min(852,kx+d[0]));ky=Math.max(0,Math.min(497,ky+d[1]));placer(kx,ky);}
    else if(e.key==='Enter'||e.key===' '){e.preventDefault();lire(kx,ky);}
  });
  const lancer=h('button',{type:'button',class:'btn go',onclick:()=>{lancer.remove();defi=0;question();pano.replaceChildren();montrer(zoneDefi,'start');}},'Je lance le défi',MC.icone('droite'));
  zoneDefi.append(h('div',{class:'row'},lancer));
  el.append(MC.nimbus("Voici une carte simplifiée des climats. Touche où tu veux : je lis le climat pour toi.",'content'),
    h('div',{class:'split wide-l m1-mm'},
      h('div',{class:'stack'},h('figure',{class:'fig m1-figc'},cadre,h('figcaption',{},LEG_CARTE))),
      h('div',{class:'stack'},zoneDefi,
        h('div',{class:'m1-legw'},MC.p('Touche un climat pour le voir seul :','m1-legt'),h('div',{class:'m1-legs'},leg,tout)),
        pano)));
  preparerCarte(c=>{C=c;ctx=cv.getContext('2d');dessiner(null);},()=>{pano.replaceChildren(h('div',{class:'fb ko'},MC.icone('ko'),h('div',null,'La carte ne s\'affiche pas sur cet appareil. Essaie un autre navigateur.')));});
}

function altitude(el,api){

  const xA=a=>{for(let i=1;i<G.length;i++)if(a<=G[i][1]){const [x0,a0]=G[i-1],[x1,a1]=G[i];return x0+(x1-x0)*(a-a0)/(a1-a0);}return G[G.length-1][0];};
  const xD=a=>{const l=[G[G.length-1],...D];for(let i=1;i<l.length;i++)if(a>=l[i][1]){const [x0,a0]=l[i-1],[x1,a1]=l[i];return x0+(x1-x0)*(a-a0)/(a1-a0);}return 496;};
  let arbres='';

    const g=xA(a)+12,d=xD(a)-12,pas=34,t=17+r*1.6;

    ${arbres}
   </g>
   <path d="M${pts}" fill="none" stroke="${NUIT}" stroke-width="2.5" stroke-linejoin="round"/>
   <path d="M0 352H560V374H0z" fill="#5C8F2F"/>
   <path d="M0 352H560" stroke="${NUIT}" stroke-width="2.5"/>
   <text x="398" y="${yA(1020)+7}" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">Forêt</text>

   <text x="372" y="${yA(3500)+7}" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">Rochers</text>
   ${[0,1000,2000,3000,4000].map(a=>`<path d="M52 ${yA(a)}h10" stroke="${NUIT}" stroke-width="2"/><text x="48" y="${a?yA(a)+6:yA(a)-5}" text-anchor="end" font-size="18" font-weight="600" fill="${NUIT}">${a===0?'0':a/1000+' km'}</text>`).join('')}
   <path d="M62 ${yA(4000)}H352" stroke="#0A6E94" stroke-width="2.5" stroke-dasharray="8 6"/>
   ${pill(128,yA(4000)-28,'0 °C : la neige reste',{fs:18,trait:'#0A6E94'})}
   <g class="m1-thermo">
    <text x="534" y="52" font-size="18" font-weight="700" text-anchor="middle" fill="${NUIT}">°C</text>
    <rect x="522" y="62" width="24" height="264" rx="12" fill="#fff" stroke="${NUIT}" stroke-width="2.5"/>

  </svg>`);
  const gr=s.querySelector('.m1-grimp'),bul=s.querySelector('.m1-bul'),merc=s.querySelector('.m1-merc'),fl=s.querySelector('.m1-flocons');
  const sortieT=h('b',{class:'m1-grosT'},'24 °C');

  let ouvert=false,box=carnet();

    gr.setAttribute('transform',`translate(${fx(x)} ${fx(y)})`);
    fl.setAttribute('transform',`translate(${fx(x)} ${fx(y)})`);

    merc.setAttribute('y',fx(316-t*10));merc.setAttribute('height',fx(t*10+18));
    sortieT.textContent=tr+' °C';

    h('div',{class:'split wide-l'},MC.fig(s,'Il fait environ 6 °C de moins tous les 1000 mètres (1 km). Exemple : 24 °C en bas.','Une montagne avec une forêt, une prairie, des rochers et de la neige au sommet. Un grimpeur monte, et le thermomètre baisse.'),
      h('div',{class:'stack'},h('div',{class:'card m1-cc'},c,h('div',{class:'m1-tl'},MC.icone('thermo'),h('span',null,'Température ici'),sortieT)),mot)),
    box,zone);
}

function ocean(el,api){
  const P=(lon,lat)=>[(lon+105)*4,(75-lat)*5.8];
  const pts=[[-91,24.5],[-85,24.6],[-81.5,24.6],[-79.6,27],[-79.3,30.5],[-76,34],[-72,37.5],[-65,40],[-55,42],[-45,44.5],[-35,47.5],[-25,50],[-16,52.5],[-11,56],[-5,60.5],[1,63.5],[6,66]].map(p=>P(p[0],p[1]));
  let d=`M${fx(pts[0][0])} ${fx(pts[0][1])}`;
  for(let i=0;i<pts.length-1;i++){
    const a=pts[Math.max(0,i-1)],b=pts[i],c=pts[i+1],e=pts[Math.min(pts.length-1,i+2)];
    d+=`C${fx(b[0]+(c[0]-a[0])/6)} ${fx(b[1]+(c[1]-a[1])/6)} ${fx(c[0]-(e[0]-b[0])/6)} ${fx(c[1]-(e[1]-b[1])/6)} ${fx(c[0])} ${fx(c[1])}`;

  const eur=[[-11,36],[-12,60],[-8,62.5],[5,67],[16,71],[21,69],[11,59],[13,54],[15,50],[9,43.5],[3,41],[-3,35.5]].map(p=>P(p[0],p[1]).map(v=>fx(v)).join(' ')).join('L');
  const vents=[[-27,44.5,-9,46],[-30,54,-12,55],[-24,60,-8,61.5]].map(([a,b,c,e])=>{const [x1,y1]=P(a,b),[x2,y2]=P(c,e);return `<path d="M${fx(x1)} ${fx(y1)}Q${fx((x1+x2)/2)} ${fx(y1-9)} ${fx(x2)} ${fx(y2)}" class="m1-vent" marker-end="url(#m1-fv)"/>`;}).join('');

   <linearGradient id="m1-gb" gradientUnits="userSpaceOnUse" x1="400" x2="520" y1="0" y2="0"><stop offset=".45" stop-color="#7CC3E0"/><stop offset="1" stop-color="#7CC3E0" stop-opacity="0"/></linearGradient>
   <marker id="m1-fv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0l10 5-10 5z" class="m1-ventp"/></marker></defs>
   <rect width="560" height="348" fill="#CDE9F3"/>
   <path d="${ATL}" fill="#EFE6CF" stroke="${NUIT}" stroke-width=".8"/>
   <g clip-path="url(#m1-cl)"><path d="M${eur}Z" class="m1-eur"/></g>
   <path d="M452 226L424 178" stroke="${NUIT}" stroke-width="2"/><circle cx="424" cy="178" r="4" fill="${NUIT}"/>
   <path d="${d}" class="m1-gh"/>
   <g class="m1-gs"><path d="${d}" class="m1-c0"/><path d="${d}" class="m1-c1"/>
    <path d="M0-16L24 0L0 16z" transform="translate(${fx(fin[0])} ${fx(fin[1])}) rotate(${fx(ang)})" fill="#C4340E" stroke="${NUIT}" stroke-width="1.5"/></g>
   ${vents}
   <text x="238" y="284" text-anchor="middle" font-size="19" font-weight="600" fill="#0A5C80">Océan Atlantique</text>
   ${pill(70,318,'Golfe du Mexique',{fs:18,a:'start'})}
   ${pill(88,120,'Amérique',{fs:18})}
   ${pill(470,318,'Afrique',{fs:18})}
   <g class="m1-lab-avec">${pill(288,192,'Gulf Stream',{fs:19,fond:'#C4340E',coul:'#fff',trait:'#fff',gras:1})}${pill(246,120,'Air doux',{fs:18,fond:'#FFE3C7'})}</g>
   <g class="m1-lab-sans">${pill(288,192,'Courant retiré',{fs:18,fond:'#fff',coul:'#5A6F82',trait:'#5A6F82'})}${pill(246,120,'Air plus froid',{fs:18,fond:'#D5ECF6'})}</g>
   ${pill(556,238,'Ouest de l\'Europe',{fs:18,a:'end'})}
   <g class="m1-lab-avec">${pill(556,268,'Hiver doux',{fs:20,a:'end',fond:'#FFC58A',gras:1})}</g>
   <g class="m1-lab-sans">${pill(556,268,'Hiver plus froid',{fs:20,a:'end',fond:'#BFE3F2',gras:1})}</g>

  function etat(e){

        zone.append(MC.retiens(["L'eau de l'océan peut être chaude ou froide. Elle réchauffe ou rafraîchit les côtes.","Un courant d'eau chaude peut rendre une région plus douce en hiver."],'Indice n°3 : l\'océan'),
          MC.nimbus("Bien vu ! Les 3 indices sont trouvés : le Soleil, l'altitude, l'océan. Ils expliquent les climats.",'content'));
        api.fait();
      },reduit()?0:1800);
    }
  }
  el.append(MC.nimbus("Indice n°3 : l'océan. Dans l'Atlantique, un [[courant océanique]] transporte de l'eau chaude : le [[Gulf Stream]]. Touche Sans le courant, puis compare.",'pense'),

      h('div',{class:'stack'},h('div',{class:'row m1-bascule'},btA,btS),txt)),box,zone);
  etat('avec');
}

  const s=MC.svg(`<svg class="courbe" viewBox="0 0 ${W} ${H}">

    ${grille}${ans}

function carte(el,api){
  /* La carte du livret est recadrée : on garde le planisphère, le titre et l'échelle sont refaits en mots. */
  const ZONES=[
   {l:'A',nom:'L\'Arctique, tout en haut',x:70,y:7,bon:true},
   {l:'B',nom:'L\'Afrique',x:58,y:47,aide:'Ici, c\'est orange : bien plus chaud. Mais il y a plus fort. Cherche la couleur la plus foncée.'},
   {l:'C',nom:'L\'océan Pacifique',x:16,y:46,aide:'Ici, c\'est jaune : un peu plus chaud. Cherche la couleur la plus foncée.'},
   {l:'D',nom:'L\'Antarctique, tout en bas',x:50,y:89,aide:'Ici, c\'est clair : ça change peu. Cherche la couleur la plus foncée.'}
  ];
  const fb=h('div',{'aria-live':'polite'}),fin=h('div',{class:'stack'});
  let gagne=false;
  const dessins=[];
  function touche(z,i){
    if(gagne)return;
    dessins[i].forEach(b=>{b.classList.add('vu');});
    if(z.bon){
      gagne=true;dessins[i][0].classList.add('bon');dessins[i][1].classList.add('bon');dessins[i][1].append(MC.icone('ok','mark'));MC.son.ok();
      dessins.flat().forEach(b=>{b.disabled=true;});
      fb.replaceChildren(h('div',{class:'fb ok'},MC.icone('ok'),h('div',{html:'<b>Bravo !</b> '+MC.rich('C\'est [[Arctique|l\'Arctique]], la zone la plus rouge de la carte.')})));
      conclure();api.fait();
    }else{
      MC.son.ko();dessins[i][1].classList.add('faux');dessins[i][1].append(MC.icone('ko','mark'));
      dessins[i].forEach(b=>{b.disabled=true;});
      fb.replaceChildren(h('div',{class:'fb ko'},MC.icone('ko'),h('div',{html:'<b>Pas encore.</b> '+MC.rich(z.aide)})));
    }
  }
  const anneaux=ZONES.map((z,i)=>{const b=h('button',{type:'button',class:'anneau',style:`left:${z.x}%;top:${z.y}%`,'aria-label':`Zone ${z.l} : ${z.nom}`,onclick:()=>touche(z,i)},h('span',null,z.l));dessins[i]=[b];return b;});
  const options=h('div',{class:'opts'},ZONES.map((z,i)=>{const b=h('button',{type:'button',class:'opt',onclick:()=>touche(z,i)},h('span',{class:'let'},z.l),h('span',{},z.nom));dessins[i][1]=b;return b;}));
  const carteEl=h('div',{class:'anom'},h('div',{class:'cadre'},h('img',{src:MC.data.anomImg,alt:'Planisphère coloré. Presque toute la Terre est jaune ou orange. Le haut de la carte, autour du pôle Nord, est rouge.'})),anneaux);
  /* Teintes relevées sur l'échelle de l'image : 8 classes, le bleu et le vert pâle sont regroupés, plus le gris sans mesure. */
  const leg=[['linear-gradient(90deg,#99EEFF 50%,#CCFFDD 50%)','Un peu plus froid'],['#FFFFFF','Pareil'],['#FFFE4B','Un peu plus chaud'],['#FFCC00','Plus chaud'],['#FF7E01','Bien plus chaud'],['#FF0100','Beaucoup plus chaud'],['#7B0000','Le plus chaud'],['#A0A0A0','Pas de mesure']];
  function conclure(){
    if(fin.firstChild)return;
    fin.append(MC.nimbus('Pourquoi là ? La glace blanche renvoie la lumière du Soleil. La mer sombre la garde. Quand la glace fond, ça chauffe encore plus.','oh'),
      MC.retiens(['Presque toute la Terre chauffe, mais pas partout pareil.','[[Arctique|L\'Arctique]] chauffe le plus. La France est dans l\'orange : elle chauffe aussi.']));
    voir(fin);
  }
  const f=h('figure',{class:'fig'},carteEl,MC.legende(leg),h('figcaption',{html:'Carte du livret (source : Wikipédia). Moyenne 2011-2020 comparée à la moyenne 1951-1980.'}));
  el.append(MC.nimbus('**Où** ça chauffe ? Lis les couleurs, puis **touche le cercle** où ça chauffe le plus.','pense'),
    h('div',{class:'split wide-l'},f,h('div',{class:'stack'},h('h3',{},'Où ça chauffe le plus ?'),options,fb)),fin);
  if(faite('carte'))conclure();

function svgSerre(){
  const W=520,H=430;
  const solY=x=>{const t=x/W;return 352-60*t*(1-t);};
  const solD=`M0 352Q260 322 520 352L520 ${H}L0 ${H}Z`;
  /* Les gaz sont mélangés dans tout l'air, du sol au haut de l'atmosphère : positions fixes, pour que les nouvelles molécules s'ajoutent aux anciennes.
     Les flèches piégées font demi-tour à des hauteurs différentes, chacune sur sa molécule (HAUT : hauteur du demi-tour de chaque flèche). */
  const HAUT={1:198,2:150,3:252};
  let g=7;const hasard=()=>{g=(g*137+59)%1009;return g/1009;};
  const cases=[[34,146],[122,126],[214,132],[292,122],[418,128],[136,160],[238,172],[398,176],[28,206],[92,212],[176,196],[264,214],[342,206],[420,222],[52,246],[138,240],[206,252],[296,262],[386,272],[20,284],[120,282],[184,292],[244,308],[322,318],[392,322],[160,330],[78,316]];
  cases.forEach((_,i)=>{const j=Math.floor(hasard()*(i+1));[cases[i],cases[j]]=[cases[j],cases[i]];});
  /* Les 3 molécules des demi-tours arrivent en même temps que leur flèche (crans 1, 2, 3) */
  cases.splice(0,0,[314,HAUT[1]-9]);cases.splice(8,0,[406,HAUT[3]-9]);cases.splice(18,0,[360,HAUT[2]-9]);
  const mols=cases.map(([x,y],i)=>mol(x,y,'m'+i)).join('');
  const jaunes=[[138,104,152,0],[172,106,192,0],[206,104,232,0]].map(([x,y,xf])=>{const yf=solY(xf)-24,dx=xf-x,dy=yf-y;return fleche(`M${x} ${y}L${xf} ${yf}`,xf,yf,dx,dy,'jaune');}).join('');
  const xs=[268,314,360,406];
  const rouges=xs.map((x,i)=>{
    const y0=solY(x)+2;
    const part=fleche(`M${x} ${y0}L${x} 50`,x,50,0,-1,'rouge part p'+i);
    const dep=x-11,arr=x+11,y1=solY(arr)-22,h0=HAUT[i]||150;
    const retour=fleche(`M${dep} ${y0}L${dep} ${h0+22}Q${dep} ${h0} ${x} ${h0}Q${arr} ${h0} ${arr} ${h0+22}L${arr} ${y1}`,arr,y1,0,1,'rouge reste r'+i);
    return part+retour;
  }).join('');
  const etoiles=[[30,24],[92,70],[250,18],[300,70],[420,30],[492,74],[372,84],[120,16]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="1.800" fill="#fff"/>`).join('');
  const arbres=[[34,0],[74,1],[110,0]].map(([x,v])=>{const y=solY(x)+6;return `<g transform="translate(${x} ${y})"><rect x="-3" y="-20" width="6" height="22" fill="#6B4A2B"/><circle class="feuille" cy="${v?-36:-32}" r="${v?19:16}"/></g>`;}).join('');
  return `<svg class="serre" data-cran="0" viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="m2-air" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BDE5F4"/><stop offset="1" stop-color="#EDF9FD"/></linearGradient></defs>
    <rect width="${W}" height="${H}" fill="${NUIT}"/>${etoiles}
    <path d="M0 128Q260 96 520 128L520 356L0 356Z" fill="url(#m2-air)"/>
    <g class="soleil"><g stroke="${SOLEIL}" stroke-width="5" stroke-linecap="round"><path d="M172 2v-0M118 50h-12M226 50h12M134 12l-8-8M210 12l8-8M134 88l-8 8M210 88l8 8"/></g><circle cx="172" cy="50" r="40" fill="${SOLEIL}" stroke="#E0A200" stroke-width="3"/>${tx(172,56,'Soleil')}</g>
    ${tx(12,44,'Espace',{a:'start',c:'#fff',s:19})}
    ${tx(12,176,'Atmosphère',{a:'start',s:19,k:'halo'})}
    <ellipse class="lueur" cx="336" cy="348" rx="176" ry="42" fill="${CHAUD}"/>
    <path class="sol s0" d="${solD}" fill="#E4F1F7"/><path class="sol s1" d="${solD}" fill="#4C8F2B"/><path class="sol s2" d="${solD}" fill="#A0A23A"/><path class="sol s3" d="${solD}" fill="#C4813A"/>
    <path class="sol s0" d="M0 372q40 10 80-2t90 8 110-6 120 4 120-6" fill="none" stroke="#7FB9CC" stroke-width="3"/>
    <g class="arbres">${arbres}</g>
    ${mols}${jaunes}${rouges}
    <g><rect x="132" y="382" width="256" height="36" rx="12" fill="#fff" stroke="${NUIT}" stroke-width="2"/><text class="sol-t" x="260" y="407" text-anchor="middle" font-size="19" font-weight="600" fill="${NUIT}"></text></g>
    <g class="thcarte"><rect x="434" y="128" width="82" height="222" rx="12" fill="#fff" stroke="${NUIT}" stroke-width="2.500"/>
      <text class="th-a" x="475" y="156" text-anchor="middle" font-size="19" font-weight="600" fill="${NUIT}"></text><text class="th-b" x="475" y="178" text-anchor="middle" font-size="19" font-weight="600" fill="${NUIT}"></text>
       <rect x="465" y="190" width="20" height="124" rx="10" fill="#fff" stroke="${NUIT}" stroke-width="2.500"/>
      <rect class="th-niv" x="469.500" y="194" width="11" height="124" fill="${BRAISE}"/>
      <circle cx="475" cy="322" r="17" fill="${BRAISE}" stroke="${NUIT}" stroke-width="2.500"/></g>

function serre(el,api){
  const s=MC.svg(svgSerre());const qs=c=>s.querySelector(c);
  const vus=new Set();let reponse=false;
  const dit=h('div',{'aria-live':'polite'}),compte=h('div',{class:'compte'}),zone=h('div',{class:'stack'}),suite=h('div',{class:'stack'});
  const cases=CRANS.map(()=>h('span',{class:'cas'}));
  const boutons=CRANS.map((c,i)=>h('button',{type:'button',class:'btn cran','aria-pressed':'false',onclick:()=>cur.valeur(i)},c.nom));
  const tuile=(cl,n,t)=>h('div',{class:'tuile'+cl},h('b',null,String(n)),h('span',null,t));
  function maj(i){
    const c=CRANS[i];vus.add(i);s.dataset.cran=i;
    s.querySelectorAll('.mol').forEach((m,j)=>m.classList.toggle('on',j<c.gaz));
    /* Flèches : on en piège une de plus à chaque cran */
    const ordre=[1,3,2,0];
    ordre.forEach((k,j)=>{const p=j<c.piege;qs('.p'+k).classList.toggle('off',p);qs('.r'+k).classList.toggle('off',!p);});
    qs('.lueur').style.opacity=[0,.16,.32,.5][i];
    qs('.sol-t').textContent=c.sol;
    qs('.th-a').textContent=c.val[0];qs('.th-b').textContent=c.val[1]||'';
    qs('.th-niv').style.transform=`scaleY(${c.th})`;
    qs('.th-a').setAttribute('y',c.val[1]?156:168);
    boutons.forEach((b,j)=>{b.classList.toggle('go',j===i);b.setAttribute('aria-pressed',j===i?'true':'false');});
    cases.forEach((e,j)=>e.classList.toggle('on',vus.has(j)));
    const part=4-c.piege;
    compte.replaceChildren(
      tuile('',part,part>1?'flèches partent dans l\'espace':'flèche part dans l\'espace'),
      tuile(' rg',c.piege,c.piege>1?'flèches gardées près de la Terre':'flèche gardée près de la Terre'));
    dit.replaceChildren(MC.nimbus(c.dit,c.hum));
    if(vus.size===CRANS.length&&!zone.firstChild)question();
  }
  const cur=MC.curseur({id:'m2-gaz',nom:'Quantité de gaz dans l\'atmosphère',min:0,max:3,pas:1,val:0,fmt:i=>CRANS[i].nom,change:maj});
  function question(){
    zone.append(enquete({q:'Que font les gaz à effet de serre ?',options:['Ils fabriquent de la chaleur.','Ils gardent une partie de la chaleur près de la Terre.','Ils bloquent la lumière du Soleil.'],bon:1,
      aide:'Regarde les flèches rouges. Où vont-elles quand il y a des gaz ?',expli:'La chaleur ne part pas toute dans l\'espace. Une partie revient vers le sol.',
      ok:()=>{if(reponse)return;reponse=true;conclure();api.fait();}}));
    if(!faite('serre'))voir(zone);
  }
  function conclure(){
    if(suite.firstChild)return;
    const f=MC.svg(svgJardin());
    suite.append(h('div',{class:'split'},
      MC.fig(f,'Une vraie serre de jardin.','Une serre de jardin. Les flèches jaunes du Soleil traversent la vitre. Les flèches rouges de chaleur restent à l\'intérieur.'),
      h('div',{class:'stack'},MC.titre('Pourquoi ce nom ?'),
        MC.p('Dans une serre, la vitre laisse entrer le Soleil. Elle garde la chaleur dedans.'),
        MC.p('Les gaz font un peu pareil autour de la Terre. C\'est comme une couverture : elle ne chauffe pas, elle garde la chaleur.'),
        MC.retiens(['[[effet de serre|L\'effet de serre]] naturel est utile : sans lui, il fait environ −18 °C.','Le problème : il augmente, à cause de nos gaz.']))));
    voir(suite);
  }
  el.append(MC.nimbus('L\'expérience clé ! **Essaie les 4 crans** et suis les flèches rouges.','pense'),
    h('div',{class:'split wide-l simu'},
      h('div',{class:'collant'},MC.fig(s,null,'Schéma de l\'effet de serre. Le Soleil envoie des flèches jaunes vers la Terre. La Terre renvoie des flèches rouges de chaleur. Les gaz sont mélangés dans tout l\'air, du sol au haut de l\'atmosphère. Plus il y a de gaz, plus il y a de flèches rouges gardées près de la Terre.')),
      h('div',{class:'stack'},h('div',{class:'crans'},cur,h('div',{class:'crans-b'},boutons)),dit,compte,
        h('div',{class:'row vus'},h('span',null,'Crans essayés :'),cases),
        MC.legende([[SOLEIL,'Lumière du Soleil'],[CHAUD,'Chaleur de la Terre'],['radial-gradient(circle,#0F2A47 38%,#B5480A 42%)','Gaz à effet de serre']]),
        MC.p('Les [[gaz à effet de serre]] sont dans [[atmosphère|l\'atmosphère]].'),
        MC.p('Les gaz sont mélangés dans tout l\'air. Ce n\'est pas un plafond. Le nombre de flèches est un dessin, pas une mesure.','muted'))),zone,suite);
  if(faite('serre')){[1,2,3].forEach(i=>vus.add(i));setTimeout(()=>{conclure();});}
}

function svgCote(){
  const W=520,H=360;
  const TERRE=[[0,146],[50,116],[105,96],[150,112],[205,160],[250,196],[300,216],[345,232],[400,282],[450,322],[520,346]];
  const terY=x=>{for(let i=1;i<TERRE.length;i++){const [a,b]=TERRE[i-1],[c,d]=TERRE[i];if(x<=c)return b+(d-b)*(x-a)/(c-a);}return TERRE[TERRE.length-1][1];};
  const profil=TERRE.map(p=>p.join(',')).join(' ');
  const bat=(x,l,ht,c)=>`<rect x="${x}" y="${terY(x+l/2)-ht}" width="${l}" height="${ht+20}" fill="${c}" stroke="${NUIT}" stroke-width="2"/>`;
  const fen=(x,y)=>`<rect x="${x}" y="${y}" width="6" height="7" fill="#FFE9A8"/>`;
  const s=MC.svg(`<svg class="cote" viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="m2-cie" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CDEAF5"/><stop offset="1" stop-color="#F3FBFE"/></linearGradient>
      <linearGradient id="m2-gla" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7FDFF"/><stop offset="1" stop-color="#A9DCEC"/></linearGradient>
      <clipPath id="m2-horsterre"><polygon points="0,0 ${W},0 ${W},${TERRE[10][1]} ${TERRE.slice().reverse().map(p=>p.join(',')).join(' ')}"/></clipPath></defs>
    <rect width="${W}" height="${H}" fill="url(#m2-cie)"/>
    <circle cx="476" cy="44" r="26" fill="${SOLEIL}" stroke="#E0A200" stroke-width="3"/>
    ${bat(258,22,44,'#E4C9A0')}${bat(282,28,30,'#D9A77C')}${fen(263,170)}${fen(271,170)}${fen(263,184)}${fen(271,184)}${fen(289,194)}${fen(299,194)}
    <g transform="translate(354 ${terY(354)})"><rect x="-17" y="-26" width="34" height="46" fill="#fff" stroke="${NUIT}" stroke-width="2.500"/><path d="M-23-26L0-46 23-26Z" fill="${BRAISE}" stroke="${NUIT}" stroke-width="2.500" stroke-linejoin="round"/><rect x="-6" y="-16" width="12" height="20" fill="${NUIT}"/></g>
    <polygon points="${profil} ${W},${H} 0,${H}" fill="#7A5B3E"/>
    <polyline points="${profil}" fill="none" stroke="#54402C" stroke-width="3" stroke-linejoin="round"/>
    <polygon class="glace" fill="url(#m2-gla)" stroke="#5FA4BC" stroke-width="2.500" stroke-linejoin="round"/>
    <polyline class="fonte" fill="none" stroke="#2B9BD1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline class="fonte flux2" fill="none" stroke="#fff" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round"/>
    <g clip-path="url(#m2-horsterre)"><rect class="mer" x="0" width="${W}" height="${H}" fill="#1B86BB" opacity=".86"/><path class="vague" d="M-60 0q15 8 30 0t30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0" fill="none" stroke="#fff" stroke-width="3" opacity=".8"/></g>
    <line x1="388" x2="${W}" y1="268" y2="268" stroke="#fff" stroke-width="2.500" stroke-dasharray="8 7"/>
    <g><rect x="436" y="280" width="78" height="27" rx="8" fill="${NUIT}"/>${tx(475,300,'Départ',{c:'#fff',s:18})}</g>
    <g class="bateau"><path d="M-26-2H26L18 12H-18Z" fill="${BRAISE}" stroke="${NUIT}" stroke-width="2.500" stroke-linejoin="round"/><path d="M0-4V-40L22-8Z" fill="#fff" stroke="${NUIT}" stroke-width="2.500" stroke-linejoin="round"/></g>
    <g class="fle-mer"><line x1="500" x2="500" stroke="#fff" stroke-width="5"/><polygon fill="#fff"/></g>
    ${tx(116,270,'Terre',{c:'#fff',s:20})}
    ${tx(496,327,'Mer',{c:'#fff',s:19})}
    ${tx(232,62,'Glacier',{a:'start',s:20})}<line class="fil" x1="228" y1="60" stroke="${NUIT}" stroke-width="2.500"/>
    <g class="alerte" opacity="0"><rect x="196" y="96" width="228" height="34" rx="10" fill="${BRAISE}"/><text class="alerte-t" x="310" y="120" text-anchor="middle" font-size="19" font-weight="600" fill="#fff"></text></g>
  </svg>`);
  const q=c=>s.querySelector(c);
  const NIV0=268,NIV1=205,XMAIS=354,XVIL=280;
  const prof=u=>u<=0||u>=1?0:Math.min(1,u/.1)*Math.pow(1-u,.5);
  const finG=t=>246-124*t;
  const ep=(x,t)=>50*(1-.72*t)*prof((x-12)/(finG(t)-12));
  function poser(t){
    const ptsH=[],ptsB=[];
    for(let x=12;x<=246;x+=6){const y=terY(x);ptsH.push(`${x},${(y-ep(x,t)).toFixed(1)}`);ptsB.unshift(`${x},${y.toFixed(1)}`);}
    q('.glace').setAttribute('points',ptsH.concat(ptsB).join(' '));
    const niv=NIV0+(NIV1-NIV0)*t;
    q('.mer').setAttribute('y',niv);
    q('.vague').setAttribute('transform',`translate(0 ${niv})`);
    /* Le ruisseau de fonte suit la pente, du bout du glacier jusqu'à la mer */
    const dep=finG(t);let rive=dep;while(rive<W&&terY(rive)<niv)rive+=3;
    const ruis=[];for(let x=dep;x<=rive;x+=8)ruis.push(`${x.toFixed(0)},${(terY(x)-4).toFixed(1)}`);
    s.querySelectorAll('.fonte').forEach(f=>{f.setAttribute('points',ruis.join(' '));f.style.opacity=t>.02?1:0;});
    q('.bateau').setAttribute('transform',`translate(446 ${niv})`);
    const fm=q('.fle-mer');fm.style.opacity=t>.12?1:0;
    fm.querySelector('line').setAttribute('y1',NIV0);fm.querySelector('line').setAttribute('y2',niv+10);
    fm.querySelector('polygon').setAttribute('points',pointe(500,niv+12,0,-1,12,9));
    q('.fil').setAttribute('x2',112);q('.fil').setAttribute('y2',(terY(112)-ep(112,t)-1).toFixed(1));
    const maison=niv<terY(XMAIS)-2,ville=niv<terY(XVIL)-2;
    const al=q('.alerte');al.setAttribute('opacity',maison?1:0);q('.alerte-t').textContent=ville?'La ville est touchée':'La maison est touchée';
    return {maison,ville};
  }
  return {s,poser};
}

/* Les polygones qui franchissent la ligne de changement de date traversent toute la carte :

let mondePropre=null;
function monde(){
  if(mondePropre)return mondePropre;
  mondePropre=MC.data.world.split('M').filter(Boolean).map(sp=>{
    const pts=sp.replace(/Z/g,'').split('L').map(p=>p.trim().split(/\s+/).map(Number));
    const deux=[[],[]];let c=0;
    pts.forEach((p,i)=>{if(i&&Math.abs(p[0]-pts[i-1][0])>200)c=1-c;deux[c].push(p);});
    return deux.filter(d=>d.length>2).map(d=>'M'+d.map(p=>p.join(' ')).join('L')+'Z').join('');
  }).join('');
  return mondePropre;
}

    ${tx(X(r20)+16,170,`Moyenne ${per}`,{s:18,a:'end'})}${tx(X(r20)+16,194,'environ '+deg(m20),{s:18,a:'end',g:false})}

      MC.fig(jauge,null,`Une jauge de 0 à plus 2 degrés. L'objectif de l'Accord de Paris est à plus 1,5. La moyenne de ${A1-19} à ${A1} est à environ plus ${String(r20).replace('.',',')}. L'année ${an} seule touche environ plus 1,5.`),
      enquete({q:'Regarde la jauge. Pourquoi les scientifiques regardent-ils une moyenne sur 20 ans ?',options:['Ils n\'ont pas de mesures pour une seule année.','Une seule année peut être plus chaude ou plus fraîche que les autres.','Le climat ne change plus.'],bon:1,

      <circle class="puff" style="--x:${(cx-px)*.5}px;--y:${(cy-py)*.6}px" cx="${px}" cy="${py}" r="9" fill="#5A6B7B"/>
      <circle class="puff p2" style="--x:${(cx-px)*.8}px;--y:${(cy-py)*.8}px" cx="${px}" cy="${py}" r="7" fill="#5A6B7B"/>
      <circle class="puff p3" style="--x:${(cx-px)*.3}px;--y:${(cy-py)*.9}px" cx="${px}" cy="${py}" r="6" fill="#5A6B7B"/>

function ville(el,api){

    <rect width="560" height="462" fill="url(#m3ciel)"/>

    <rect y="222" width="560" height="240" fill="#A5D07C"/>
    <path d="M0 262Q140 276 280 262T560 268V240H0Z" fill="#B6DB92"/>
    <rect y="416" width="560" height="46" fill="#5C6B78"/>

    <g class="couchegaz">${OBJETS.map(dessinGaz).join('')}</g>
  </svg>`);
  const fig=MC.fig(s,"En vrai, le CO2 ne se voit pas. Ici, on le dessine pour le suivre.");fig.classList.add('net');
  const barre=h('div',{class:'barre','aria-hidden':'true'},h('i',{style:'width:0%'}));
  const compteur=h('b',{'aria-live':'polite'},`Objets vus : 0 sur ${TOTAL}`);
  const nim=guide("**Touche les 8 objets.** Pour chacun, regarde s'il rejette du CO2.");
  const fin=h('div',{class:'stack'});
  function choisir(g){
    const id=g.dataset.id,o=OBJETS.find(x=>x.id===id),neuf=!vus.has(id);
    vus.add(id);g.classList.add('vu',o.gaz?'emet':'propre');
    s.querySelector(`.gaz[data-id="${id}"]`)?.classList.add('on');
    g.setAttribute('aria-label',o.nom+(o.gaz?' : rejette du CO2':' : ne rejette pas de CO2'));
    compteur.textContent=`Objets vus : ${vus.size} sur ${TOTAL}`;
    barre.firstChild.style.width=vus.size/TOTAL*100+'%';
    if(neuf)MC.son.ok();
    const pre=o.gaz?'**Oui, ça rejette du CO2.** ':'**Non.** ';
    if(vus.size===TOTAL&&neuf){
      nim.dit(pre+o.texte,o.gaz?'oh':'content',false,true);
      MC.son.fin();
      const r=MC.retiens(["Tout ce qui brûle du pétrole, du gaz naturel ou du charbon rejette du CO2.","Ce gaz garde la chaleur près de la Terre : c'est l'[[effet de serre]]."],"L'indice de Nimbus");
      fin.append(r);voir(r);
      api.fait();
    }else nim.dit(pre+o.texte,o.gaz?'oh':'content');
  }
  s.addEventListener('click',e=>{const g=e.target.closest('.obj');if(g)choisir(g);});
  s.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.closest('.obj')){e.preventDefault();choisir(e.target.closest('.obj'));}});
  el.append(nim,h('div',{class:'split wide-l'},fig,h('div',{class:'stack'},h('div',{class:'stack',style:'gap:.3rem'},compteur,barre),fin)));
}

/* 3. La forêt : couper ou planter ---------------------------------------- */
function foret(el,api){
  const NB=12,MAXP=40;
  let etape=0;
  const spots=[];
  for(let i=0;i<6;i++)spots.push({x:130+i*59,y:302,s:.86});
  for(let i=0;i<6;i++)spots.push({x:108+i*62,y:396,s:1});
  const couleurs=['#3B7A12','#4C9A1F','#2F6A10'];
  const arbre=(p,i)=>{const c=couleurs[i%3],c2=couleurs[(i+1)%3];
    return `<g class="arbre" data-i="${i}" transform="translate(${p.x},${p.y}) scale(${p.s})">
      <g class="souche"><path d="M-11 0L-8-15H8L11 0Z" fill="#8A5A34" stroke="${N}" stroke-width="2"/><ellipse cx="0" cy="-15" rx="8" ry="3.500" fill="#E2C49A" stroke="${N}" stroke-width="1.800"/></g>
      <g class="cime"><path d="M-7 0L-4-44H4L7 0Z" fill="#7A4E2D" stroke="${N}" stroke-width="2.200" stroke-linejoin="round"/><circle cx="-19" cy="-46" r="20" fill="${c2}" stroke="${N}" stroke-width="2.200"/><circle cx="19" cy="-46" r="20" fill="${c2}" stroke="${N}" stroke-width="2.200"/><circle cx="0" cy="-68" r="27" fill="${c}" stroke="${N}" stroke-width="2.200"/></g></g>`;};
  const s=MC.svg(`<svg class="foret" viewBox="0 0 560 420">
    <rect width="560" height="420" fill="#D9EEF6"/>
    <path d="M0 232Q130 208 280 228T560 224V420H0Z" fill="#9CCB6F"/>
    <path d="M0 330Q200 300 560 340V420H0Z" fill="#8ABD5D"/>
    <g transform="translate(6,232)"><rect x="46" y="-96" width="18" height="60" fill="#8A5A44" stroke="${N}" stroke-width="2.500"/><rect x="46" y="-86" width="18" height="8" fill="#fff"/><path d="M4 0V-42L30-56V-42L56-56V-42L84-56V0Z" fill="#AEBBC5" stroke="${N}" stroke-width="2.500" stroke-linejoin="round"/><rect x="16" y="-28" width="16" height="14" fill="#FFE08A" stroke="${N}" stroke-width="2"/><rect x="50" y="-28" width="16" height="14" fill="#FFE08A" stroke="${N}" stroke-width="2"/></g>
    <g class="parts"></g>
    <g class="fleches">
      <path d="M61 128V76" stroke="#46586A" stroke-width="9" stroke-linecap="round"/><path d="M61 54L44 80H78Z" fill="#46586A" stroke="${N}" stroke-width="2" stroke-linejoin="round"/>
      <g class="fl-abs"><path class="fl-t" d="M236 118V164" stroke="#2F6A10" stroke-width="10" stroke-linecap="butt"/><path class="fl-p" d="M236 190L212 160H260Z" fill="#2F6A10" stroke="${N}" stroke-width="2" stroke-linejoin="round"/></g>
    </g>
    <g class="arbres">${spots.map(arbre).join('')}</g>
    ${pill(61,30,'Rejets',{})}
    ${pill(236,106,'Les arbres absorbent',{c:'lab-abs'})}
    <g class="tube">
      <text x="552" y="24" text-anchor="end" font-size="19" font-weight="700" fill="${N}">${CO2}</text>
      <text x="552" y="46" text-anchor="end" font-size="18" font-weight="600" fill="${N}">dans l'air</text>
      <rect x="508" y="58" width="40" height="216" rx="12" fill="#fff" stroke="${N}" stroke-width="2.500"/>
      <rect class="niv" x="512" y="270" width="32" height="0" rx="8" fill="#46586A"/>
      <path d="M508 143h40M508 191h40" stroke="${N}" stroke-width="2" stroke-dasharray="6 5"/>
      ${pill(502,106,'Beaucoup',{a:'end',s:20})}
      ${pill(502,176,'Moyen',{a:'end',s:20})}
      ${pill(502,242,'Peu',{a:'end',s:20})}
    </g>
  </svg>`);
  const fig=MC.fig(s,"Un point gris = du CO2 dessiné. En vrai, il ne se voit pas. Ce n'est pas une mesure.","Une usine rejette du CO2 dans le ciel, une forêt de 12 arbres en absorbe. Une jauge indique le CO2 dans l'air.");
  fig.classList.add('net');
  const arbres=[...s.querySelectorAll('.arbre')];
  const coupe=new Set();
  const nb=()=>NB-coupe.size;
  const niveau=()=>nb()>=9?'Peu':nb()>=5?'Moyen':'Beaucoup';
  /* Particules de CO2 dans le ciel */
  const NS='http://www.w3.org/2000/svg',cparts=s.querySelector('.parts'),pool=[];
  for(let i=0;i<MAXP;i++){const c=document.createElementNS(NS,'circle');c.setAttribute('r',alea(7,10));c.setAttribute('fill','#46586A');c.setAttribute('stroke',N);c.setAttribute('stroke-width','1.200');c.style.display='none';cparts.append(c);pool.push({c,on:false});}
  const cible=()=>7+Math.round(2.4*(NB-nb()));
  const posAir=()=>[alea(104,396),alea(16,178)];
  const allume=(p,x,y,m)=>{p.on=true;p.m=m;p.x=x;p.y=y;p.a=alea(0,6.28);p.c.style.display='';p.c.setAttribute('cx',x);p.c.setAttribute('cy',y);};
  const eteint=p=>{p.on=false;p.c.style.display='none';};
  const dansAir=()=>pool.filter(p=>p.on&&p.m!=='vers');
  const remplir=()=>{const t=cible();pool.forEach(eteint);for(let i=0;i<t&&i<MAXP;i++){const [x,y]=posAir();allume(pool[i],x,y,'air');}};
  remplir();
  const niv=s.querySelector('.niv');
  /* La jauge suit le niveau visé et non les points en vol : elle atteint toujours la zone annoncée */
  const HAUTE=(270-143)/204,BASSE=(270-191)/204;
  let jg=cible()/MAXP,tEm=0,tAb=0;
  const dessineJauge=v=>{const H=204*Math.min(1,v);niv.setAttribute('y',270-H);niv.setAttribute('height',H);};
  const emet=()=>{const p=pool.find(x=>!x.on);if(!p)return;const [tx,ty]=posAir();allume(p,61,126,'monte');p.tx=tx;p.ty=ty;};
  const absorbe=()=>{const v=arbres.filter(a=>!a.classList.contains('coupe'));if(!v.length)return;const l=dansAir().filter(p=>p.m==='air');if(!l.length)return;const p=l[Math.floor(Math.random()*l.length)],a=v[Math.floor(Math.random()*v.length)],q=spots[+a.dataset.i];p.m='vers';p.tx=q.x;p.ty=q.y-60*q.s;};
  boucle(el,(dt)=>{
    if(!dt){remplir();jg=cible()/MAXP;dessineJauge(jg);return;}
    const S=dansAir().length,T=cible();
    tEm+=dt;tAb+=dt;
    if(tEm>(S<T-1?.2:1.1)){tEm=0;if(S<=T)emet();}
    if(nb()>0&&tAb>(S>T+1?.22:1.1)){tAb=0;if(S>=T)absorbe();}
    pool.forEach(p=>{
      if(!p.on)return;
      if(p.m==='air'){p.a+=dt*alea(-3,3);p.x+=Math.cos(p.a)*dt*14;p.y+=Math.sin(p.a)*dt*14;
        if(p.x<100)p.x=100;if(p.x>400)p.x=400;if(p.y<14)p.y=14;if(p.y>182)p.y=182;}
      else{const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy),v=(p.m==='vers'?120:130)*dt;
        if(d<=v){if(p.m==='vers')eteint(p);else p.m='air';}else{p.x+=dx/d*v;p.y+=dy/d*v;}}
      if(p.on){p.c.setAttribute('cx',p.x.toFixed(1));p.c.setAttribute('cy',p.y.toFixed(1));}
    });
    jg+=(T/MAXP-jg)*Math.min(1,dt*2);
    dessineJauge(jg);
    if(etape<2)suivi();
  });
  const flT=s.querySelector('.fl-t'),flAbs=s.querySelector('.fl-abs'),labAbs=s.querySelector('.lab-abs');
  const nombre=h('b'),motNiv=h('b');
  const etat=h('div',{class:'stats'},h('span',null,'Arbres : ',nombre,' sur '+NB),h('span',{html:MC.rich("CO2 dans l'air : ")},motNiv));
  const objectif=t=>h('li',{},t);
  const m1=objectif('Coupe des arbres. Monte la jauge à « Beaucoup ».');
  const m2=objectif('Replante des arbres. Baisse la jauge à « Peu ».');
  const liste=h('ul',{class:'mission-m'},m1,m2);
  const nim=guide("L'usine rejette du CO2. Les arbres en absorbent. **Coupe des arbres.**");
  const fin=h('div',{class:'stack'});
  const couper=h('button',{type:'button',class:'btn go',onclick:()=>{
    const v=arbres.filter(a=>!a.classList.contains('coupe'));if(!v.length)return;
    const a=v[v.length-1];a.classList.add('coupe');coupe.add(a);maj('coupe');
  }},MC.icone('hache'),'Couper un arbre');
  const planter=h('button',{type:'button',class:'btn',onclick:()=>{
    const v=arbres.filter(a=>a.classList.contains('coupe'));if(!v.length)return;
    const a=v[v.length-1],c=a.querySelector('.cime');
    c.style.transition='none';c.style.opacity='1';c.style.transform='scale(.12)';a.classList.remove('coupe');c.getBoundingClientRect();
    c.style.transition='';c.style.transform='';c.style.opacity='';
    coupe.delete(a);maj('plante');
  }},MC.icone('pousse'),'Planter un arbre');
  function maj(ev){
    nombre.textContent=nb();motNiv.textContent=niveau();
    couper.disabled=nb()===0;planter.disabled=nb()===NB;
    const w=nb()?3+nb()*.75:0;
    flT.setAttribute('stroke-width',w);flAbs.style.display=nb()?'':'none';labAbs.style.display=nb()?'':'none';
    MC.annonce(`Arbres : ${nb()} sur ${NB}. Dioxyde de carbone dans l'air : ${niveau()}.`);
    if(calme()){remplir();jg=cible()/MAXP;dessineJauge(jg);}
    if(ev)suivi(ev);
  }
  /* Appelée à chaque geste et à chaque image : la mission se valide quand la jauge a passé le trait */
  function suivi(ev){
    if(etape===0){
      if(nb()<=4&&jg>=HAUTE){etape=1;m1.classList.add('ok');MC.son.ok();nim.dit("La jauge est haute ! Moins d'arbres, moins de CO2 absorbé. Maintenant, replante.",'oh');}
      else if(ev==='coupe'&&nb()>4)nim.dit(nb()===11?"Un arbre en moins. L'usine, elle, rejette toujours autant.":"Regarde la flèche verte. Elle devient plus fine : les arbres absorbent moins.",'pense',true);
    }else if(etape===1){
      if(nb()>=9&&jg<=BASSE){etape=2;m2.classList.add('ok');MC.son.fin();
        nim.dit("Bravo ! La jauge redescend. Mais un jeune arbre met des années à grandir.",'content',false,true);
        const r=MC.retiens(["Les arbres absorbent le CO2.","Quand on les coupe, il reste plus de CO2 dans l'air. La Terre se réchauffe encore plus.","Planter aide. Mais protéger les forêts, c'est encore mieux."],'La déforestation');
        fin.append(r);voir(r);
        api.fait();
      }else if(ev==='plante'&&nb()<9)nim.dit("Cet arbre va absorber du CO2. Continue.",'content',true);
    }
  }
  maj();dessineJauge(jg);
  el.append(nim,h('div',{class:'split wide-l'},fig,h('div',{class:'stack'},h('div',{class:'duo ctrl'},couper,planter),liste,etat,fin)));
}

  return `<svg class="chaine" viewBox="0 0 560 320">
    ${fl('M150 58H198')}${pointe(214,58,0)}
    ${fl('M352 58H392')}${pointe(408,58,0)}
    ${fl('M468 142V168')}${pointe(468,184,90)}
    ${fl('M408 240H318')}${pointe(304,240,180)}
    ${noeud(0,`<g transform="translate(58,18)" fill="none" stroke="${N}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M0 4H14L26 56H68L78 18H18" fill="#fff"/><path d="M34 10L38 30M52 4L52 30M64 8L60 30" stroke="#C4340E"/><circle cx="34" cy="68" r="6" fill="${N}"/><circle cx="60" cy="68" r="6" fill="${N}"/></g>`,"J'achète trop",94,124)}
    ${noeud(1,`<g transform="translate(236,6)"><path d="M10 84V30L38 12V30L66 12V30L94 12V84Z" fill="#AEBBC5" stroke="${N}" stroke-width="3" stroke-linejoin="round"/><rect x="24" y="48" width="20" height="18" fill="#FFE08A" stroke="${N}" stroke-width="2"/><rect x="58" y="48" width="20" height="18" fill="#FFE08A" stroke="${N}" stroke-width="2"/></g>`,"On fabrique plus",282,124)}

    <path d="M-46-24Q-30-15-22-17Q0-27 22-17Q40-8 31 3Q12 15-14 11Q-38 7-46-24Z" fill="#C9A67A" stroke="${N}" stroke-width="2.800" stroke-linejoin="round"/>
    <path d="M-20-10Q2-22 18-6Q-2 6-20-10Z" fill="#8A6848" stroke="${N}" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="29" cy="-31" r="15.500" fill="#1F6B4A" stroke="${N}" stroke-width="2.800"/>
    <path d="M16-19Q28-11 40-20" stroke="#fff" stroke-width="4.500" fill="none" stroke-linecap="round"/>
    <path d="M43-36Q58-38 66-31Q58-24 43-26Z" fill="#F2A33A" stroke="${N}" stroke-width="2.200" stroke-linejoin="round"/>

    <g class="microbes">${microbes.map(([x,y],i)=>`<ellipse cx="${x}" cy="${y}" rx="8" ry="4.500" transform="rotate(${i*37} ${x} ${y})" fill="#FFD66B" stroke="${N}" stroke-width="1.600"/>`).join('')}</g>
    ${[80,164,248,332,416,496].map(touffe).join('')}
    ${herbe(122,.3)}${herbe(290,1.1)}${herbe(372,1.9)}
    ${escargot(206,SOL-2,.7)}${escargot(452,SOL-2,1.5)}
    <rect class="eau" x="${G}" y="${HAUT}" width="${D-G}" height="${SOL-HAUT}" fill="#2F9CC4" opacity=".55"/>
    <path class="surface" stroke="#0A6E94" stroke-width="3.500" fill="none"/>
    <path d="M0 176H20Q34 178 40 ${SOL}H0Z" fill="#7A5535" stroke="${N}" stroke-width="2.500"/>
    <path d="M560 176H540Q526 178 520 ${SOL}H560Z" fill="#7A5535" stroke="${N}" stroke-width="2.500"/>
    <g class="fl-air">${[130,262,394].map(x=>`<g transform="translate(${x},0)"><path d="M0 262V318" stroke="#fff" stroke-width="11" stroke-linecap="round"/><path d="M0 262V318" stroke="#0A6E94" stroke-width="7" stroke-linecap="round"/><path d="M0 338L-13 314H13Z" fill="#0A6E94" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></g>`).join('')}</g>
    <g class="bulles"></g>
    <g class="canards" style="display:none"><g class="canard">${canard}</g><g class="canard">${canard}</g></g>
    <g class="o2" style="display:none">${[0,1].map(()=>`<g class="f"><path d="M0 8V40" stroke="#fff" stroke-width="9" stroke-linecap="round"/><path d="M0 8V40" stroke="#0A6E94" stroke-width="5" stroke-linecap="round"/><path d="M0 54L-10 36H10Z" fill="#0A6E94" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></g>`).join('')}</g>
    <g class="lab-air" style="display:none">${pill(280,96,"Flèche = de l'air",{s:20})}</g>
    <g class="lab-eau">${pill(74,0,'Eau',{})}</g>
    ${pill(14,34,'Bulles de méthane : beaucoup',{a:'start',w:400,c:'lab-met',s:20})}
    <g class="lab-boue">${pill(150,416,'Boue sans air',{w:196})}</g>
    ${pill(440,416,'Microbes',{})}
    <path d="M436 396L436 342" stroke="#fff" stroke-width="2.500" stroke-dasharray="5 5"/>
  </svg>`);
  const fig=MC.fig(s,null,"Coupe d'une rizière. La boue est sous l'eau. Des bulles de méthane montent de la boue vers l'air. Trois boutons changent ce nombre de bulles.");
  fig.classList.add('net');
  const NS='http://www.w3.org/2000/svg',gb=s.querySelector('.bulles'),pool=[];
  for(let i=0;i<46;i++){const c=document.createElementNS(NS,'circle');c.setAttribute('fill','#F39A2B');c.setAttribute('stroke','#6E3A00');c.setAttribute('stroke-width','1.500');c.style.display='none';gb.append(c);pool.push({c,on:false});}
  const eau=s.querySelector('.eau'),surf=s.querySelector('.surface'),labEau=s.querySelector('.lab-eau'),labBoue=s.querySelector('.lab-boue');
  const mic=s.querySelector('.microbes'),flAir=s.querySelector('.fl-air'),gc=s.querySelector('.canards'),o2=s.querySelector('.o2'),labAir=s.querySelector('.lab-air');
  const ducks=[...s.querySelectorAll('.canard')].map((g,i)=>({g,x:i?380:150,dir:i?-1:1,v:i?23:32,o:o2.children[i],pa:g.querySelector('.pa'),pb:g.querySelector('.pb')}));
  const E={eau:'plein',canards:false};
  let w=HAUT,tSp=0;
  const facteur=()=>({plein:1,bas:.5,draine:.1}[E.eau])*(E.canards?(E.eau==='draine'?1:.6):1);
  const cibleEau=()=>({plein:HAUT,bas:BAS,draine:SOL}[E.eau]);
  const mot=()=>{const f=facteur();return f>.7?'Beaucoup':f>=.25?'Moins':'Beaucoup moins';};
  function posEau(t){
    eau.setAttribute('y',w);eau.setAttribute('height',Math.max(0,SOL-w));
    const sec=w>SOL-3;
    surf.style.display=sec?'none':'';labEau.style.display=sec||w>SOL-40?'none':'';
    if(!sec){let d=`M${G} ${w}`;for(let x=G;x<D;x+=20)d+=`q10 ${(Math.sin(t*2+x/40)*3).toFixed(1)} 20 0`;surf.setAttribute('d',d);
      labEau.setAttribute('transform',`translate(0,${((w+SOL)/2+6).toFixed(0)})`);}
  }
  function sortie(p){p.on=false;p.c.style.display='none';}
  function nait(y){
    const p=pool.find(x=>!x.on);if(!p)return;
    const [mx,my]=microbes[Math.floor(Math.random()*microbes.length)];
    p.on=true;p.x=mx+alea(-5,5);p.y=y===undefined?my:y;p.r=alea(4.5,8);p.ph=alea(0,6.28);p.v=alea(62,92);
    p.c.style.display='';p.c.setAttribute('r',p.r);p.c.setAttribute('opacity',1);
    p.c.setAttribute('cx',p.x);p.c.setAttribute('cy',p.y);
  }
  function fixe(){pool.forEach(sortie);const n=Math.round(26*facteur());for(let i=0;i<n;i++)nait(alea(30,380));}
  function bouge(dt,t){
    w+=(cibleEau()-w)*Math.min(1,dt*2.2);
    posEau(t);
    tSp+=dt;const per=1/(5.2*facteur());
    while(tSp>per){tSp-=per;nait();}
    pool.forEach(p=>{if(!p.on)return;
      p.y-=p.v*dt*(p.y>SOL?.55:1);p.ph+=dt*4;
      const x=p.x+Math.sin(p.ph)*2.5;
      p.c.setAttribute('cx',x.toFixed(1));p.c.setAttribute('cy',p.y.toFixed(1));
      if(p.y<w)p.c.setAttribute('opacity',Math.max(.15,Math.min(1,p.y/110)).toFixed(2));
      if(p.y<6)sortie(p);});
    if(E.canards){
      const y=w>SOL-34?SOL-34:w;
      ducks.forEach((c,i)=>{
        c.x+=c.dir*dt*c.v;if(c.x>D-100){c.dir=-1;}if(c.x<G+100){c.dir=1;}
        /* les deux canards font demi-tour avant de se toucher */
        if(Math.abs(ducks[0].x-ducks[1].x)<145){const g=ducks[0].x<ducks[1].x?0:1;ducks[g].dir=-1;ducks[1-g].dir=1;}
        c.g.setAttribute('transform',`translate(${c.x.toFixed(1)},${(y+Math.sin(t*3+i)*1.5).toFixed(1)}) scale(${c.dir},1)`);
        const a=Math.sin(t*9+i)*32;
        c.pa.setAttribute('transform',`rotate(${a.toFixed(0)} -6 6)`);c.pb.setAttribute('transform',`rotate(${(-a).toFixed(0)} 10 6)`);
        c.o.setAttribute('transform',`translate(${(c.x-c.dir*44).toFixed(1)},${y})`);
        c.o.style.display=w>SOL-34?'none':'';
      });
    }
  }
  function etatVisuel(){
    /* Tant que la boue reste sous l'eau, seul le mouvement des canards y amène de l'air */
    const aere=E.eau==='draine'||E.canards;
    labBoue.querySelector('text').textContent=aere?"De l'air entre":'Boue sans air';
    flAir.style.display=E.eau==='draine'?'':'none';
    labAir.style.display=aere?'':'none';
    s.classList.toggle('sec',E.eau==='draine');
    s.classList.toggle('avec-canards',E.canards);
    gc.style.display=E.canards?'':'none';o2.style.display=E.canards?'':'none';
    mic.setAttribute('opacity',Math.max(.45,facteur()*1).toFixed(2));
    if(calme()){w=cibleEau();posEau(0);fixe();
      ducks.forEach((c,i)=>{const y=w>SOL-34?SOL-34:w;c.g.setAttribute('transform',`translate(${c.x},${y}) scale(${c.dir},1)`);c.o.setAttribute('transform',`translate(${c.x-c.dir*44},${y})`);c.o.style.display=w>SOL-34?'none':'';});}
  }
  const jg=jauge("Méthane dans l'air",['Beaucoup moins','Moins','Beaucoup']);
  const faune=h('p',{class:'faune'});
  const essais=new Set();
  const nim=guide("Dans la boue sans air, de tout petits [[microbe|microbes]] fabriquent du [[méthane]]. **Essaie les 3 boutons.**");
  const fin=h('div',{class:'stack'});
  const majBoutons=()=>{
    bBas.setAttribute('aria-pressed',E.eau==='bas'?'true':'false');
    bDrain.setAttribute('aria-pressed',E.eau==='draine'?'true':'false');
    bCan.setAttribute('aria-pressed',E.canards?'true':'false');
  };
  function apres(id,txt,hum,muet){
    majBoutons();etatVisuel();
    const f=facteur();jg.maj(f,mot());
    s.querySelector('.lab-met text').textContent='Bulles de méthane : '+mot().toLowerCase();
    faune.textContent=E.canards?'Escargots et mauvaises herbes : mangés. Il faut moins de pesticides.':'Escargots et mauvaises herbes : présents.';
    if(!id)return;
    MC.annonce("Méthane dans l'air : "+mot());
    const neuf=!essais.has(id);essais.add(id);
    nim.dit(txt,hum,muet);
    if(neuf)MC.son.ok();
    bout(id).classList.add('essaye');
    if(essais.size===3&&!fin.firstChild)conclure();

/* Niveau -1 : réponse neutre, sans niveau. adulte:1 : ce choix dépend surtout des adultes, il ne compte pas dans la jauge. */
const VARIE="Ça change d'un jour à l'autre. C'est normal.";
const JOUR=[
 {id:'trajet',ic:'route',adulte:1,q:"Pour aller au collège, je vais…",court:'Trajet',opts:[

  gestes:[null,"Goûte les plats sans viande quand il y en a.","Goûte les plats sans viande quand il y en a."]},
 {id:'ecrans',ic:'ecran',q:"Mon téléphone ou mes écrans…",court:'Écrans',opts:[
   ["Je les garde longtemps",0,"Un objet gardé longtemps évite d'en fabriquer un autre."],
   ["J'en change souvent",2,"Fabriquer un écran rejette beaucoup de CO2."],
   ["Je les change de temps en temps",1,"Chaque nouvel écran a dû être fabriqué et transporté."],
   ["Je n'en ai pas",-1,"D'accord. Il n'y a rien à compter ici."]],
  gestes:[null,"Éteins tes écrans quand tu ne les regardes pas.","Protège tes écrans : ils dureront plus longtemps."]},
 {id:'chauffe',ic:'chauffe',adulte:1,q:"En hiver, chez moi…",court:'Chauffage',opts:[
   ["Il fait bon",1,"Chauffer rejette souvent du CO2. Ça dépend de l'appareil."],
   ["Il fait très chaud, on ouvre la fenêtre",2,"La chaleur part dehors. Mais le chauffage, ce sont les adultes qui le règlent."],
   ["Il fait frais, je mets un pull",0,"Mettre un pull plutôt que chauffer, c'est moins de CO2."],
   ["Ça dépend des jours",-1,VARIE]],
  gestes:[null,"Ferme la porte et les volets le soir : la chaleur reste.","Ferme la porte de la pièce : la chaleur reste."]},
 {id:'achats',ic:'sac',q:"Mes vêtements et mes objets…",court:'Achats',opts:[
   ["Neufs, souvent, même sans besoin",2,"Chaque objet neuf a dû être fabriqué et transporté."],
   ["Neufs, seulement quand il faut",1,"Acheter quand on en a besoin, c'est normal."],
   ["D'occasion, prêtés ou réparés",0,"Pas besoin d'en fabriquer un autre : très bien."],
   ["Ça dépend",-1,"Ça change selon les moments. C'est normal."]],
  gestes:[null,"Échange ou donne ce que tu ne portes plus.","Avant d'acheter, demande-toi : est-ce que j'en ai besoin ?"]}
];
const NIV=['Peu','Moyen','Beaucoup'];
const COUL=['#8CCB6B','#FFC933','#E8743B'],GRIS='#C2CDD4';
function empreinte(el,api){
  const rep=JOUR.map(()=>null);   /* niveau choisi pour chaque question */
  const essai=new Set();          /* gestes essayés : on baisse d'un cran */
  const niveau=i=>rep[i]===null||rep[i]<0?rep[i]:Math.max(0,rep[i]-(essai.has(i)?1:0));
  /* Seuls les choix de l'élève comptent : le reste apparaît en gris, sans niveau */
  const compte=i=>!JOUR[i].adulte&&niveau(i)>0;
  const total=()=>JOUR.reduce((a,_,i)=>a+(compte(i)?niveau(i):0),0);
  const MAXI=2*JOUR.filter(J=>!J.adulte).length;
  const verdict=()=>{const t=total();return t<=1?'Peu':t<=2?'Moyen':'Beaucoup';};
  const orteils=[[58,86,20,26,-12],[104,60,15,20,-4],[140,62,13,17,6],[170,76,11.5,15,14],[194,98,10,13,22]];
  const pied=MC.svg(`<svg class="pied" viewBox="0 0 250 310">
    <g class="tout">
      <path class="semelle" d="M124 112C168 106 192 134 186 172C182 200 162 214 158 244C154 280 128 300 102 296C76 292 62 266 68 236C74 206 54 188 54 158C54 128 80 116 124 112Z" fill="#DCE7EC" stroke="${N}" stroke-width="3.500"/>
      ${orteils.map(([x,y,a,b,r],i)=>`<ellipse class="orteil" data-i="${i}" cx="${x}" cy="${y}" rx="${a}" ry="${b}" transform="rotate(${r} ${x} ${y})" fill="#fff" stroke="${N}" stroke-width="3" stroke-dasharray="6 5"/>`).join('')}
    </g></svg>`);
  const fig=MC.fig(pied,null,"Une empreinte de pied. Chaque orteil représente un moment de la journée. Un orteil gris ne compte pas.");
  fig.classList.add('net');
  const jg=jauge('Les gaz de mes choix',NIV,true);
  const ligne=h('ul',{class:'jour','aria-label':'Ma journée'});
  function peindre(){
    const t=total();
    pied.querySelector('.tout').style.transform=`scale(${(.78+t/MAXI*.26).toFixed(3)})`;
    pied.querySelectorAll('.orteil').forEach((o,i)=>{const n=niveau(i);
      o.setAttribute('fill',n===null?'#fff':JOUR[i].adulte||n<0?GRIS:COUL[n]);o.setAttribute('stroke-dasharray',n===null?'6 5':'0');});
    const sem=pied.querySelector('.semelle');sem.setAttribute('fill',t<=1?'#BFE3A8':t<=2?'#FFE08A':'#F2A679');
    jg.maj(t/MAXI,verdict());
    ligne.replaceChildren(...JOUR.map((J,i)=>{const n=niveau(i);if(n===null)return null;
      const gris=J.adulte||n<0;
      return h('li',{class:gris?'gris':null},MC.icone(J.ic),h('span',null,J.court),h('b',{style:`--c:${gris?GRIS:COUL[n]}`},J.adulte?'Dépend des adultes':n<0?'Pas compté':NIV[n]));}).filter(Boolean));
  }
  const zone=h('div',{class:'stack'});
  const nim=guide("**Raconte ta journée.** Il n'y a pas de bonne ou de mauvaise réponse : ce n'est pas une note.",'content');
  let pos=0;
  function question(){
    const J=JOUR[pos];
    const raison=h('div',{'aria-live':'polite'});
    const suite=h('button',{type:'button',class:'btn go',hidden:true,onclick:()=>{pos++;pos<JOUR.length?question():bilan();}},pos+1<JOUR.length?'Question suivante':'Voir mon empreinte',MC.icone('droite'));
    const opts=h('div',{class:'opts'},J.opts.map(([t,n,r])=>{
      const b=h('button',{type:'button',class:'opt','aria-pressed':'false',onclick:()=>{
        rep[pos]=n;peindre();
        opts.querySelectorAll('button').forEach(x=>{const on=x===b;x.setAttribute('aria-pressed',on?'true':'false');x.classList.toggle('coche',on);});
        raison.replaceChildren(h('p',{class:'raison',html:MC.rich(r)}));
        suite.hidden=false;
        if(matchMedia('(max-width:860px)').matches)suite.scrollIntoView({block:'nearest',behavior:calme()?'auto':'smooth'});
      }},h('span',{html:MC.rich(t)}));
      return b;
    }));
    zone.replaceChildren(h('div',{class:'row'},h('b',null,`Question ${pos+1} sur ${JOUR.length}`)),
      h('div',{class:'card stack'},h('div',{class:'row titreq'},MC.icone(J.ic),MC.titre(J.q)),opts,raison,h('div',{class:'row'},suite)));
  }
  function bilan(){
    const ordrePref=[4,2,1,3,0];
    const adulte=x=>JOUR[x.i].adulte?1:0;
    const cand=ordrePref.map(i=>({i,n:rep[i]})).filter(x=>x.n>0).sort((a,b)=>adulte(a)-adulte(b)||b.n-a.n);
    /* Ce qui dépend des adultes ne compte pas dans la jauge : pas de bouton pour ce geste */
    const gestes=cand.slice(0,2).map(x=>({i:adulte(x)?null:x.i,t:JOUR[x.i].gestes[x.n]}));
    const defaut=["Éteins la lumière quand tu sors d'une pièce.","Explique à tes proches ce que tu as appris."];
    while(gestes.length<2)gestes.push({i:null,t:defaut[gestes.length]});
    nim.dit("Tu ne choisis pas tout : le trajet, la cantine et le chauffage dépendent souvent des adultes. Regarde ce que tu peux changer : 2 gestes pour toi.",'content');
    const carte=g=>{
      const b=g.i===null?null:h('button',{type:'button',class:'btn mini essai','aria-pressed':'false',onclick:()=>{
        const on=!essai.has(g.i);on?essai.add(g.i):essai.delete(g.i);
        b.setAttribute('aria-pressed',on?'true':'false');b.replaceChildren(on?MC.icone('ok'):MC.icone('droite'),on?'Geste essayé':'Essayer ce geste');
        peindre();MC.son.ok();
        nim.dit(on?"Regarde la jauge : elle baisse.":"La jauge revient comme avant.",'content',true);
      }},MC.icone('droite'),'Essayer ce geste');
      return h('div',{class:'card geste'},h('p',{html:MC.rich(g.t)}),b);
    };
    zone.replaceChildren(
      h('div',{class:'stack'},MC.titre('2 gestes pour toi'),...gestes.map(carte)),
      MC.question("Comment pouvons-nous réduire notre [[empreinte carbone]] au quotidien ?","Marcher ou rouler à vélo quand c'est possible. Moins gaspiller. Éteindre ce qui ne sert pas. Garder et réparer ses objets."),
      MC.retiens("Agir aujourd'hui sans abîmer la planète de demain : c'est le [[développement durable]]."),
      h('div',{class:'row'},h('button',{type:'button',class:'btn',onclick:()=>{rep.fill(null);essai.clear();pos=0;peindre();nim.dit("On recommence. Raconte ta journée.",'content',true);question();}},MC.icone('refaire'),'Changer mes réponses')));
    MC.son.fin();
    api.fait();
  }
  peindre();question();
  el.append(nim,h('div',{class:'split emp'},zone,h('div',{class:'stack droite'},h('div',{class:'bande-p'},fig,jg),h('div',{class:'stack journee',style:'gap:.3rem'},MC.titre('Les gaz de ma journée',4),ligne))));
}

const BOUCHES=['M249 128q11 8 22 0','M250 130h20','M249 132q11-7 22 0','M249 134q5-7 11 0t11 0'];
const NIVEAUX=['Ça va','Frais','Froid','Très froid'];

function machine(fini){
  const et={vent:false,hum:false,hab:false};let gagne=false;
  const f=MC.fig(SVG_MACHINE,null,'Un thermomètre reste à 5 degrés. À côté, une personne en manteau. Une jauge montre ce que cette personne ressent : ça va, frais, froid ou très froid.');
  const s=f.querySelector('svg'),mark=s.querySelector('.m4-mark'),bouche=s.querySelector('.m4-bouche');
  const dit=h('div',{'aria-live':'polite'});
  const maj=()=>{
    const n=(et.vent?1:0)+(et.hum?1:0)+(et.hab?1:0);
    s.dataset.vent=et.vent?1:0;s.dataset.hum=et.hum?1:0;s.dataset.hab=et.hab?1:0;s.dataset.n=n;
    mark.style.transform=`translateY(${-60*n}px)`;bouche.setAttribute('d',BOUCHES[n]);
    s.querySelectorAll('.m4-n').forEach(t=>t.classList.toggle('on',t.classList.contains('n'+n)));
    if(n===3){
      dit.replaceChildren(h('div',{class:'fb ok'},MC.icone('ok'),h('div',{html:'<b>Trouvé !</b> '+MC.rich('Le thermomètre n\'a pas bougé. Mais le vent, l\'[[humidité]] et l\'habitude changent ce que tu ressens.')})));
      if(!gagne){gagne=true;MC.son.fin();fini();}
    }else dit.replaceChildren(MC.p(`Le thermomètre dit 5 °C. Ton corps dit : **${NIVEAUX[n]}**.`,'lue'));
  };
  const bascule=(cle,ico,lib)=>{
    const e=h('span',{class:'m4-etat'},'Non');
    const b=h('button',{type:'button',class:'btn m4-bascule','aria-pressed':'false',onclick:()=>{et[cle]=!et[cle];b.setAttribute('aria-pressed',et[cle]?'true':'false');e.textContent=et[cle]?'Oui':'Non';MC.son.ok();maj();}},MC.icone(ico),h('span',null,lib),e);
    return b;
  };
  const el=h('div',{class:'split wide-l m4-machine'},f,h('div',{class:'stack'},h('div',{class:'m4-bascules'},bascule('vent','vent','Il y a du vent'),bascule('hum','humide','L\'air est humide'),bascule('hab','valise','Cet air est nouveau pour toi')),dit));
  maj();return el;
}

const JOURS=[['soleil','Grand soleil'],['nuage','Ciel doux'],['pluie','Pluie'],['neige','Neige'],['vent','Grand vent'],['orage','Orage']];
function belleJournee(api){
  const mem=note('m4-belle',{c:'',txt:''});
  const dessous=h('div',{class:'stack'});
  const rangee=h('div',{class:'m4-jours'});
  const dessiner=()=>{
    rangee.replaceChildren(...JOURS.map(([ic,lib])=>h('button',{type:'button',class:'btn m4-jour','aria-pressed':mem.c===ic?'true':'false',onclick:()=>{mem.c=ic;MC.note('m4-belle',mem);MC.son.ok();dessiner();api.fait();}},MC.icone(ic),h('span',null,lib))));
    if(!mem.c){dessous.replaceChildren();return;}
    const lib=JOURS.find(j=>j[0]===mem.c)[1];
    const champ=h('input',{id:'m4-pourquoi',type:'text',class:'m4-champ',maxlength:90,value:mem.txt||'',placeholder:'Parce que…',autocomplete:'off',oninput:e=>{mem.txt=e.target.value;MC.note('m4-belle',mem);}});
    const col=(t,ic,txt)=>h('div',{class:'m4-comp'},h('b',{html:MC.rich(t)}),MC.icone(ic),h('span',{html:MC.rich(txt)}));
    dessous.replaceChildren(
      h('div',{class:'m4-comps'},
        col('Au [[Moyen Âge]]','pluie','La pluie, pour les [[récolte|récoltes]].'),
        col('En ville, aujourd\'hui','soleil','Le soleil, du matin au soir.'),
        col('Pour toi',mem.c,lib+'.')),
      h('div',null,h('label',{for:'m4-pourquoi',class:'m4-lab'},'Pourquoi ? Écris-le si tu veux.'),champ),
      MC.retiens(['Le climat se mesure avec des chiffres.','On parle aussi de [[climat ressenti]] : il se sent avec le corps.','Ce ressenti change selon les personnes et les époques.']));
  };
  dessiner();
  return h('div',{class:'stack'},MC.titre('Et toi ?'),MC.p('Touche ta belle journée. Il n\'y a pas de mauvaise réponse.'),rangee,dessous);
}

function rendreRessenti(el,api){
  const deja=estFait('ressenti');
  const p2=h('div',{class:'stack',hidden:!deja}),p3=h('div',{class:'stack',hidden:!deja});
  const z=h('div');
  MC.cartes(z,{consigne:'Un thermomètre donne un chiffre. Ton corps, lui, donne une impression. Touche les 2 cartes pour lire 2 histoires.',colonnes:2,
    cartes:[{titre:'Au Moyen Âge',visuel:VIS_MOYENAGE,dos:'Une belle journée, c\'est une journée de pluie. Pourquoi ? Les récoltes ont besoin d\'eau.'},
            {titre:'Des personnes venues du froid',visuel:VIS_FROID,dos:'Chez elles, il fait −10 °C en hiver. En Normandie, il fait 5 °C. Et elles ont très froid !'}],
    fini:()=>{if(p2.hidden)setTimeout(()=>ouvrir(p2),500);}});
  p2.append(MC.titre('La machine à ressenti'),
    MC.nimbus('Avoir très froid à 5 °C ? Bizarre… Active les 3 boutons. Regarde le thermomètre, puis la jauge.','pense'),
    machine(()=>{if(p3.hidden)setTimeout(()=>ouvrir(p3),900);}));
  p3.append(belleJournee(api));
  el.append(z,p2,p3);
}

function chaineSchema(c){
  const fl=()=>MC.svg('<svg class="m4-fl" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>');
  const k=[];c.forEach((t,i)=>{if(i)k.push(fl());k.push(h('span',{class:'m4-maillon'},h('span',{html:MC.rich(t)})));});
  return h('div',{class:'m4-chaine','aria-label':'Ce qui se passe, dans l\'ordre : '+MC.parlable(c.join(', puis ')),role:'group'},k);
}

  const quartierS=MC.fig(SVG_QUARTIER,'Les vélos suivent une ligne jusqu\'à l\'école, comme un bus.','Dessin d\'un quartier : une ligne de vélos va de chez toi vers l\'école, un composteur, un collège. Trois actions numérotées.');

      h('div',{class:'row'},choix)));

  const bouton=a=>{const v=MC.svg(VIS[a.id]);const b=h('button',{type:'button',class:'m4-dos',onclick:()=>ouvrirDossier(a)},
      h('span',{class:'m4-num'},String(a.n)),v,h('span',{class:'m4-dt'},h('b',null,a.titre),h('span',{class:'muted'},a.lieu)),MC.icone('ok','m4-lu'));
    boutons[a.id]=b;return b;};
  el.append(
    MC.nimbus('Beaucoup de gens agissent déjà pour le climat. Ouvre au moins 4 dossiers. Pour chaque action, cherche : qui, quoi, pourquoi.','pense'),
