/* Mission Assiette : nappe crème, encre bleu nuit, une couleur par mission (tomate, feuille, aubergine, océan).
   Une seule idée par écran, gros boutons, couleur toujours doublée d'un symbole. */
:root{
  --nuit:#24324A; --ciel:#FFF6E8; --papier:#FFFFFF; --ocean:#0A6E94; --braise:#C4340E; --soleil:#FFC933;
  --glace:#C3E5EE; --foret:#3B7A12; --brume:#585E6E; --trait:#E6D6BE; --lilas:#5B4BA8;
  --ok:#1F7A3D; --ok-bg:#E2F4E6; --ko:#B5480A; --ko-bg:#FDEBDD;
  --m:var(--ocean); --m-bg:#DDF0F6;
  --fd:'Lilita One','Trebuchet MS',Verdana,sans-serif; --fb:'Lexend',Verdana,'Trebuchet MS',Arial,sans-serif;
  --r:16px; --ombre:0 3px 0 rgba(36,50,74,.14); --gap:1rem; --lh:1.6; --ls:0;
  color-scheme:light;
}
.m1{--m:#C2361B;--m-bg:#FCE7DF}
.m2{--m:#3B7A12;--m-bg:#E6F2DA}
.m3{--m:#6A3FA0;--m-bg:#EEE6F8}
.m4{--m:#0A6E94;--m-bg:#DDF0F6}
*{box-sizing:border-box}
[hidden]{display:none!important}
/* scroll-padding : ce qui reçoit le focus ou défile reste entre la barre du haut et la barre du bas */
html{height:100%;font-size:112.5%;-webkit-text-size-adjust:100%;scroll-padding:4.5rem 0 6.5rem}
html[data-size="1"]{font-size:125%} html[data-size="2"]{font-size:143%}
html[data-air="1"]{--lh:1.95;--ls:.05em}
body{margin:0;min-height:100%;background:var(--ciel);color:var(--nuit);font-family:var(--fb);line-height:var(--lh);letter-spacing:var(--ls);font-weight:400;overflow-x:hidden}
h1,h2,h3{font-family:var(--fd);font-weight:400;line-height:1.15;letter-spacing:.005em;margin:0;text-wrap:balance}
h1{font-size:2.6rem} h2{font-size:1.9rem} h3{font-size:1.35rem}
p{margin:0} ul,ol{margin:0;padding-left:1.4rem} li+li{margin-top:.35rem}
img,svg{max-width:100%} svg{display:block;height:auto}
a{color:var(--ocean);font-weight:600}
sub{font-size:.7em;line-height:0}
button{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:4px solid var(--soleil);outline-offset:2px;box-shadow:0 0 0 7px var(--nuit)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* Barre du haut */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:.5rem;padding:.45rem max(16px,calc(50vw - 560px));background:var(--nuit);color:#fff}
.logo{font-family:var(--fd);font-size:1.2rem;color:#fff;text-decoration:none;padding:.3rem .55rem;border-radius:10px;display:flex;align-items:center;gap:.45rem;white-space:nowrap}
.logo svg{width:28px;height:28px}
.top .sp{flex:1}
.tool{min-height:48px;min-width:48px;padding:.3rem .7rem;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;background:transparent;color:#fff;border:2px solid rgba(255,255,255,.3);border-radius:12px;cursor:pointer;font-weight:600;font-size:.88rem}
.tool:hover{background:rgba(255,255,255,.12)}
.tool svg{width:22px;height:22px}
.jauge{display:flex;align-items:center;gap:.4rem;font-size:.82rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.jauge svg{width:20px;height:20px}

/* Conteneurs */
main{max-width:1120px;margin:0 auto;padding:1.25rem 16px 7rem}
main:focus{outline:none;box-shadow:none}
.alerte{margin-bottom:var(--gap)}
.stack{display:flex;flex-direction:column;gap:var(--gap)}
.row{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.25rem;align-items:start}
.split.wide-r{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr)}
.split.wide-l{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.8rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.8rem}
.card{background:var(--papier);border:2px solid var(--trait);border-radius:var(--r);padding:1rem 1.1rem;box-shadow:var(--ombre)}
.card>*+*{margin-top:.6rem}
.lead{font-size:1.12rem;max-width:62ch}
.muted{color:var(--brume);font-size:.88rem}
.txt{max-width:65ch}
.txt+.txt{margin-top:.5rem}

/* En-tête d'étape */
.head{background:var(--m);color:#fff;border-radius:var(--r);padding:.9rem 1.1rem;display:flex;gap:.9rem;align-items:center;flex-wrap:wrap}
.head .num{font-size:.85rem;font-weight:600;opacity:.92}
.head h2{color:#fff}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:transparent;padding:0;cursor:pointer;display:grid;place-items:center}
.dot.on{background:var(--soleil);border-color:var(--soleil)}
.dot.fait{background:#fff}
.dot.fait::after{content:'';width:9px;height:5px;border:solid var(--m);border-width:0 0 3px 3px;transform:rotate(-45deg) translate(1px,-1px)}

/* Boutons */
.btn{min-height:52px;padding:.55rem 1.1rem;border-radius:14px;border:2px solid var(--nuit);background:#fff;color:var(--nuit);font-weight:600;cursor:pointer;box-shadow:0 3px 0 var(--nuit);display:inline-flex;align-items:center;justify-content:center;gap:.5rem;text-decoration:none;transition:transform .08s}
.btn:hover{background:var(--ciel)}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn svg{width:22px;height:22px;flex:none}
.btn.go{background:var(--m);border-color:var(--nuit);color:#fff}
.btn.go:hover{filter:brightness(1.1)}
.btn[aria-pressed=true]{background:var(--soleil);color:var(--nuit)}
.btn[aria-pressed=true]::after{content:'✓';font-weight:800}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.mini{min-height:44px;padding:.25rem .7rem;font-size:.88rem;border-radius:11px}
.btn.icone{padding:.25rem;min-width:48px;min-height:48px}
.btn.pulse{animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 3px 0 var(--nuit),0 0 0 7px rgba(255,201,51,.75)}}

/* Mots */
.gloss{all:unset;cursor:pointer;font-weight:600;color:var(--ocean);border-bottom:3px dotted var(--ocean);padding:0 .05em}
.gloss:focus-visible{outline:3px solid var(--soleil)}
.colle{white-space:nowrap}
.colle .gloss{white-space:normal}
.pop{position:fixed;inset:0;z-index:60;background:rgba(36,50,74,.55);display:grid;place-items:center;padding:16px}
.pop>div{background:#fff;border-radius:18px;max-width:520px;width:100%;padding:1.2rem;max-height:90%;overflow:auto;border:3px solid var(--nuit)}
.pop>div>*+*{margin-top:.7rem}
.pop>.large{max-width:860px}
.grid2.mots{grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr))}
.pop .fermer{position:sticky;bottom:-1.2rem;margin-bottom:-1.2rem;padding:.6rem 0 1.2rem;background:#fff}
/* Bulle de Pépin */
.pepin{display:flex;gap:.7rem;align-items:flex-end}
.pepin>svg{width:78px;height:62px;flex:none}
.bulle{position:relative;background:#fff;border:2px solid var(--nuit);border-radius:16px;padding:.65rem .85rem;display:flex;gap:.6rem;align-items:center;flex:1;min-width:0}
.bulle::before{content:'';position:absolute;left:-11px;bottom:14px;width:18px;height:18px;background:#fff;border-left:2px solid var(--nuit);border-bottom:2px solid var(--nuit);transform:rotate(45deg)}
.bulle>div{flex:1;min-width:0}

/* Encadrés */
.retiens{background:#FFF6D6;border:2px solid var(--nuit);border-left-width:10px;border-radius:12px;padding:.8rem 1rem}
.retiens h3{font-size:1.1rem}
.retiens .tete{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-bottom:.3rem}
.fb{border-radius:12px;padding:.6rem .85rem;font-weight:500;display:flex;gap:.55rem;align-items:flex-start}
.fb svg{width:24px;height:24px;flex:none;margin-top:.1rem}
.fb.ok{background:var(--ok-bg);color:#14562B;border:2px solid var(--ok)}
.fb.ko{background:var(--ko-bg);color:#7A3006;border:2px solid var(--ko)}
.fig{margin:0;background:#fff;border:2px solid var(--trait);border-radius:var(--r);padding:.7rem}
.fig figcaption{font-size:.88rem;color:var(--brume);margin-top:.45rem}
.fig svg text{font-family:var(--fb)}
.legende{display:flex;flex-wrap:wrap;gap:.45rem .9rem;font-size:.88rem}
.legende span{display:inline-flex;align-items:center;gap:.35rem}
.legende i{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--nuit);display:inline-block}

/* QCM et options */
.opts{display:flex;flex-direction:column;gap:.6rem}
.opt{display:flex;align-items:center;gap:.7rem;text-align:left;width:100%;min-height:56px;padding:.5rem .8rem;background:#fff;border:2px solid var(--nuit);border-radius:14px;cursor:pointer;box-shadow:0 3px 0 var(--nuit);font-weight:500}
.opt:hover:not([disabled]){background:var(--ciel)}
.opt .let{flex:none;width:34px;height:34px;border-radius:9px;background:var(--nuit);color:#fff;display:grid;place-items:center;font-family:var(--fd)}
.opt.bon{background:var(--ok-bg);border-color:var(--ok);box-shadow:0 3px 0 var(--ok)}
.opt.bon .let{background:var(--ok)}
.opt.faux{background:var(--ko-bg);border-color:var(--ko);box-shadow:none;opacity:.85}
.opt.faux .let{background:var(--ko)}
.opt[disabled]{cursor:default}
.opt svg.mark{width:26px;height:26px;margin-left:auto;flex:none}
.barre{height:14px;border-radius:7px;background:#fff;border:2px solid var(--nuit);overflow:hidden}
.barre i{display:block;height:100%;background:var(--m);transition:width .3s}

/* Tri et association */
.pioche{display:flex;flex-wrap:wrap;gap:.6rem;min-height:64px;padding:.6rem;background:rgba(255,255,255,.65);border:2px dashed var(--brume);border-radius:14px}
.jeton{min-height:50px;max-width:100%;padding:.4rem .8rem;background:#fff;border:2px solid var(--nuit);border-radius:12px;box-shadow:0 3px 0 var(--nuit);cursor:grab;font-weight:500;text-align:left;touch-action:none;user-select:none;-webkit-user-select:none}
.jeton.pris{background:var(--soleil)}
.jeton.bon{background:var(--ok-bg);border-color:var(--ok);box-shadow:none;cursor:default}
.jeton.fantome{position:fixed;z-index:70;pointer-events:none;transform:rotate(-2deg);box-shadow:0 8px 16px rgba(36,50,74,.35)}
.bacs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.7rem}
.bac{min-height:130px;width:100%;background:#fff;border:3px solid var(--bac,var(--nuit));border-radius:14px;padding:.5rem;display:flex;flex-direction:column;gap:.45rem;align-items:stretch;text-align:left;cursor:pointer}
.bac>b{font-family:var(--fd);font-weight:400;font-size:1.15rem;color:var(--bac,var(--nuit));display:flex;align-items:center;gap:.4rem}
.bac>b svg{width:26px;height:26px}
.bac.vise{background:#FFF6D6}
.bac .jeton{pointer-events:none;cursor:default;box-shadow:none;min-height:40px;font-size:.92rem}
.paires{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.6rem 1rem}
.paires>div{display:flex;flex-direction:column;gap:.6rem}
.paires .jeton{cursor:pointer;width:100%;touch-action:manipulation}
.ordre{display:flex;flex-direction:column;gap:.5rem;counter-reset:o}
.ligne{display:flex;align-items:center;gap:.5rem;background:#fff;border:2px solid var(--nuit);border-radius:12px;padding:.3rem .5rem}
.ligne .t{flex:1;font-weight:500}
.ligne.bon{background:var(--ok-bg);border-color:var(--ok)}
.ligne .fixe{flex:none;width:calc(96px + .5rem);min-height:48px;display:grid;place-items:center}
.ligne .fixe svg{width:30px;height:30px}

/* Curseurs */
.curseur{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.curseur label{font-weight:600;flex-basis:100%}
.curseur input[type=range]{flex:1;min-width:140px;height:44px;accent-color:var(--m);cursor:pointer}
.curseur output{font-family:var(--fd);font-size:1.3rem;min-width:4.5ch;text-align:right;font-variant-numeric:tabular-nums}

/* Cartes retournées */
.retour{min-height:150px;padding:.7rem;background:var(--m-bg);border:2px solid var(--nuit);border-radius:14px;cursor:pointer;box-shadow:0 3px 0 var(--nuit);display:flex;flex-direction:column;gap:.35rem;justify-content:center;align-items:center;text-align:center;font-weight:500;width:100%}
.retour b{font-family:var(--fd);font-weight:400;font-size:1.2rem}
.retour.vu{background:#fff}
.retour svg{width:56px;height:56px}
.memo-retour{position:sticky;bottom:5.5rem;z-index:5;align-self:center}

/* Accueil */
.hero{display:grid;gap:.9rem}
.hero h1{font-size:clamp(2.8rem,8vw,5rem);color:var(--nuit)}
.bande{position:relative;border-radius:var(--r);overflow:hidden;border:3px solid var(--nuit);background:var(--nuit)}
.bande svg{width:100%;height:clamp(110px,22vw,190px);display:block}
.bande .ann{position:absolute;bottom:6px;padding:0 .45rem;font-size:.8rem;font-weight:600;background:rgba(36,50,74,.85);color:#fff;border-radius:7px}
.bande .ann.g{left:7px}.bande .ann.d{right:7px}
.lue{font-variant-numeric:tabular-nums;font-weight:600}
.front{height:26px;background-repeat:repeat-x;background-size:92px 26px}
.missions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.9rem}
.mis{position:relative;font-weight:400;display:flex;flex-direction:column;gap:.5rem;text-align:left;text-decoration:none;color:var(--nuit);background:#fff;border:3px solid var(--nuit);border-top:14px solid var(--m);border-radius:var(--r);padding:.8rem;box-shadow:0 4px 0 var(--nuit);transition:transform .1s}
.mis:hover{transform:translateY(-3px)}
.mis h3{font-size:1.25rem;color:var(--m)}
.mis .pt{font-size:.85rem;color:var(--brume);font-weight:500}
.mis .barre{margin-top:auto}
.tampons{display:flex;flex-wrap:wrap;gap:1rem;align-items:center}
.tampon{width:118px;height:118px;flex:none;color:var(--m)}
.tampon.vide{color:var(--brume)}
.tampon.frappe{animation:frappe .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes frappe{from{transform:scale(2.6) rotate(-14deg);opacity:0}to{transform:scale(1) rotate(-6deg);opacity:1}}

/* Barre basse */
.bas{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:3px solid var(--nuit);padding:.5rem max(16px,calc(50vw - 544px));display:flex;gap:.6rem;align-items:center}
.bas .sp{flex:1}

@media (max-width:860px){
  .split,.split.wide-r,.split.wide-l{grid-template-columns:minmax(0,1fr)}
  .missions{grid-template-columns:repeat(2,minmax(0,1fr))}
  h1{font-size:2.1rem} h2{font-size:1.55rem}
}
@media (max-width:520px){
  .missions,.paires{grid-template-columns:minmax(0,1fr)}
  .logo span,.tool .lib{display:none}
  .tampon{width:92px;height:92px}
  .dots{margin-left:0}
  .bas .btn .lib{display:none}
}
@media (max-width:420px){
  .bas{gap:.4rem;padding-left:10px;padding-right:10px}
  .bas .btn{padding:.4rem .6rem}
  .bas .sp{flex:1 1 0;min-width:0}
}
/* Grand écran de classe : tout grandit, pour être lu du fond de la salle */
@media (min-width:1600px) and (min-height:900px){
  html{font-size:150%}
  html[data-size="1"]{font-size:168%} html[data-size="2"]{font-size:190%}
  main{max-width:1560px}
  .top{padding-inline:max(16px,calc(50vw - 780px))}
  .bas{padding-inline:max(16px,calc(50vw - 764px))}
  
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media print{
  .top,.bas,.noprint{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
}


/* Mission Assiette : composants propres au chapitre 5 (préfixe ma-). */
.picto{width:36px;height:36px;flex:none}
.jeton.ic{display:inline-flex;align-items:center;gap:.45rem}
.jeton .picto{width:32px;height:32px}
.bac .jeton .picto{width:26px;height:26px}
.btn .picto{width:28px;height:28px}
.fig svg{width:100%}
.fig svg text{font-family:var(--fb)}
.ma-hero{border-radius:12px}
.hero .fig{padding:.4rem;max-width:760px}

/* Puces de choix libres */
.ma-chips{display:flex;flex-wrap:wrap;gap:.55rem}
.ma-chip{min-height:54px;padding:.3rem .8rem;display:inline-flex;align-items:center;gap:.45rem;background:#fff;color:var(--nuit);border:2px solid var(--nuit);border-radius:14px;box-shadow:0 3px 0 var(--nuit);font-weight:500;cursor:pointer;text-align:left}
.ma-chip:hover{background:var(--ciel)}
.ma-chip[aria-pressed=true]{background:var(--soleil);font-weight:700}
.ma-chip[aria-pressed=true]::after{content:'✓';font-weight:800;margin-left:.1rem}
.ma-chip .picto{width:32px;height:32px}

/* Boutons de choix (MC.choix) */
.ma-opts .btn{min-height:48px;padding:.3rem .7rem;font-weight:500}
.ma-opts .btn[aria-pressed=true]{font-weight:700}

/* Pyramide */
.ma-pyr .ma-et{cursor:pointer;outline:none}
.ma-pyr .ma-et path{transition:filter .2s}
.ma-pyr .ma-et:hover path,.ma-pyr .ma-et:focus-visible path{filter:brightness(1.07);stroke-width:5}
.ma-pyr .ma-et:focus-visible path{stroke:#000;stroke-width:6}
.ma-pyr .ma-et.on path{stroke:var(--m);stroke-width:6}
.ma-etinfo{position:sticky;top:5rem}
.ma-pinbtns{gap:.45rem}
.ma-pinbtns .btn{font-weight:500}
.ma-pinbtns .btn.vu{border-color:var(--ok);background:var(--ok-bg)}
.ma-pinbtns .btn.vu::after{content:'✓';font-weight:800;color:var(--ok)}
.ma-num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--nuit);color:#fff;font-family:var(--fd);font-weight:400}

/* Étiquettes */
.ma-boite{border:3px solid var(--b);border-top-width:16px}
.ma-btete{display:flex;flex-direction:column}
.ma-btete b{font-family:var(--fd);font-weight:400;font-size:1.5rem;color:var(--b)}
.ma-ns{width:190px;height:auto}
.ma-tab{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
.ma-tab caption{text-align:left;font-weight:700;padding-bottom:.3rem}
.ma-tab th{text-align:left;font-weight:500;padding:.25rem .3rem;border-top:1px solid var(--trait)}
.ma-tab td{text-align:right;font-weight:700;padding:.25rem .3rem;border-top:1px solid var(--trait)}
.ma-tab tr.dont th{padding-left:1.2rem;font-style:italic}
.ma-ing{font-size:.9rem}
.ma-sucres{width:min(100%,320px)}
.ma-cube{opacity:.15}.ma-cube.on{opacity:1}

/* Article */
.ma-art{border-left:10px solid var(--m)}

/* Compteur 5 par jour */
.ma-5{display:flex;gap:.5rem}
.ma-5 i{width:40px;height:40px;border-radius:50%;border:3px solid var(--nuit);background:#fff;transition:background .2s}
.ma-5 i.on{background:#5FA83A}
.ma-cpt{font-size:1.05rem}

/* Plateau */
.ma-plateau{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem;background:#E9C79A;border:3px solid var(--nuit);border-radius:18px;padding:.7rem}
.ma-case{background:#fff;border:2px dashed var(--brume);border-radius:12px;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:.85rem;font-weight:600;padding:.3rem;line-height:1.25}
.ma-case.plein{border-style:solid;border-color:var(--nuit)}
.ma-case .picto{width:44px;height:44px}
.ma-case .muted{font-family:var(--fd);font-size:1.6rem}
@media (min-width:861px){.ma-colle{position:sticky;top:5rem}}

/* Carte du monde */
.ma-carte{width:100%;border-radius:12px}
.ma-carte .ma-pin{cursor:pointer}
.ma-carte .ma-pin>circle:not([r="5"]){fill:#fff;stroke:var(--nuit);stroke-width:3}
.ma-carte .ma-pin text{fill:var(--nuit);font-family:var(--fd)}
.ma-carte .ma-pin.vu>circle:not([r="5"]){stroke:var(--ok);stroke-width:5}
.ma-carte .ma-pin.on>circle:not([r="5"]){fill:var(--soleil);stroke-width:6}

/* Graphiques et simulations */
.ma-sim{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem;align-items:start}
@media (max-width:860px){.ma-sim{grid-template-columns:minmax(0,1fr)}}
.ma-etat{font-family:var(--fd);font-size:1.25rem}
.ma-bars{display:flex;flex-direction:column;gap:.5rem}
.ma-bar{display:grid;grid-template-columns:8.5rem minmax(0,1fr);gap:.5rem;align-items:center}
.ma-bar>span{display:flex;align-items:center;gap:.35rem;font-weight:600;font-size:.92rem}
.ma-bar .picto{width:30px;height:30px}
.ma-bar .ma-nuages{display:flex;flex-wrap:wrap;gap:2px;min-height:26px;align-items:center}
.ma-bar .ma-nuages svg{width:22px;height:22px}
.ma-bar .ma-nuages b{font-size:.85rem;margin-left:.3rem}
@media (max-width:520px){.ma-bar{grid-template-columns:minmax(0,1fr)}}

/* Microscope */
.ma-zoom{border-radius:50%;border:8px solid var(--nuit);overflow:hidden;width:min(100%,320px);aspect-ratio:1;margin:0 auto;background:#F7F3EA}
.ma-zoom svg{width:100%;height:100%}

/* Minuteur */
.ma-tps{font-family:var(--fd);font-size:clamp(2.4rem,9vw,3.4rem);font-variant-numeric:tabular-nums;line-height:1}

/* Dossiers enfants du monde */
.ma-dossier{border-left:10px solid var(--m)}
.ma-dossier .ma-dt{display:flex;gap:.7rem;align-items:center}
.ma-dossier .ma-dt svg{width:64px;height:64px;flex:none}

/* Diplôme et pages annexes */
.ma-blocs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.8rem}
.ma-bloc svg{width:100%}
.ma-lien{display:flex;flex-direction:column;gap:.2rem;min-height:120px;padding:.75rem .9rem;background:#fff;border:2px solid var(--nuit);border-radius:14px;box-shadow:0 3px 0 var(--nuit);color:var(--nuit);text-decoration:none;font-weight:400}
.ma-lien:hover{background:var(--m-bg)}
.ma-ouvre{margin-top:auto;display:inline-flex;align-items:center;gap:.3rem;color:var(--m);font-weight:600}
.ma-ouvre svg{width:20px;height:20px}
.ma-ploin h2{font-size:1.45rem;color:var(--m)}

.ma-prof{font-size:.95rem}
.ma-prof h1{font-size:2rem}
.ma-prof h2{font-family:var(--fb);font-weight:600;font-size:1.25rem;letter-spacing:0}
.ma-prof h3{font-family:var(--fb);font-weight:600;font-size:1rem;letter-spacing:0;margin-top:.8rem}
.ma-psec>*+*{margin-top:.6rem}
.ma-prof .txt{max-width:none}
.ma-ptab{border-collapse:collapse;width:100%}
.ma-ptab th{text-align:left;font-weight:600;border-bottom:2px solid var(--nuit);padding:.35rem .5rem}
.ma-ptab td{padding:.4rem .5rem;border-bottom:1px solid var(--trait);vertical-align:top}
.ma-corr li+li{margin-top:.5rem}
.ma-det summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
@media (max-width:640px){
  .ma-ptab thead{display:none}
  .ma-ptab,.ma-ptab tbody,.ma-ptab tr,.ma-ptab td{display:block;width:100%}
  .ma-ptab tr{padding:.45rem 0;border-bottom:2px solid var(--trait)}
  .ma-ptab td{border:0;padding:.1rem 0}
  .ma-ptab td::before{content:attr(data-t)' : ';font-weight:600}
}

.ma-champ{font:inherit;min-height:52px;padding:.3rem .7rem;border:2px solid var(--nuit);border-radius:12px;width:min(100%,280px)}
.ma-dip{background:#fff;border:3px solid var(--nuit);border-radius:6px;overflow:hidden;max-width:680px;width:100%;margin:0 auto;display:flex;flex-direction:column;box-shadow:var(--ombre)}
.ma-dband{display:block;width:100%;height:30px;flex:none}
.ma-dcorps{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.65rem;padding:1.2rem 1rem}
.ma-dpt{font-weight:600;color:var(--brume)}
.ma-dtitre{font-family:var(--fd);font-size:clamp(2rem,7vw,3rem);line-height:1.1;color:#C2361B}
.ma-dnom{min-width:min(100%,300px);min-height:1.4em;font-family:var(--fd);font-size:clamp(1.7rem,6vw,2.5rem);line-height:1.15;border-bottom:3px solid var(--nuit);padding:0 1rem .15rem;max-width:100%;overflow-wrap:anywhere}
.ma-dliste{list-style:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:.25rem}
.ma-dliste li{display:flex;align-items:center;gap:.45rem;margin:0}
.ma-dliste svg{width:22px;height:22px;flex:none}
.ma-dtamps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.4rem;width:100%}
.ma-dtamp{display:flex;flex-direction:column;align-items:center}
.ma-dtamp>span{display:block;transform:rotate(-6deg)}
.ma-dtamp .tampon{width:100%;max-width:112px;height:auto}
.ma-dpied{display:grid;grid-template-columns:minmax(0,1fr) 72px minmax(0,1fr);gap:.6rem;align-items:end;width:100%;margin-top:auto;text-align:center}
.ma-dpied>div{display:flex;flex-direction:column;gap:.15rem;font-size:.85rem}
.ma-dpep{width:72px;height:56px}
.ma-dsign{display:block;height:40px;border-bottom:2px solid var(--nuit)}
.ma-dbrouillon{border-style:dashed}
@media (max-width:520px){
  .ma-dtamps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ma-dpied{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .ma-dpep{display:none}
  .ma-plateau{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media print{
  @page{size:A4 portrait;margin:10mm}
  html:has(.ma-dip){font-size:12pt!important}
  .ma-sansprint{display:none!important}
  .ma-dip,.ma-dip *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ma-dip{width:190mm;height:276mm;max-width:none;margin:0;border:1mm solid var(--nuit);border-radius:0;box-shadow:none;break-inside:avoid}
  .ma-dband{height:10mm}
  .ma-dcorps{gap:4mm;padding:9mm 12mm 7mm;justify-content:space-between}
  .ma-dpt{font-size:13pt}
  .ma-dtitre{font-size:40pt}
  .ma-dnom{font-size:32pt;min-width:110mm}
  .ma-dtxt{font-size:13pt}
  .ma-dliste{font-size:12pt;gap:1.5mm}
  .ma-dtamps{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:3mm}
  .ma-dtamp .tampon{max-width:36mm}
  .ma-dpied{grid-template-columns:minmax(0,1fr) 24mm minmax(0,1fr)!important;font-size:11pt}
  .ma-dpep{display:block!important;width:24mm;height:19mm}
  .ma-dsign{height:14mm}
}

/* Curseurs assez gros pour le doigt et le tableau */
.curseur input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:48px;margin:0}
.curseur input[type=range]::-webkit-slider-runnable-track{height:14px;border-radius:7px;background:var(--m-bg);border:2px solid var(--nuit)}
.curseur input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:36px;height:36px;margin-top:-13px;border-radius:50%;background:var(--soleil);border:3px solid var(--nuit);box-shadow:0 2px 0 var(--nuit)}
.curseur input[type=range]::-moz-range-track{height:10px;border-radius:7px;background:var(--m-bg);border:2px solid var(--nuit)}
.curseur input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--soleil);border:3px solid var(--nuit)}
.curseur output{min-width:6.5ch}

</style>
</head>
<body>
<div id="app"></div>
<div id="annonce" class="sr" role="status" aria-live="polite"></div>

function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v===null||v===undefined||v===false)continue;
    if(k.startsWith('on')&&typeof v==='function')el.addEventListener(k.slice(2),v);
    else if(k==='html')el.innerHTML=v;
    else if(k==='class')el.className=v;
    else el.setAttribute(k,v===true?'':v);
  }
  kids.flat().forEach(c=>{if(c===null||c===undefined||c===false)return;el.append(c.nodeType?c:document.createTextNode(tag==='textarea'?c:typo(c)));});
  return el;
}

const typo=s=>String(s).replace(/ ([:;?!»%]|°C)/g,'\u00a0$1').replace(/(\d) (mètres|km|ans|min)\b/g,'$1\u00a0$2').replace(/« /g,'«\u00a0').replace(/(\p{L})-(t-)?(il|ils|elle|elles|on|je|tu|ce)(?![\p{L}-])/gu,(m,l,t,p)=>`${l}-\u2060${t?'t-\u2060':''}${p}`);

MC.rich=function(t){
  return esc(typo(t))
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,a,b)=>`<button type="button" class="gloss" data-t="${a}">${b||a}</button>`)
    .replace(/\b(CO|CH|N|O)([24])(O?)\b/g,(m,a,n,o)=>`${a}<sub>${n}</sub>${o}`)

};

const reduit=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;

/* Sons ---------------------------------------------------------------- */
let ac=null;
function son(notes){
  if(!S.prefs.son)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
    notes.forEach(([f,t,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.16,ac.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+t+d);
      o.connect(g).connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+d+.02);});
  }catch(e){}
}
MC.son={ok:()=>son([[660,0,.12],[880,.1,.2]]),ko:()=>son([[300,0,.18]]),fin:()=>son([[523,0,.14],[659,.12,.14],[784,.24,.14],[1047,.36,.34]])};

  const t=g.getAttribute('data-t'),d=MC.gloss[t]||MC.gloss[t.toLowerCase()];
  MC.popup(h('div',null,h('h3',null,t.charAt(0).toUpperCase()+t.slice(1)),h('p',{html:MC.rich(d||'Demande à ton professeur.')})));
});
const ouverts=[];
MC.popup=function(contenu){
  const prev=document.activeElement;
  const clore=rendre=>{ouverts.splice(ouverts.indexOf(clore),1);p.remove();document.removeEventListener('keydown',clavier);if(rendre&&prev&&prev.focus)prev.focus();};
  const fermer=()=>clore(true);
  const clavier=e=>{
    if(ouverts[ouverts.length-1]!==clore)return;
    if(e.key==='Escape'){fermer();return;}
    if(e.key!=='Tab')return;
    const l=[...p.querySelectorAll('button,a[href],input,select,textarea,[tabindex="0"]')].filter(x=>!x.disabled&&x.offsetParent!==null);
    if(!l.length)return;
    const a=document.activeElement,prem=l[0],dern=l[l.length-1];
    if(!p.contains(a)||(e.shiftKey&&a===prem)){e.preventDefault();(e.shiftKey?dern:prem).focus();}
    else if(!e.shiftKey&&a===dern){e.preventDefault();prem.focus();}
  };
  const f=h('button',{type:'button',class:'btn go mini',onclick:fermer},'Fermer');
  const tete=contenu.querySelector&&contenu.querySelector('h1,h2,h3');
  const p=h('div',{class:'pop',role:'dialog','aria-modal':'true','aria-label':tete?tete.textContent:'Fenêtre',onclick:e=>{if(e.target===p)fermer();}},h('div',null,contenu,h('div',{class:'row fermer'},f)));
  ouverts.push(clore);document.addEventListener('keydown',clavier);document.body.append(p);f.focus({preventScroll:true});return fermer;
};

/* Widget : QCM. questions=[{q,options:[],bon:index,aide,expli}] */
MC.qcm=function(root,o){
  const id=o.id;let file=o.questions.map((q,i)=>i),pos=0,rates=[],premier=0,premiereManche=true,debut=true;
  const zone=h('div',{class:'stack'});root.append(zone);
  /* Après un changement de contenu, on repart du haut de la zone si la page était descendue */
  const hautZone=()=>{if(debut){debut=false;return;}const t=document.querySelector('.top'),m=t?t.getBoundingClientRect().bottom:0;if(zone.getBoundingClientRect().top<m)voir(zone,{block:'start',behavior:'auto'});};
  function question(){
    const q=o.questions[file[pos]];let essais=0;
    const pr=h('div',{class:'barre',role:'progressbar','aria-valuemin':0,'aria-valuemax':file.length,'aria-valuenow':pos,'aria-label':'Progression des questions'},h('i',{style:`width:${pos/file.length*100}%`}));
    const fb=h('div',{'aria-live':'polite'});
    const suite=h('button',{type:'button',class:'btn go',hidden:true,onclick:()=>{pos++;pos<file.length?question():bilan();}},pos+1<file.length?'Question suivante':'Voir mon résultat',MC.icone('droite'));
    const opts=h('div',{class:'opts'},q.options.map((t,i)=>{
      const b=h('button',{type:'button',class:'opt',onclick:()=>{
        if(i===q.bon){
          b.classList.add('bon');b.append(MC.icone('ok','mark'));
          opts.querySelectorAll('button').forEach(x=>x.disabled=true);
          if(essais===0&&premiereManche)premier++;
          MC.son.ok();
          fb.replaceChildren(h('div',{class:'fb ok'},MC.icone('ok'),h('div',{html:'<b>Bravo !</b> '+MC.rich(q.expli||'')})));
          suite.hidden=false;suite.focus({preventScroll:true});setTimeout(()=>voir(suite));
        }else{
          essais++;b.classList.add('faux');b.disabled=true;b.append(MC.icone('ko','mark'));MC.son.ko();
          if(!rates.includes(file[pos]))rates.push(file[pos]);
          fb.replaceChildren(h('div',{class:'fb ko'},MC.icone('ko'),h('div',{html:'<b>Pas encore.</b> '+MC.rich(q.aide||'Essaie une autre réponse.')})));
          /* le bouton touché se désactive : le clavier passe à la réponse encore possible suivante */
          const l=[...opts.querySelectorAll('button')],apres=l.slice(i+1).concat(l.slice(0,i)).find(x=>!x.disabled);
          if(apres)apres.focus({preventScroll:true});
        }
      }},h('span',{class:'let'},'ABCD'[i]),h('span',{html:MC.rich(t)}));
      return b;
    }));
    const total=file.length;
    const titre=h('h3',{style:'flex:1',tabindex:-1,html:MC.rich(q.q)});
    const nouvelle=!debut;
    zone.replaceChildren(h('div',{class:'row'},h('b',null,`Question ${pos+1} sur ${total}`)),pr,
      h('div',{class:'card'},h('div',{class:'row',style:'flex-wrap:nowrap;align-items:flex-start'},titre)),
      opts,fb,h('div',{class:'row'},suite));
    hautZone();
    if(nouvelle)titre.focus({preventScroll:true});
  }
  function bilan(){
    const total=o.questions.length,score=premiereManche?premier:(S.qcm[id]?S.qcm[id].score:0);
    if(premiereManche){const a=S.qcm[id];if(!a||score>=a.score)S.qcm[id]={score,total};sauver();}
    /* Chaque question se termine par la bonne réponse. Reste à revoir celles où il y a eu une erreur dans cette manche. */
    const trouvees=total-rates.length,toutCorrige=!premiereManche&&!rates.length;
    const nb=Math.max(1,Math.round(trouvees/total*3));
    const etoiles=h('div',{class:'row',role:'img','aria-label':`${nb} ${nb>1?'étoiles':'étoile'} sur 3`},[0,1,2].map(i=>{const e=MC.icone('etoile');e.style.width='56px';e.style.height='56px';if(i>=nb)e.style.opacity='.18';return e;}));
    MC.son.fin();
    const relance=rates.slice();
    const rep=n=>n>1?'bonnes réponses':'bonne réponse';
    const titre=premiereManche?`${trouvees} ${rep(trouvees)} du premier coup sur ${total}`:toutCorrige?'Tu as trouvé toutes les réponses. Bravo !':`${trouvees} ${rep(trouvees)} sur ${total}`;
    const reste=relance.length,mot=reste>1?`Il te reste ${reste} questions à revoir.`:'Il te reste 1 question à revoir.';
    const msg=toutCorrige?'Tu as corrigé tes erreurs. Bien joué !':!premiereManche?`Tu y es presque. ${mot}`:!reste?'Parfait ! Tu n\'as fait aucune erreur.':trouvees/total>=.6?'Bien joué ! Tu peux refaire les questions difficiles.':'Tu progresses. Refais les questions difficiles : c\'est comme ça qu\'on apprend.';
    zone.replaceChildren(h('div',{class:'card stack'},h('h3',{tabindex:-1},titre),etoiles,
      MC.pepin(msg,toutCorrige||trouvees/total>=.6?'content':'pense'),
      h('div',{class:'row'},reste?h('button',{type:'button',class:'btn',onclick:()=>{file=relance;rates=[];pos=0;premiereManche=false;question();}},MC.icone('refaire'),'Refaire ces questions'):null,
        h('button',{type:'button',class:'btn',onclick:()=>{file=o.questions.map((q,i)=>i);rates=[];pos=0;premier=0;premiereManche=true;question();}},'Tout recommencer'))));
    hautZone();
    zone.querySelector('h3').focus({preventScroll:true});
    if(o.fini)o.fini(score,total);
  }
  question();
};

/* Étape de devoir : à utiliser dans le rendu d'une étape {quiz:true}. L'id est celui de la mission. */

/* Glisser ou toucher : on prend un jeton puis on le pose. */
function prenable(j,poser,cibles,prendre){
  let dep=null,fant=null,vise=null;
  const sous=(x,y)=>{const e=document.elementFromPoint(x,y);return e&&e.closest(cibles);};
  /* au doigt, un glisser ne produit pas de click : l'indicateur de glisser précédent est effacé ici */
  j.addEventListener('pointerdown',e=>{if(j.disabled)return;delete j.dataset.glisse;dep={x:e.clientX,y:e.clientY};j.setPointerCapture&&j.setPointerCapture(e.pointerId);});
  j.addEventListener('pointermove',e=>{
    if(!dep)return;
    if(!fant&&Math.hypot(e.clientX-dep.x,e.clientY-dep.y)>10){fant=j.cloneNode(true);fant.classList.add('fantome');fant.style.width=j.offsetWidth+'px';document.body.append(fant);prendre(j);}
    if(fant){fant.style.left=e.clientX-30+'px';fant.style.top=e.clientY-24+'px';const b=sous(e.clientX,e.clientY);if(vise&&vise!==b)vise.classList.remove('vise');if(b){b.classList.add('vise');vise=b;}}
  });
  const fin=e=>{if(!dep)return;dep=null;if(vise)vise.classList.remove('vise');
    if(fant){fant.remove();fant=null;j.dataset.glisse='1';const b=sous(e.clientX,e.clientY);if(b)poser(b);vise=null;}};
  j.addEventListener('pointerup',fin);j.addEventListener('pointercancel',()=>{dep=null;if(fant){fant.remove();fant=null;}});
}

/* Widget : tri dans des bacs. bacs=[{id,nom,couleur,icone}], items=[{t,bac,pourquoi}] */
MC.tri=function(root,o){
  let pris=null,restants=o.items.length,erreurs=0;
  const fb=h('div',{'aria-live':'polite'});
  const pioche=h('div',{class:'pioche'});
  const choisir=j=>{if(pris){pris.classList.remove('pris');pris.setAttribute('aria-pressed','false');}pris=j;if(j){j.classList.add('pris');j.setAttribute('aria-pressed','true');}};
  const poser=b=>{
    if(!pris){fb.replaceChildren(h('div',{class:'fb ko'},MC.icone('ko'),h('div',null,'Touche d\'abord une carte à trier.')));return;}
    const it=pris._item,bac=b._bac;
    if(it.bac===bac.id){
      pris.classList.remove('pris');pris.setAttribute('aria-pressed','false');pris.classList.add('bon');pris.disabled=true;b.append(pris);restants--;MC.son.ok();
      fb.replaceChildren(h('div',{class:'fb ok'},MC.icone('ok'),h('div',{html:'<b>Oui !</b> '+MC.rich(it.pourquoi||'')})));
      pris=null;
      if(!restants){MC.son.fin();pioche.remove();fb.append(h('div',{class:'fb ok',style:'margin-top:.5rem'},MC.icone('ok'),h('div',{html:erreurs?'<b>Tout est trié !</b>':'<b>Tout est trié, sans erreur !</b>'})));if(o.fini)o.fini(erreurs);}
    }else{
      erreurs++;MC.son.ko();
      fb.replaceChildren(h('div',{class:'fb ko'},MC.icone('ko'),h('div',{html:'<b>Pas ici.</b> '+MC.rich(it.aide||'Essaie une autre case.')})));
      choisir(null);
    }
  };
  const bacs=h('div',{class:'bacs'},o.bacs.map(b=>{
    const n=h('div',{class:'bac',style:`--bac:${b.couleur||'var(--nuit)'}`,role:'button',tabindex:0,'aria-label':'Poser dans '+b.nom,
      onclick:e=>{if(!e.target.closest('.jeton'))poser(n);},onkeydown:e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();poser(n);}}},
      h('b',null,b.icone?MC.icone(b.icone):null,b.nom));
    n._bac=b;return n;
  }));
  melange(o.items).forEach(it=>{
    const j=h('button',{type:'button',class:'jeton'+(it.ic?' ic':''),onclick:()=>{if(j.disabled)return;if(j.dataset.glisse){delete j.dataset.glisse;return;}choisir(pris===j?null:j);}},it.ic&&MC.picto?MC.picto(it.ic):null,h('span',{html:MC.rich(it.t)}));
    j._item=it;prenable(j,poser,'.bac',choisir);pioche.append(j);
  });
  root.append(h('div',{class:'stack'},o.consigne?MC.pepin(o.consigne,'pense'):null,pioche,bacs,fb));
};

/* Widget : relier deux par deux. paires=[{a,b,pourquoi}] */
MC.relier=function(root,o){
  let choixA=null,reste=o.paires.length;const fb=h('div',{'aria-live':'polite'});
  const G=h('div'),D=h('div');
  const faire=(p,cote)=>h('button',{type:'button',class:'jeton',html:MC.rich(p[cote])});
  melange(o.paires).forEach(p=>{const j=faire(p,'a');j._p=p;j.addEventListener('click',()=>{if(j.disabled)return;if(choixA)choixA.classList.remove('pris');choixA=j;j.classList.add('pris');});G.append(j);});
  melange(o.paires).forEach(p=>{const j=faire(p,'b');j._p=p;j.addEventListener('click',()=>{
    if(j.disabled)return;
    if(!choixA){fb.replaceChildren(h('div',{class:'fb ko'},MC.icone('ko'),h('div',null,'Touche d\'abord une carte à gauche.')));return;}
    if(choixA._p===p){[j,choixA].forEach(x=>{x.classList.remove('pris');x.classList.add('bon');x.disabled=true;});choixA=null;reste--;MC.son.ok();
      fb.replaceChildren(h('div',{class:'fb ok'},MC.icone('ok'),h('div',{html:'<b>Oui !</b> '+MC.rich(p.pourquoi||'')})));
      if(!reste){MC.son.fin();if(o.fini)o.fini();}
    }else{MC.son.ko();choixA.classList.remove('pris');choixA=null;fb.replaceChildren(h('div',{class:'fb ko'},MC.icone('ko'),h('div',null,'Ces deux cartes ne vont pas ensemble. Essaie encore.')));}
  });D.append(j);});
  root.append(h('div',{class:'stack'},o.consigne?MC.pepin(o.consigne,'pense'):null,h('div',{class:'paires'},G,D),fb));
};

/* Widget : remettre dans l'ordre. items dans le bon ordre.
   Après chaque essai, les lignes bien placées sont cochées et figées. À partir du 3e essai, le jeu place une ligne de plus.
   aide (facultatif) : indice donné tant que la première ligne n'est pas trouvée. */
MC.ordre=function(root,o){
  let liste=melange(o.items.map((t,i)=>({t,i}))),essais=0;
  if(liste.every((x,i)=>x.i===i))liste.reverse();
  const zone=h('div',{class:'ordre'}),fb=h('div',{'aria-live':'polite'}),figees=new Set();
  const voisine=(i,s)=>{for(let j=i+s;j>=0&&j<liste.length;j+=s)if(!figees.has(liste[j].i))return j;return -1;};
  const bouger=(i,s)=>{const j=voisine(i,s),x=liste[i];[liste[i],liste[j]]=[liste[j],liste[i]];dessiner(x.i,s);};
  const fleche=(x,i,s)=>h('button',{type:'button',class:'btn icone mini','aria-label':(s<0?'Monter : ':'Descendre : ')+MC.parlable(x.t),'data-s':s,disabled:voisine(i,s)<0,onclick:()=>bouger(i,s)},svgFleche(s));
  function dessiner(suivie,s){
    zone.replaceChildren(...liste.map((x,i)=>{const f=figees.has(x.i);return h('div',{class:'ligne'+(f?' bon':''),'data-i':x.i},
      f?h('span',{class:'fixe',role:'img','aria-label':'Bien placée'},MC.icone('ok')):[fleche(x,i,-1),fleche(x,i,1)],
      h('span',{class:'t',html:MC.rich(x.t)}));}));
    /* le clavier reste sur la ligne déplacée */
    if(suivie===undefined)return;
    const bs=[...zone.querySelectorAll(`[data-i="${suivie}"] button:not([disabled])`)],b=bs.find(e=>+e.dataset.s===s)||bs[0];
    if(b)b.focus();
  }
  const figer=()=>liste.forEach((x,i)=>{if(x.i===i)figees.add(x.i);});
  const aide=()=>{
    const k=liste.findIndex((x,i)=>x.i!==i);
    if(k<0)return 'Touche Vérifier.';
    if(k===0)return o.aide||'Commence par ce qui se passe en premier.';
    return `Cherche ce qui vient juste après : « ${o.items[k-1].replace(/[.!]\s*$/,'')} ».`;
  };
  const verifier=()=>{
    if(liste.every((x,i)=>x.i===i)){MC.son.fin();figer();dessiner();verif.disabled=true;fb.replaceChildren(h('div',{class:'fb ok'},MC.icone('ok'),h('div',{html:'<b>C\'est le bon ordre !</b> '+MC.rich(o.bravo||'')})));if(o.fini)o.fini();return;}
    MC.son.ko();essais++;figer();
    let msg;
    if(essais>=3){
      const k=liste.findIndex((x,i)=>x.i!==i),j=liste.findIndex(x=>x.i===k);

/* Mémory. paires=[{a,b}]. Deux cartes différentes restent ouvertes jusqu'à ce que l'élève choisisse de les retourner. */
MC.memory=function(root,o){
  const paquet=melange(o.paires.flatMap((p,i)=>[{t:p.a,i},{t:p.b,i}]));
  let ouv=[],trouve=0,coups=0,attente=null;
  const cacher=v=>{v.b.classList.remove('vu');v.b.setAttribute('aria-label','Carte cachée');v.b.replaceChildren(MC.icone('pomme'));};
  const retourner=h('button',{type:'button',class:'btn go memo-retour',hidden:true,onclick:()=>{attente.forEach(cacher);const prem=attente[0].b;attente=null;retourner.hidden=true;retourner.classList.remove('pulse');prem.focus();}},MC.icone('refaire'),'Retourner les cartes');
  const g=h('div',{class:'grid3'},paquet.map(c=>{
    const b=h('button',{type:'button',class:'retour',style:'min-height:110px','aria-label':'Carte cachée',onclick:()=>{
      if(attente){retourner.classList.add('pulse');return;}
      if(b.classList.contains('vu'))return;
      b.classList.add('vu');b.setAttribute('aria-label',c.t);b.replaceChildren(h('span',{html:MC.rich(c.t.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,a,x)=>x||a))}));
      /* la 2e carte se lit à la suite de la 1re, sans la couper */
      ouv.push({b,c});
      if(ouv.length===2){coups++;const [x,y]=ouv;ouv=[];
        if(x.c.i===y.c.i){trouve++;MC.son.ok();[x,y].forEach(v=>{v.b.style.borderColor='var(--ok)';v.b.style.background='var(--ok-bg)';});if(trouve===o.paires.length){MC.son.fin();if(o.fini)o.fini(coups);}}
        else{attente=[x,y];retourner.hidden=false;retourner.focus({preventScroll:true});MC.annonce('Ces deux cartes ne vont pas ensemble.');}}
    }},MC.icone('pomme'));
    return b;
  }));
  root.append(h('div',{class:'stack'},o.consigne?MC.pepin(o.consigne,'pense'):null,g,retourner));
};

function melange(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function etape(m,i){
  const s=m.steps[i],k=cle(m,s);document.title='Mission Assiette';
  const contenu=h('div',{class:'stack'});
  const suiv=h('button',{type:'button',class:'btn go',hidden:!!s.quiz&&!S.fait[k],onclick:()=>{if(i+1<m.steps.length)MC.go(cle(m,m.steps[i+1]));else MC.go(m.id+'-fin');}},h('span',null,i+1<m.steps.length?'Suivant':'Terminer'),MC.icone('droite'));
  let rendue=false,salue=false,connus=new Set();
  /* Tout retour .fb qui apparaît après une action, même dans un composant de module, est amené à l'écran. */
  new MutationObserver(l=>{
    if(!rendue)return;
    const f=[];l.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1)f.push(...(n.matches('.fb')?[n]:n.querySelectorAll('.fb')));}));
    if(f.length)voir(f[f.length-1]);
  }).observe(contenu,{childList:true,subtree:true});
  const retiensVisibles=()=>[...contenu.querySelectorAll('.retiens')].filter(e=>e.offsetParent!==null);
  const marquer=()=>{if(!S.fait[k]){S.fait[k]=1;sauver();}suiv.hidden=false;majJauge();const d=document.querySelector('.dot.on');if(d)d.classList.add('fait');};
  /* À la réussite : d'abord le « Je retiens » s'il vient d'apparaître, ensuite seulement l'appel à passer à la suite */
  const api={el:contenu,mission:m,fait:()=>{
    marquer();
    if(!rendue||salue){suiv.classList.add('pulse');return;}
    salue=true;
    setTimeout(()=>{
      if(!contenu.isConnected)return;
      const r=retiensVisibles().filter(e=>!connus.has(e)).pop();
      if(!r){suiv.classList.add('pulse');return;}
      const x=r.getBoundingClientRect(),t=document.querySelector('.top'),b=document.querySelector('.bas');
      const cache=x.top<(t?t.getBoundingClientRect().bottom:0)||x.bottom>(b?b.getBoundingClientRect().top:innerHeight);
      if(cache)voir(r);
      setTimeout(()=>suiv.classList.add('pulse'),cache?1400:0);
    });
  }};
  const dots=h('nav',{class:'dots','aria-label':'Étapes de la mission'},m.steps.map((x,j)=>h('a',{class:'dot'+(j===i?' on':'')+(S.fait[cle(m,x)]?' fait':''),href:'#'+cle(m,x),title:x.titre,'aria-label':`Étape ${j+1} : ${x.titre}`,'aria-current':j===i?'step':null})));
  const bas=h('div',{class:'bas noprint'},
    h('button',{type:'button',class:'btn','aria-label':'Étape précédente',onclick:()=>MC.go(i?cle(m,m.steps[i-1]):'accueil')},MC.icone('gauche'),h('span',{class:'lib'},i?'Retour':'Accueil')),
    h('span',{class:'sp'}),suiv);
  ecran([h('div',{class:'stack '+m.id},
    h('div',{class:'head'},h('div',null,h('div',{class:'num'},`Mission ${m.n} · Étape ${i+1} sur ${m.steps.length}`),h('h2',{},s.titre)),dots),
    contenu)],bas);
  bas.classList.add(m.id);
  s.rendu(contenu,api);
  if(s.auto)marquer();
  connus=new Set(retiensVisibles());rendue=true;
  if(s.auto)suiv.classList.add('pulse');
}

/* Un double clic sur la barre du bas ne doit pas sauter une étape : le bouton suivant apparaît au même endroit. */
const GARDE=350;let arrivee=-1e9;

function route(){
  arrivee=performance.now();
  ouverts.slice().reverse().forEach(c=>c(false));
  const id=(location.hash||'#accueil').slice(1);
  if(id==='accueil'||!id)return accueil();
  if(id==='mots')return mots();
  if(MC.pages[id])return ecran([MC.pages[id](h)]);
  for(const m of MC.missions){
    if(id===m.id+'-fin')return finMission(m);
    const i=m.steps.findIndex(s=>cle(m,s)===id);
    if(i>=0)return etape(m,i);
  }
  accueil();
}

/* Carte du monde (Natural Earth, projection équirectangulaire 1000 x 500). */
const K=1000/360;
MC.pj=(lon,lat)=>[+((lon+180)*K).toFixed(1),+((90-lat)*K).toFixed(1)];
let propre=null;
MC.monde=function(){
  if(propre)return propre;
  propre=MC.data.world.split('M').filter(Boolean).map(sp=>{
    const pts=sp.replace(/Z/g,'').split('L').map(p=>p.trim().split(/\s+/).map(Number));
    const deux=[[],[]];let c=0;
    pts.forEach((p,i)=>{if(i&&Math.abs(p[0]-pts[i-1][0])>200)c=1-c;deux[c].push(p);});
    return deux.filter(d=>d.length>2).map(d=>'M'+d.map(p=>p.join(' ')).join('L')+'Z').join('');
  }).join('');
  return propre;
};
/* pins=[{id,lon,lat,n (texte court dans le rond),nom}] ; choisir(id) appelé au toucher.
   Les ronds sont doublés par une rangée de boutons sous la carte : plus faciles au doigt et au clavier. */
MC.carte=function(o){
  const vb=o.vb||[0,40,1000,380],r=o.r||20;
  const pins=o.pins.map(p=>{const [x,y]=MC.pj(p.lon,p.lat);const dx=p.dx||0,dy=p.dy||0;
    return `<g class="ma-pin" data-id="${p.id}">${dx||dy?`<path d="M${x} ${y}L${x+dx} ${y+dy}" stroke="${N}" stroke-width="3"/><circle cx="${x}" cy="${y}" r="5" fill="${N}"/>`:''}<circle cx="${x+dx}" cy="${y+dy}" r="${r}"/>${p.ic?MC.pictoSvg(p.ic,x+dx-r*.72,y+dy-r*.72,r*1.44):`<text x="${x+dx}" y="${y+dy+r*.36}" text-anchor="middle" font-size="${r}" font-weight="700">${p.n||''}</text>`}</g>`;}).join('');
  const el=MC.svg(`<svg class="ma-carte" viewBox="${vb.join(' ')}" role="img" aria-label="${o.aria||'Carte du monde'}"><rect x="${vb[0]}" y="${vb[1]}" width="${vb[2]}" height="${vb[3]}" fill="#CFE8F2"/><path d="${MC.monde()}" fill="#EBDDB5" stroke="#9C8F62" stroke-width=".8"/>${o.fond||''}${pins}</svg>`);
  const boutons=h('div',{class:'row ma-pinbtns'},o.pins.map(p=>h('button',{type:'button',class:'btn mini','data-id':p.id,onclick:()=>o.choisir(p.id)},p.ic?MC.picto(p.ic):h('span',{class:'ma-num'},p.n),p.nom)));
  el.querySelectorAll('.ma-pin').forEach(g=>g.addEventListener('click',()=>o.choisir(g.dataset.id)));
  const marquer=id=>{const g=el.querySelector(`.ma-pin[data-id="${id}"]`);if(g)g.classList.add('vu');const b=boutons.querySelector(`[data-id="${id}"]`);if(b)b.classList.add('vu');
    el.querySelectorAll('.ma-pin').forEach(x=>x.classList.toggle('on',x.dataset.id===id));};
  return {el,boutons,marquer};
};

/* Choix d'une option parmi plusieurs (boutons à bascule). */
MC.choix=function(opts,quand,cls){
  const box=h('div',{class:'row '+(cls||''),role:'group'});
  opts.forEach(([v,t,ic])=>box.append(h('button',{type:'button',class:'btn','aria-pressed':'false','data-v':v,onclick:e=>{
    box.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===e.currentTarget?'true':'false'));quand(v);}},ic?MC.picto(ic):null,t)));
  box.valeur=v=>{const b=box.querySelector(`[data-v="${v}"]`);if(b)b.click();};
  return box;
};

/* Petites piles de morceaux de sucre (1 morceau = environ 5 g). */
MC.sucres=function(n,max){
  const c=[];for(let i=0;i<(max||n);i++){const x=(i%6)*34,y=Math.floor(i/6)*30;
    c.push(`<g transform="translate(${x} ${y})" class="ma-cube${i<n?' on':''}"><path d="M4 12l12-7 14 4v12l-12 7-14-4z" fill="#fff" stroke="${N}" stroke-width="2" stroke-linejoin="round"/><path d="M4 12l14 4 12-7M18 16v12" fill="none" stroke="${N}" stroke-width="2" stroke-linejoin="round"/></g>`);}
  const lignes=Math.ceil((max||n)/6);
  return `<svg viewBox="0 0 206 ${lignes*30+6}" aria-hidden="true" class="ma-sucres">${c.join('')}</svg>`;
};

function svgPyramide(){
  /* Sommet virtuel en (300,40). 5 étages de 44 de haut, de y=310 (bas) à y=90. La pointe (40 à 90) est posée à part, décalée. */

  const etapes=[['ble','Le blé pousse dans le champ.'],['tracteur','On moissonne : on récolte les grains.'],['farine','Au moulin, on écrase les grains : c\'est la farine.'],['eau','Le boulanger mélange farine, eau, sel et levure.'],['levure','La pâte repose et gonfle.'],['pain','On cuit le pain au four.']];
  el.append(MC.pepin('Beaucoup d\'aliments sont **transformés** avant d\'arriver dans notre assiette. Ils deviennent meilleurs, plus faciles à manger, ou se gardent plus longtemps.','pense'));
  MC.ordre(el,{consigne:'Du champ au pain : remets les étapes dans l\'ordre.',items:etapes.map(e=>e[1]),aide:'Tout commence dans le champ.',bravo:'Du blé au pain, il y a beaucoup de métiers : agriculteur, meunier, boulanger.',
    fini:()=>{el.append(MC.fig(`<svg viewBox="0 0 640 120"><rect width="640" height="120" rx="14" fill="#E6F2DA"/>${etapes.map((e,i)=>`${MC.pictoSvg(e[0],18+i*104,30,60)}${i<5?`<path d="M${88+i*104} 60h22l-6-6M${110+i*104} 60l-6 6" stroke="${N}" stroke-width="3" fill="none" stroke-linecap="round"/>`:''}`).join('')}</svg>`,null,'Du blé au pain en six étapes : le blé, la moisson, la farine, la pâte, la pâte qui gonfle, le pain cuit.'),
      MC.question('Pain blanc ou pain complet : lequel garde le plus de vitamines et de fibres ?','Le **pain complet**. Pour faire de la farine blanche, on enlève l\'enveloppe du grain. On enlève aussi une partie des vitamines, des minéraux et des [[fibres]].'),
      MC.retiens(['La **transformation** change un aliment : le blé devient farine, puis pain. Le lait devient yaourt ou fromage.','Trop transformer peut enlever des nutriments.']));api.fait();}});
}

  let c;
  const choisir=id=>{const r=REG.find(x=>x.id===id);vus.add(id);c.marquer(id);MC.son.ok();
    info.replaceChildren(h('h3',null,`${r.n}. ${r.nom}`),MC.p(`Viennent d'ici : **${r.l.join(', ')}**.`),MC.p(r.t),h('p',{class:'muted'},`Régions découvertes : ${vus.size} sur ${REG.length}`));

        {q:'D\'où vient la **pomme** ?',options:['D\'Amérique','D\'Asie centrale','D\'Afrique'],bon:1,aide:'Cherche les forêts de pommiers sauvages.',expli:'La pomme vient d\'Asie centrale, au Kazakhstan.'},
        {q:'D\'où viennent la **pêche** et l\'**abricot** ?',options:['De Chine','Du Mexique','D\'Europe'],bon:0,aide:'C\'est très loin, à l\'est.',expli:'Ils viennent de Chine.'},
        {q:'Quel légume poussait **déjà en Europe** ?',options:['La tomate','Le chou','Le citron'],bon:1,aide:'La tomate vient d\'Amérique, le citron d\'Inde.',expli:'Le chou poussait déjà en Europe.'},

/* ---------- Étape 4 : conserver ---------- */
function conserver(el,api){
  const M=[['frigo','La réfrigération','Au réfrigérateur, vers 4 °C.'],['flocon','La congélation','Au congélateur, à −18 °C.'],['sel','La salaison','Avec beaucoup de sel.'],['abricotsec','Le séchage','On enlève l\'eau.'],['conserve','La stérilisation','On chauffe très fort une boîte fermée.'],['lait','La pasteurisation','On chauffe le lait quelques secondes.'],['confiture','La confiture','On cuit les fruits avec beaucoup de sucre.']];
  el.append(MC.pepin('Les aliments s\'abîment : ils pourrissent ou ils moisissent. Pour les garder plus longtemps, on les **conserve**. Voici les grandes méthodes.','pense'),
    h('div',{class:'grid3'},M.map(([ic,t,d])=>h('div',{class:'card',style:'text-align:center'},h('div',{style:'display:flex;justify-content:center'},MC.picto(ic,'')),h('b',null,t),h('p',{class:'muted'},d)))));
  el.querySelectorAll('.grid3 .picto').forEach(s=>{s.style.width='56px';s.style.height='56px';});
  const apres=h('div',{class:'stack'});
  MC.memory(el,{consigne:'Le mémory de la conservation : retrouve chaque méthode et son exemple.',paires:[
    {a:'Réfrigération',b:'Le yaourt dans le frigo'},{a:'Congélation',b:'Les petits pois surgelés'},{a:'Salaison',b:'Le jambon sec'},
    {a:'Séchage',b:'Les abricots secs'},{a:'Stérilisation',b:'Les haricots en boîte'},{a:'Pasteurisation',b:'La bouteille de lait'}],
   fini:()=>{apres.append(MC.question('Comment la pasteurisation aide-t-elle à conserver le lait ?','On chauffe le lait vers 72 °C pendant quelques secondes. La chaleur **tue les microbes dangereux**. Ensuite, on garde le lait au frais.'),
      MC.pepin('Pourquoi le froid, le sel ou la chaleur conservent-ils les aliments ? Tu le découvriras dans la **mission 3**, avec les microbes !','content'),
      MC.retiens(['Pour conserver un aliment : le **froid** (réfrigération, congélation), la **chaleur** (pasteurisation, stérilisation), le **sel**, le **sucre**, le **séchage**.','La congélation garde bien les vitamines.']));api.fait();}});
  el.append(apres);
}

/* kg équivalent CO2 par kg d'aliment, moyennes mondiales (Poore et Nemecek 2018, via Our World in Data). 1 nuage = 5 kg. */
const GES=[['steak','Bœuf',99.5],['fromage','Fromage',23.9],['jambon','Porc',12.3],['poulet','Poulet',9.9],['oeuf','Œufs',4.7],['riz','Riz',4.5],['tomate','Tomates',2.1],['lentilles','Légumes secs',1],['pdt','Pommes de terre',.5]];
const NUAGE=`<path d="M6 18h12a4 4 0 0 0 .5-8A6 6 0 0 0 7 9.500 4.300 4.300 0 0 0 6 18z" fill="#8A93A6" stroke="${N}" stroke-width="1.500"/>`;

    GES.map(([ic,t,v])=>{const n=v/5,pleins=Math.floor(n),reste=n-pleins;
      return h('div',{class:'ma-bar'},h('span',null,MC.picto(ic),t),h('div',{class:'ma-nuages'},
        ...Array.from({length:pleins},()=>MC.svg(`<svg viewBox="0 0 24 24" aria-hidden="true">${NUAGE}</svg>`)),

}

/* Mission 3 : Les microbes et nous. Ajout : le livret ne fait que citer la fermentation, alors que le programme
   de sixième met l'accent sur les micro-organismes (Eduscol, livret p. 15). */
(function(){
'use strict';
const h=MC.h,N='#24324A',VIO='#6A3FA0';
const vis=k=>`<svg viewBox="0 0 40 40" aria-hidden="true">${MC.ALI[k]}</svg>`;
/* nombre pseudo-aléatoire stable, pour que les dessins ne bougent pas d'un affichage à l'autre */
const rnd=(i,k)=>{const x=Math.sin(i*127.1+k*311.7)*43758.5453;return x-Math.floor(x);};

/* ---------- Étape 1 : invisibles ---------- */
function bacteriesSvg(){
  let g='';
  for(let i=0;i<16;i++){const x=20+rnd(i,1)*260,y=20+rnd(i,2)*260,a=rnd(i,3)*180;g+=`<rect x="${x-14}" y="${y-4}" width="28" height="8" rx="4" fill="${VIO}" transform="rotate(${a.toFixed(0)} ${x.toFixed(0)} ${y.toFixed(0)})"/>`;}
  for(let i=0;i<9;i++){const x=30+rnd(i,4)*240,y=30+rnd(i,5)*240,a=rnd(i,6)*180;
    g+=`<g transform="rotate(${a.toFixed(0)} ${x.toFixed(0)} ${y.toFixed(0)})">${[0,1,2,3].map(j=>`<circle cx="${(x+j*8.5).toFixed(0)}" cy="${y.toFixed(0)}" r="4.300" fill="#8E5CC8"/>`).join('')}</g>`;}
  return g;
}
function invisibles(el,api){
  const niv=['×1 : à l\'œil nu','×10 : à la loupe','×100 : au microscope','×1000 : au microscope'];
  const txt=['Une goutte de yaourt. On ne voit rien de spécial.','Toujours rien… Juste du blanc.','On voit de petits points.','Les voilà ! Des milliers de **bactéries** : des bâtonnets et des petites chaînes de billes.'];
  const lue=h('p',{class:'lue','aria-live':'polite'});
  const zoom=MC.svg(`<svg viewBox="0 0 300 300" role="img" aria-label="Vue dans le microscope"><rect width="300" height="300" fill="#FBF8F1"/>
    <g class="z0"><ellipse cx="150" cy="160" rx="70" ry="44" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><ellipse cx="128" cy="146" rx="18" ry="8" fill="#F4F0E6"/></g>
    <g class="z1" opacity="0"><rect width="300" height="300" fill="#FFFDF8"/><circle cx="90" cy="110" r="30" fill="#F7F3EA"/><circle cx="210" cy="190" r="40" fill="#F7F3EA"/></g>
    <g class="z2" opacity="0"><rect width="300" height="300" fill="#FBF6FF"/>${Array.from({length:70},(_,i)=>`<circle cx="${(rnd(i,7)*300).toFixed(0)}" cy="${(rnd(i,8)*300).toFixed(0)}" r="1.600" fill="${VIO}"/>`).join('')}</g>
    <g class="z3" opacity="0"><rect width="300" height="300" fill="#F4EEFB"/>${bacteriesSvg()}</g></svg>`);
  const ronds=h('div',{class:'ma-zoom'},zoom);
  let max=0;
  const cur=MC.curseur({id:'zoom',nom:'Grossissement',min:0,max:3,val:0,fmt:v=>niv[v].split(' :')[0],change:v=>{
    [0,1,2,3].forEach(i=>zoom.querySelector('.z'+i).setAttribute('opacity',i<=v?1:0));
    lue.innerHTML=MC.rich(niv[v]+'. '+txt[v]);
    if(v>max)max=v;
    if(v===3&&!suite.childNodes.length)montrerSuite();}});
  const suite=h('div',{class:'stack'});
  const montrerSuite=()=>{
    suite.append(MC.retiens('Un [[micro-organisme]] (ou [[microbe]]) est un être vivant **si petit** qu\'on ne le voit qu\'au [[microscope]].'));
    MC.cartes(suite,{cartes:[
      {titre:'Les bactéries',visuel:vis('microbe'),dos:'Elles sont partout : dans l\'air, sur la peau, dans notre ventre. Certaines font le yaourt et le fromage. D\'autres rendent malade.'},
      {titre:'Les levures',visuel:vis('levure'),dos:'Ce sont des **champignons microscopiques**. La levure du boulanger fait gonfler la pâte à pain.'},
      {titre:'Les moisissures',visuel:vis('moisi'),dos:'Ce sont aussi des champignons. Quand ils sont très nombreux, on voit une mousse verte ou blanche sur le pain ou les fruits. Certaines sont utiles : les taches bleues du roquefort !'}],
     fini:()=>{suite.append(MC.retiens(['Il existe trois grands groupes de microbes dans nos aliments : les **bactéries**, les **levures** et les **moisissures**.']));api.fait();}});
  };
  el.append(MC.pepin('Autour de nous vivent des êtres vivants minuscules. Fais glisser le curseur pour regarder une goutte de yaourt de plus en plus près.','pense'),
    h('div',{class:'ma-sim'},ronds,h('div',{class:'card stack'},cur,lue)),suite);
}

/* ---------- Étape 3 : le yaourt ---------- */
const VIT={4:.02,20:.06,43:.21,70:0};
function pot(p,mort,sans){
  const t=Math.min(1,p),col=t>=1?'#FFFDF5':t>.5?'#FFFBEF':'#FFFFFF';
  const surf=t>=1?'M62 92h116':`M62 ${92+3*(1-t)}q14 ${-6*(1-t)} 29 0t29 0 29 0 29 0`;
  const nb=mort||sans?0:Math.round(3+t*22);

/* ---------- Diplôme ---------- */
MC.page('diplome',()=>{
  const E=MC.etat(),ms=MC.missions,manque=ms.filter(m=>!MC.finie(m));
  const complet=ms.length>=4&&!manque.length;
  const dateFr=new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
  let g=MC.note('ma-genre')||'Expert';
  const bande=()=>MC.svg(`<svg class="ma-dband" viewBox="0 0 400 20" preserveAspectRatio="none" aria-hidden="true">${Array.from({length:40},(_,i)=>`<rect x="${i*10}" width="10.4" height="20" fill="${['#C2361B','#3B7A12','#6A3FA0','#0A6E94'][i%4]}"/>`).join('')}</svg>`);
  const nomEl=h('p',{class:'ma-dnom'}),titreEl=h('p',{class:'ma-dtitre'});
  const majNom=()=>{nomEl.textContent=E.nom.trim()||'\u00a0';titreEl.textContent=complet?`${g} de l'assiette`:(g==='Experte'?'Future experte de l\'assiette':'Futur expert de l\'assiette');};
  const pep=MC.svg(MC.pepinSvg('content'));pep.classList.add('ma-dpep');
  const feuille=h('article',{class:'ma-dip'+(complet?'':' ma-dbrouillon')},bande(),
    h('div',{class:'ma-dcorps'},
      h('p',{class:'ma-dpt'},complet?'Mission Assiette : diplôme':'Mission Assiette : diplôme en préparation'),
      titreEl,h('p',{class:'ma-dpt'},complet?'Ce diplôme est remis à':'Au nom de'),nomEl,
      h('p',{class:'ma-dtxt'},complet?'pour avoir réussi les 4 missions de l\'enquête sur l\'alimentation avec Pépin.':'qui mène l\'enquête sur l\'alimentation avec Pépin.'),
      complet?h('ul',{class:'ma-dliste'},['Composer un repas équilibré','Expliquer comment on conserve les aliments','Dire à quoi servent les microbes','Respecter les façons de manger du monde'].map(t=>h('li',null,MC.icone('ok'),t))):null,
      h('div',{class:'ma-dtamps'},ms.map(m=>h('div',{class:'ma-dtamp'},h('span',{class:m.id},MC.tampon(m,!MC.finie(m)))))),
      h('div',{class:'ma-dpied'},h('div',null,h('b',null,'Date'),h('span',null,dateFr)),pep,h('div',null,h('b',null,'Signature du professeur'),h('span',{class:'ma-dsign'})))),
    bande());
  const champ=h('input',{id:'ma-dprenom',type:'text',class:'ma-champ',value:E.nom,maxlength:30,autocomplete:'off',oninput:e=>{E.nom=e.target.value;MC.sauver();majNom();}});
  const choixG=h('div',{class:'row',role:'group','aria-label':'Forme du titre'},['Expert','Experte'].map(t=>h('button',{type:'button',class:'btn mini'+(g===t?' go':''),'aria-pressed':g===t?'true':'false',onclick:()=>{g=t;MC.note('ma-genre',t);[...choixG.children].forEach(b=>{const on=b.textContent===t;b.classList.toggle('go',on);b.setAttribute('aria-pressed',on?'true':'false');});majNom();}},t)));
  majNom();
  const msg=h('div',{'aria-live':'polite'});
  const imprimer=()=>{try{window.print();}catch(err){msg.replaceChildren(h('div',{class:'fb ko'},MC.icone('ko'),h('div',null,'L\'impression ne marche pas ici. Utilise le menu de ton navigateur.')));}};
  const restant=complet?null:h('div',{class:'stack'},
    MC.pepin(manque.length===1?'Ton diplôme t\'attend. Il te reste une mission à finir.':`Ton diplôme t'attend. Il te reste ${manque.length} missions à finir.`,'content'),
    h('div',{class:'row'},manque.map(m=>{const s=m.steps.find(x=>!E.fait[m.id+'-'+x.id])||m.steps[0];return h('a',{class:'btn '+m.id,href:'#'+m.id+'-'+s.id},`Mission ${m.n} : ${m.titre}`,MC.icone('droite'));})));
  return h('div',{class:'stack m1'},
    h('div',{class:'stack ma-sansprint'},h('h1',null,complet?'Bravo, voici ton diplôme !':'Mon diplôme'),restant,
      h('div',{class:'row'},h('label',{for:'ma-dprenom',style:'font-weight:600'},'Ton prénom :'),champ,choixG)),
    feuille,
    h('div',{class:'row ma-sansprint'},complet?h('button',{type:'button',class:'btn go',onclick:imprimer},MC.icone('imprimer'),'Imprimer mon diplôme'):null,h('a',{class:'btn',href:'#bilan'},'Le grand bilan'),retourAccueil()),
    msg);
});

/* ---------- Espace enseignant ---------- */
const CORRECTIONS=[
 ['Attendus de fin de cycle (p. 15)','Les deux attendus cités par le livret (paléoenvironnements, grandes crises biologiques) appartiennent à un autre thème du programme. La page reprend l\'attendu du cycle 3 qui correspond : « Expliquer les besoins variables en aliments de l\'être humain ; l\'origine et les techniques mises en œuvre pour transformer et conserver les aliments ». Les connaissances et compétences de fin de sixième du livret sont conservées.'],
 ['Origine de la pomme (p. 9)','Le livret la fait venir du Caucase. La pomme cultivée descend surtout du pommier sauvage d\'Asie centrale (Malus sieversii, Kazakhstan) : c\'est ce que dit la page.'],
 ['Poire et lentilles (p. 9)','La poire « de Chine » ne vaut que pour la poire asiatique ; la poire européenne vient d\'Europe et d\'Asie occidentale. Les lentilles, citées parmi les plantes « de chez nous », ont été domestiquées au Proche-Orient. Ces deux exemples ne sont pas repris.'],
 ['Bienfaits des légumes (p. 5)','« Protéger de maladies graves, comme le diabète ou le cancer » devient « diminuer le risque ». L\'affirmation sur les antioxydants qui « rendent la peau plus belle » n\'est pas reprise, faute d\'appui solide.'],
 ['Produits laitiers et protéines (p. 4)','« Protéines maigres » et « produits laitiers faibles en gras » reprennent des recommandations américaines pour adultes. Les repères français pour les enfants ne demandent pas de laitages allégés : la page dit « des produits laitiers » et « viande, poisson, œufs, légumes secs ».'],
 ['Local ou de saison (p. 5, devoir n°12)','La page précise que la nature de l\'aliment (viande ou végétaux) pèse en général plus que la distance parcourue, sauf pour le transport en avion et les serres chauffées. La bonne réponse du devoir n°12, question 5, ne change pas.']
];

 ['Agriculture biologique (devoir n°13, question 6)','La réponse du corrigé est gardée. À nuancer à l\'oral si la question vient : le bio n\'utilise pas de produits de synthèse, mais ses rendements sont plus faibles et certains traitements naturels restent autorisés.'],
 ['Fermentation','Le livret parle de sucres transformés « en alcool ou en acides ». La page précise les deux cas étudiés : le yaourt (acide lactique) et le pain (dioxyde de carbone qui fait lever la pâte ; l\'alcool produit s\'évapore à la cuisson).'],
 ['Pyramide alimentaire (p. 3)','La pyramide est redessinée pour la page, d\'après le modèle Food in Action (Haute École Léonard de Vinci, Belgique) reproduit dans le livret. Les fréquences sont simplifiées. En France, les repères officiels sont ceux du PNNS (« Manger Bouger »).'],

 ['Liens (p. 18)','Le test de la pyramide alimentaire annoncé sur enrx.fr n\'apparaît pas sur la page indiquée, qui ne propose que cinq jeux sur les milieux naturels : il n\'est pas repris. Les vidéos Lumni sont celles du livret : nous n\'avons pas pu ouvrir lumni.fr pour les vérifier, testez-les avant la séance. Le lien du cours (segpa.org/j98u) mène bien au Genially « Chapitre 5 : Alimentation humaine ».']

    sect('Activités ajoutées au livret',

      MC.liste(['Mission 3 en entier : microscope virtuel, tri des microbes utiles et nuisibles, simulation du yaourt (température, durée, ferments, courbe de pH du capteur), expérience de la pâte et du ballon, courbes de conservation, lavage des mains.','Mission 1 : pyramide à explorer et à reconstruire, deux étiquettes inventées avec Nutri-Score, compteur des 5 portions, plateau-repas, cartes sur les carences.','Mission 2 : tri des origines, du blé au pain, carte des origines, mémory de la conservation, comparaison des émissions par aliment.','Mission 4 : carte des aliments de base, dossiers des quatre enfants avec quiz, tri végétarien et végan, sucre d\'une canette, tri des saisons.','Grand bilan avec quiz et diplôme.'])),
